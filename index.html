<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 교실</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<style>
/* ── 색 손잡이 ────────────────────────────────────────────
   화면에 쓰는 색은 모두 여기 이름으로만 씁니다. 아래 테마들은
   이 이름들의 값만 갈아끼우므로 구조는 전혀 건드리지 않습니다.
   테마 고르기 : 오른쪽 아래 동그란 버튼 (또는 T 키) */
:root{
  /* 바탕과 글자 */
  --bg:#EEF3F9; --card:#FFFFFF; --ink:#111C33; --soft:#6E7E99; --line:#DFE7F1;
  --bw:.09rem;                                  /* 테두리 두께 */

  /* 강조색 */
  --note:#E11D48; --cal:#F0821E; --meal:#12A150; --accent:#0B5CAB;

  /* 시간표 칸 */
  --slot:#F6F9FD; --slot-done:#F2F5F9;
  --done-line:#D5DEEA; --done-ink:#A9B6C9; --done-soft:#BCC7D6;
  --chip:rgba(255,255,255,.94); --chip-ink:#6E7E99;

  /* 표·보조면 */
  --grid:#EFF3F9; --week-ink:#7C8AA3; --today-col:#F3F7FD;
  --tone:#EDF2F8; --scroll:#CFDAE8;

  /* 겹쳐 뜨는 것 */
  --tip:rgba(17,28,51,.96); --tip-ink:#FFFFFF; --shadow:17,28,51;
  --preview-bg:#FFE9B8; --preview-ink:#7A4B00; --ev-ink:#9A5A12;
  --sun:#E11D48; --sat:#2563EB;
  --btn:#111C33; --btn-ink:#FFFFFF;

  --r-hero:1.1rem; --r-card:.75rem;
}

/* ── 테마 ② 초록 칠판 : 교실 칠판에 분필로 쓴 느낌 ─────── */
html[data-theme="chalk"]{
  --bg:#0E2B24; --card:#143B31; --ink:#F4F7F0; --soft:#9DBBAF; --line:#255547;
  --note:#FF6B81; --cal:#FFC15E; --meal:#7FD68A; --accent:#BFE8D2;
  --slot:#1B4A3D; --slot-done:#173F35;
  --done-line:#2B5A4B; --done-ink:#6E9184; --done-soft:#5D8175;
  --chip:rgba(9,32,26,.88); --chip-ink:#BFD8CC;
  --grid:#235045; --week-ink:#A9C6BA; --today-col:#1D5142;
  --tone:#1A4438; --scroll:#2F6553;
  --tip:rgba(6,24,19,.96); --shadow:3,20,15;
  --preview-bg:#4A3B12; --preview-ink:#FFD98A; --ev-ink:#FFD9A0;
  --sun:#FF8A9B; --sat:#8ECBFF;
  --btn:#7FD68A; --btn-ink:#0B2A22;
}

/* ── 테마 ③ 야간 먹빛 : 불 꺼진 교실에서 눈이 편한 어둠 ── */
html[data-theme="night"]{
  --bg:#0B1020; --card:#141A2E; --ink:#EAF0FF; --soft:#8D9BC0; --line:#26304C;
  --note:#FF5B7F; --cal:#FFB347; --meal:#3DD68C; --accent:#7AA2FF;
  --slot:#1A2136; --slot-done:#161C2E;
  --done-line:#2A3450; --done-ink:#6B769B; --done-soft:#5C6688;
  --chip:rgba(8,12,26,.9); --chip-ink:#A9B6DA;
  --grid:#232C46; --week-ink:#9AA7CC; --today-col:#1E2740;
  --tone:#1A2136; --scroll:#38446A;
  --tip:rgba(4,8,20,.96); --shadow:2,6,18;
  --preview-bg:#3A2E12; --preview-ink:#FFD98A; --ev-ink:#FFC98A;
  --sun:#FF7A93; --sat:#8AB6FF;
  --btn:#7AA2FF; --btn-ink:#0B1020;
}

/* ── 테마 ④ 한지 종이 : 따뜻한 종이에 먹과 단청 ────────── */
html[data-theme="hanji"]{
  --bg:#F4EDDF; --card:#FDF9F0; --ink:#2E2A24; --soft:#8A7F6B; --line:#E3D8C2;
  --note:#C0392B; --cal:#C97B18; --meal:#4F7A3A; --accent:#7A5C2E;
  --slot:#F7F1E3; --slot-done:#F1EADB;
  --done-line:#DCCFB6; --done-ink:#B0A48C; --done-soft:#C2B69E;
  --chip:rgba(253,249,240,.95); --chip-ink:#8A7F6B;
  --grid:#EDE4D2; --week-ink:#8B8067; --today-col:#F6EFDD;
  --tone:#F0E8D6; --scroll:#D8CBB2;
  --tip:rgba(46,42,36,.96); --shadow:70,58,40;
  --preview-bg:#F3DDA8; --preview-ink:#6B4A12; --ev-ink:#96601A;
  --sun:#C0392B; --sat:#2F6DA8;
  --btn:#2E2A24; --btn-ink:#FDF9F0;
}

/* ── 테마 ⑤ 크고 선명 : 교실 맨 뒤에서도 읽히는 고대비 ─── */
html[data-theme="bold"]{
  --bg:#FFFFFF; --card:#FFFFFF; --ink:#000000; --soft:#2B2B2B; --line:#111111;
  --bw:.14rem;
  --note:#D40000; --cal:#B45000; --meal:#00713C; --accent:#0033CC;
  --slot:#F2F2F2; --slot-done:#E6E6E6;
  --done-line:#8A8A8A; --done-ink:#5A5A5A; --done-soft:#5A5A5A;
  --chip:#FFFFFF; --chip-ink:#111111;
  --grid:#B4B4B4; --week-ink:#151515; --today-col:#FFF3C4;
  --tone:#EFEFEF; --scroll:#9A9A9A;
  --tip:rgba(0,0,0,.95); --shadow:0,0,0;
  --preview-bg:#FFE566; --preview-ink:#5A3A00; --ev-ink:#7A3E00;
  --sun:#D40000; --sat:#0033CC;
  --btn:#000000; --btn-ink:#FFFFFF;
}
html[data-theme="bold"] .weekcard td{ font-weight:800; }
html[data-theme="bold"] .weekcard td.today{ font-weight:900; }

/* 전체 크기 손잡이
   · 가로(72)와 세로(40.5) 중 더 빡빡한 쪽을 따르므로 어떤 해상도에서도 넘치지 않습니다
   · --zoom : 사용자 확대/축소 배율 (Ctrl+휠, +/- 키, 두 손가락 확대) */
html{
  --zoom:1;
  font-size:calc(min(100vw / 72, 100vh / 40.5) * var(--zoom));
}

*{ box-sizing:border-box; margin:0; padding:0; }
body{
  width:100vw; height:100vh; overflow:hidden; background:var(--bg); color:var(--ink);
  font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  font-weight:600; -webkit-font-smoothing:antialiased; cursor:default; user-select:none;
}
body.idle{ cursor:none; }
[hidden]{ display:none !important; }
svg{ display:block; }

#app{
  display:grid; width:100%; height:100%; gap:.65rem;
  padding:.8rem 1.1rem 3.9rem;          /* 아래 여백 = 고정 일정 띠 자리 */
  grid-template-columns:55fr 45fr;      /* 급식 : 주간 시간표 = 55 : 45 */
  grid-template-rows:auto auto minmax(0,1fr) auto;
  grid-template-areas:"head head" "line line" "meal week" "note note";
}
#app > *{ min-width:0; min-height:0; }

/* ── 머리말 ────────────────────────────────────────────── */
.head{ grid-area:head; display:flex; align-items:center; justify-content:space-between; gap:1rem;
  padding:0 .3rem; }
.head .room{ display:flex; align-items:center; gap:.5rem;
  font-size:2rem; font-weight:900; letter-spacing:-.02em; cursor:pointer; }
.head .room svg{ width:1.7rem; height:1.7rem; color:var(--soft); }
.head .room:hover,.head .room:focus-visible{ color:var(--accent); outline:none; }
.head .now{ display:flex; align-items:baseline; gap:.5rem; }
.head .nowlabel{ font-size:1.05rem; font-weight:800; color:var(--soft); }
.head .clock{ font-size:3rem; font-weight:900; letter-spacing:-.035em;
  font-variant-numeric:tabular-nums; line-height:1; }
.head .nav{ display:flex; align-items:center; gap:.4rem; }
.head .navlabel{ font-size:1.05rem; font-weight:800; color:var(--soft); margin-right:.15rem;
  white-space:nowrap; }
.head .date{ font-size:1.45rem; font-weight:800; color:var(--soft);
  min-width:9.5rem; text-align:center; padding:.14rem .5rem; border-radius:.35rem; }
.head .date.preview{ color:var(--preview-ink); background:var(--preview-bg); }
.head .date .sub{ font-size:.68em; font-weight:800; margin-left:.3em; opacity:.8; }
.head .date.loading{ animation:datePulse 1.1s ease-in-out infinite; }
@keyframes datePulse{ 0%,100%{ opacity:1; } 50%{ opacity:.45; } }
.navbtn{ display:grid; place-items:center; width:2.1rem; height:2.1rem;
  border-radius:.5rem; border:var(--bw) solid var(--line); background:var(--card);
  color:var(--soft); cursor:pointer; }
.navbtn svg{ width:1.1rem; height:1.1rem; }
.navbtn:hover,.navbtn:focus-visible{ color:var(--ink); border-color:var(--soft); outline:none; }
.navbtn.today{ width:auto; padding:0 .8rem; font:inherit; font-size:1.05rem; font-weight:900; }
.navbtn.today[data-off]{ visibility:hidden; }   /* 자리는 지키고 모습만 감춤 */

/* ── 카드 공통 ─────────────────────────────────────────── */
.card{ background:var(--card); border:var(--bw) solid var(--line);
  border-radius:var(--r-card); padding:.75rem .9rem; display:flex; flex-direction:column; }
.ct{ display:flex; align-items:center; gap:.42rem; margin-bottom:.55rem;
  font-size:1.22rem; font-weight:900; color:var(--soft); }
.ct svg{ width:1.25rem; height:1.25rem; }
.ct.g{ color:var(--meal); } .ct.o{ color:var(--cal); } .ct.r{ color:var(--note); }
.ct .cal-icon{
  display:grid; place-items:center; width:1.8rem; height:1.8rem; padding:0;
  border:0; border-radius:.4rem; background:transparent; color:inherit; cursor:pointer;
}
.ct .cal-icon:hover,.ct .cal-icon:focus-visible{
  background:color-mix(in srgb, var(--cal) 16%, var(--card)); outline:none; }
.ct .cal-icon svg{ width:1.25rem; height:1.25rem; }
.none{ font-size:1.5rem; font-weight:700; color:var(--soft); }

/* ── 주인공 : 오늘 시간표 타임라인 ─────────────────────── */
.line{
  grid-area:line; background:var(--card); border-radius:var(--r-hero);
  box-shadow:0 .5rem 1.6rem rgba(var(--shadow),.10);
  padding:.8rem .9rem .9rem;
}
.line .ct{ margin-bottom:.6rem; }
.slots{ display:flex; gap:.42rem; align-items:stretch; }
.slot{
  position:relative;
  /* --subject : 어두운 테마에서는 과목 색을 밝게 올려 읽히게 한다 */
  --subject:var(--c);
  flex:1 1 0; min-width:0; border-radius:.6rem; padding:.5rem .45rem .6rem;
  background:var(--slot); border-top:.32rem solid var(--c);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.12rem;
  transition:flex-grow .3s ease;
}
html[data-theme="chalk"] .slot,
html[data-theme="night"] .slot{ --subject:color-mix(in srgb, var(--c) 45%, #FFFFFF); }
.slot .p{ font-size:1.05rem; font-weight:900; color:var(--soft); }
.slot .s{ font-size:2.1rem; font-weight:900; letter-spacing:-.03em; color:var(--subject);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
.slot.done{ background:var(--slot-done); border-top-color:var(--done-line); }
.slot.done .s{ color:var(--done-ink); } .slot.done .p{ color:var(--done-soft); }

.slot.on{
  flex:1.9 1 0; background:var(--c); border-top-color:var(--c);
  box-shadow:0 .3rem .9rem color-mix(in srgb, var(--c) 40%, transparent);
}
.slot.on .p{ color:rgba(255,255,255,.82); font-size:1.15rem; }
.slot.on .s{ color:#fff; font-size:3.3rem; }
.slot.on .left{ font-size:1.2rem; font-weight:800; color:rgba(255,255,255,.9); }
.slot .chg{ font-size:.92rem; font-weight:900; color:#fff; background:var(--note);
  padding:.05rem .38rem; border-radius:.25rem; }
.slot .bar{ width:82%; height:.22rem; border-radius:.11rem;
  background:rgba(255,255,255,.32); overflow:hidden; margin-top:.18rem; }
.slot .bar > i{ display:block; height:100%; background:#fff; width:0; transition:width .9s linear; }

/* 교사명 : 칸 아래 빈 공간에 떠 있는 작은 레이어 — 기존 내용을 가리지 않습니다 */
.slot .tch{
  position:absolute; top:100%; left:50%; transform:translateX(-50%); margin-top:.04rem;
  max-width:100%; z-index:2; pointer-events:none;
  padding:0 .3rem; border-radius:.28rem;
  background:var(--chip); border:.06rem solid var(--line);
  box-shadow:0 .12rem .3rem rgba(var(--shadow),.10);
  font-size:.8rem; font-weight:800; line-height:1.34; color:var(--chip-ink);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.slot.on .tch{ color:var(--subject); border-color:color-mix(in srgb, var(--c) 35%, var(--line)); }
.slot.done .tch{ color:var(--done-ink); }
.slot.mod .tch{ color:var(--note); border-color:color-mix(in srgb, var(--note) 40%, var(--line)); }
.slot .tch .mark{ margin-left:.2rem; color:var(--note); }

/* 상세 레이어창 : 교시를 누르거나 올려두면 변경 내역까지 보여줍니다 */
#tip{
  position:fixed; top:0; left:0; z-index:26; max-width:20rem;
  opacity:0; visibility:hidden; transform:translateY(.3rem);
  transition:opacity .15s ease, transform .15s ease, visibility .15s;
  pointer-events:none;
}
#tip.show{ opacity:1; visibility:visible; transform:none; }
#tip .box{
  background:var(--tip); color:var(--tip-ink); border-radius:.5rem; padding:.5rem .7rem;
  box-shadow:0 .5rem 1.3rem rgba(var(--shadow),.3);
}
#tip .hd{ display:flex; align-items:baseline; gap:.35rem; font-size:1.15rem; font-weight:900;
  letter-spacing:-.02em; }
#tip .hd .pd{ font-size:.9rem; font-weight:800; color:rgba(255,255,255,.7); }
#tip .rw{ margin-top:.2rem; font-size:.95rem; font-weight:700; color:rgba(255,255,255,.9);
  line-height:1.4; }
#tip .rw b{ font-weight:900; }
#tip .rw.warn{ color:#FFC7D2; }
#tip .rw .old{ text-decoration:line-through; opacity:.75; }

/* 확대/축소 안내 */
#zoomToast{
  position:fixed; right:1rem; bottom:7.6rem; z-index:27;   /* 테마 버튼 위에 뜹니다 */
  padding:.3rem .7rem; border-radius:.4rem;
  background:var(--tip); color:var(--tip-ink); font-size:1rem; font-weight:900;
  opacity:0; transition:opacity .25s ease; pointer-events:none;
}
#zoomToast.show{ opacity:1; }

/* ── 테마 고르기 : 오른쪽 아래 떠 있는 버튼 ─────────────── */
#themeWrap{
  position:fixed; right:1rem; bottom:4.2rem; z-index:28;
  display:flex; flex-direction:column; align-items:flex-end; gap:.45rem;
  transition:opacity .4s ease;
}
body.idle #themeWrap{ opacity:0; pointer-events:none; }   /* 수업 중에는 조용히 사라집니다 */

#themeFab{
  display:grid; place-items:center; width:2.9rem; height:2.9rem; border-radius:50%;
  background:var(--card); color:var(--soft); border:var(--bw) solid var(--line);
  box-shadow:0 .3rem .9rem rgba(var(--shadow),.18);
  cursor:pointer; transition:color .15s, transform .15s;
}
#themeFab svg{ width:1.5rem; height:1.5rem; }
#themeFab:hover,#themeFab:focus-visible{ color:var(--accent); transform:translateY(-.1rem); outline:none; }

#themePanel{
  display:none; min-width:12.5rem; padding:.5rem;
  background:var(--card); border:var(--bw) solid var(--line); border-radius:.6rem;
  box-shadow:0 .6rem 1.6rem rgba(var(--shadow),.22);
}
#themePanel.show{ display:block; }
#themePanel .ttl{
  font-size:.92rem; font-weight:900; color:var(--soft);
  padding:.1rem .45rem .35rem;
}
.tbtn{
  display:flex; align-items:center; gap:.55rem; width:100%;
  padding:.36rem .45rem; border:0; border-radius:.42rem;
  background:transparent; color:var(--ink); cursor:pointer; text-align:left;
  font:inherit; font-size:1.05rem; font-weight:800;
}
.tbtn:hover,.tbtn:focus-visible{ background:var(--tone); outline:none; }
.tbtn.on{ background:var(--tone); }
.tbtn .sw{
  flex:0 0 auto; width:1.35rem; height:1.35rem; border-radius:50%;
  border:.08rem solid rgba(var(--shadow),.2);
  background:linear-gradient(135deg, var(--a) 0 50%, var(--b) 50% 100%);
}
.tbtn .ck{ margin-left:auto; font-size:.95rem; font-weight:900; color:var(--accent); }

/* ── 급식 ──────────────────────────────────────────────── */
.mealcard{ grid-area:meal; }
.mealcard .row{ display:flex; gap:.75rem; align-items:stretch; flex:1 1 auto; min-height:0; }
.mealcard ul{ list-style:none; display:flex; flex-wrap:wrap; gap:.12rem 1rem;
  align-content:flex-start; flex:1 1 auto; min-width:0; }
.mealcard li{ display:flex; align-items:center; gap:.36rem;
  font-size:1.35rem; font-weight:800; line-height:1.25; }
.mealcard li::before{ content:''; width:.3rem; height:.3rem; border-radius:50%;
  background:var(--meal); flex:0 0 auto; }
.mealcard .menu{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:.35rem; }
.mealcard .nutrition{
  font-size:.92rem; font-weight:700; color:var(--soft); line-height:1.35;
  letter-spacing:-.01em;
}
/* 급식 사진은 4:3이므로 칸도 4:3으로 두고, 잘라내지 않고 전체를 담습니다 */
.mealcard .shotbox{
  position:relative;
  flex:0 0 12rem; width:12rem; align-self:center;
  aspect-ratio:4 / 3; min-height:8.2rem; max-height:100%;
  border-radius:.55rem;
  background:var(--tone); border:var(--bw) solid var(--line); overflow:hidden;
  display:flex; align-items:center; justify-content:center;
}
.mealcard .shotbox img{ width:100%; height:100%; object-fit:contain; display:block; }
.mealcard .shotbox .empty{ font-size:1.05rem; font-weight:800; color:var(--soft);
  text-align:center; padding:.6rem; line-height:1.35; }
.mealcard .kcal{ margin-left:.35rem; font-size:1.15rem; font-weight:900;
  color:var(--note); letter-spacing:-.02em; }

/* 사진을 누르면 크게 볼 수 있다는 표시 */
.mealcard .shotbox.zoomable{ cursor:zoom-in; }
.mealcard .shotbox.zoomable:hover{ border-color:var(--meal); }
.mealcard .zoomhint{
  position:absolute; right:.3rem; bottom:.3rem; pointer-events:none;
  display:grid; place-items:center; width:1.5rem; height:1.5rem;
  border-radius:.3rem; color:var(--soft);
  background:var(--chip); border:.06rem solid var(--line);
}
.mealcard .zoomhint svg{ width:.95rem; height:.95rem; }
.mealcard .shotbox.zoomable:hover .zoomhint{ color:var(--meal); }

/* 급식 사진 크게 보기 — 아무 데나 다시 누르면 닫힙니다 */
#photoModal{
  position:fixed; inset:0; z-index:29;      /* 테마 버튼(28)보다 위, 설정 화면(30)보다 아래 */
  display:none; align-items:center; justify-content:center;
  padding:1.5rem; cursor:zoom-out;
}
#photoModal.show{ display:flex; }
.photo-backdrop{ position:absolute; inset:0; background:rgba(var(--shadow),.72); }
#photoBig{
  position:relative; z-index:1;
  max-width:100%; max-height:100%; object-fit:contain;
  border-radius:.6rem; box-shadow:0 1rem 2.4rem rgba(var(--shadow),.45);
}
.photo-close{
  position:absolute; right:1.1rem; top:1.1rem; z-index:2; pointer-events:none;
  font-size:1.05rem; font-weight:900; color:#fff;
  background:rgba(var(--shadow),.55); padding:.3rem .75rem; border-radius:.4rem;
}

/* 알레르기 유발 식품 번호 : 메뉴 이름 오른쪽 위에 작게 */
.mealcard li .alg{
  font-size:.62em; font-weight:900; color:var(--note);
  vertical-align:super; letter-spacing:.02em;
}
.mealcard li.more{ color:var(--soft); font-weight:700; }
.mealcard li.more::before{ background:var(--soft); }

.mealcard .allergy{
  font-size:.95rem; font-weight:800; color:var(--note); line-height:1.35;
  letter-spacing:-.01em;
}
/* 원산지는 글이 길어 두 줄까지만 보이고 나머지는 접는다 */
.mealcard .origin{
  font-size:.82rem; font-weight:700; color:var(--soft); line-height:1.3;
  letter-spacing:-.01em;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}

   a, b 는 고르는 목록에 보여 줄 두 색 (바탕색 / 강조색) 입니다 */
const THEMES = [

];
/* BOOT_THEME은 머리말에서 정해 둔, 서버 답이 오기 전에만 쓰는 값입니다 */

  const fromServer = DATA && DATA.config && DATA.config.classStructure;

async function loadStructure(){

  try{
    const url = (EDGE && edgeOk) ? EDGE + '/api/gas?type=config' : API + '?type=config';
    const res = await fetch(url, { cache:'no-store' });
    const body = await res.json();

    document.getElementById('calOpen').innerHTML = ICON.cal;
    document.getElementById('weekTitle').innerHTML = ICON.grid + '<span>주간 시간표<' + '/span>';
    document.getElementById('calPrevMonth').innerHTML = ICON.left;
    document.getElementById('calNextMonth').innerHTML = ICON.right;
    updateNowLabel();
    bindDateNav(); bindIdleCursor(); bindCalendarModal(); bindZoom(); bindTheme();
    bindPhotoZoom();

    // 기기에 남겨 둔 지난번 화면이 있으면 먼저 그려 두고, 최신 값은 뒤에서 받는다
    const snap = loadSnapshot();
    if (snap) dayCache[dayKey(null)] = { data:snap, at:0 };
    load(!!snap, true);

    setInterval(function(){ load(false, false); sendBeat(); }, REFRESH_MS);
    tick(); setInterval(tick, 1000);
    sendBeat();
    registerServiceWorker();
  }catch(err){
    console.error(err);
    document.body.textContent = '화면을 불러오지 못했습니다. 새로고침 해주세요. ' + (err && err.message || err);
  }
}

function moveDay(step){

}
/** @param {boolean} force 사람이 직접 누른 경우 — 보관된 값을 건너뛰고 새로 받아온다 */
function goToday(force){
  hideTip();
  VIEW_DATE = null; clearTimeout(returnTimer);
  load(true, true, force === true);
}
function armReturn(){
  clearTimeout(returnTimer);
  if (VIEW_DATE) returnTimer = setTimeout(goToday, RETURN_MS);
}
function isPreview(){ return !!VIEW_DATE && VIEW_DATE !== todayYmd(); }
function emptyWord(){
  if (!isPreview()) return '오늘은';
  const d = (DATA && DATA.date) || VIEW_DATE;
  return Number(d.slice(4,6)) + '월 ' + Number(d.slice(6,8)) + '일은';
}
function bindIdleCursor(){
  let t = null;
  const hide = function(){ document.body.classList.add('idle'); };
  const show = function(){
    document.body.classList.remove('idle'); clearTimeout(t); t = setTimeout(hide, 5000);
  };
  ['mousemove','touchstart','keydown'].forEach(function(ev){
    document.addEventListener(ev, show, { passive:true });
  });
  t = setTimeout(hide, 5000);
}

/* ── 데이터 불러오기 ───────────────────────────────────────
   서버 응답이 4초 넘게 걸리므로
   · 받아온 날짜는 화면 캐시에 담아 두고
   · 앞뒤 하루를 미리 받아 둬서 날짜 이동이 기다림 없이 넘어가게 한다 */
function dayKey(ymd){ return (ymd || todayYmd()) + '/' + GRADE + '/' + CLASS; }

function dayUrl(ymd, viaEdge, fresh){
  const q = 'grade=' + encodeURIComponent(GRADE) + '&class=' + encodeURIComponent(CLASS)
          + (ymd ? '&date=' + encodeURIComponent(ymd) : '');
  if (viaEdge) return EDGE + '/api/all?' + q + (fresh ? '&fresh=1' : '');
  return API + '?type=all&' + q;
}

/** 빠른 통로가 말썽이면 잠시 Apps Script로 되돌아간다 */
function edgeFailed(err){
  console.warn('빠른 통로 실패 — Apps Script로 직접 부릅니다', err);
  edgeOk = false;
  setTimeout(function(){ edgeOk = true; }, 5 * 60 * 1000);
}

/** @param {boolean} fresh 캐시를 건너뛰고 서버에서 새로 받아온다 */
async function fetchDay(ymd, fresh){
  let res = null;

  if (EDGE && edgeOk){
    try{
      res = await fetch(dayUrl(ymd, true, fresh), { cache:'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
    }catch(err){
      edgeFailed(err);
      res = null;
    }
  }
  if (!res) res = await fetch(dayUrl(ymd, false, fresh), { cache:'no-store' });

  const body = await res.json();
  if (!body.ok) throw new Error(body.error || '응답 오류');

  dayCache[dayKey(ymd)] = { data:body.data, at:Date.now() };
  lastOkAt = Date.now();
  saveSnapshot(ymd, body.data);

  // 보관해 둔 값을 받은 경우다. 통로가 뒤에서 새 값을 받고 있으니 잠시 뒤 한 번 더 확인한다.
  if (res.headers.get('x-cache') === 'stale') queueFollowUp(ymd);
  else delete followUps[dayKey(ymd)];
  return body.data;
}

/* 앱을 켜자마자 지난번 화면을 먼저 보여 주기 위한 저장 ─────────
   전자칠판 앱은 껐다 켜는 일이 잦은데, 그때마다 몇 초씩 빈 화면을
   보지 않도록 마지막으로 본 오늘 화면을 기기에 남겨 둔다. */
function snapKey(){ return 'snap:' + GRADE + '/' + CLASS; }

function saveSnapshot(ymd, data){
  if (ymd && ymd !== todayYmd()) return;      // 지나간 날짜를 켤 때 보여 주면 곤란하다
  try{
    localStorage.setItem(snapKey(), JSON.stringify({ at:Date.now(), date:data.date, data:data }));
  }catch(err){ /* 저장 공간이 없으면 그냥 넘어간다 */ }
}

function loadSnapshot(){
  try{
    const snap = JSON.parse(localStorage.getItem(snapKey()) || 'null');
    if (!snap || !snap.data) return null;
    if (snap.date !== todayYmd()) return null;              // 날짜가 바뀌었으면 쓰지 않는다
    if (Date.now() - snap.at > 12 * 60 * 60 * 1000) return null;
    return snap.data;
  }catch(err){ return null; }
}

/** 보관본을 받았을 때, 뒤에서 갱신이 끝날 즈음 한 번 더 받아 온다 */
const followUps = {};
function queueFollowUp(ymd){
  const key = dayKey(ymd);
  followUps[key] = (followUps[key] || 0) + 1;
  if (followUps[key] > 2) return;             // 서버가 계속 느리면 매달리지 않는다

  setTimeout(async function(){
    if (VIEW_DATE !== (ymd || null)) return;
    const seq = loadSeq;
    try{
      const data = await fetchDay(ymd);
      if (seq === loadSeq && VIEW_DATE === (ymd || null)) showDay(data);
    }catch(err){ /* 다음 자동 갱신 때 다시 받는다 */ }
  }, 6000);
}

function showDay(data){
  DATA = data;
  PERIODS = (DATA.config && DATA.config.periods) || [];
  render(); setStale(false);
}

/** 불러오는 동안에도 바뀐 날짜를 바로 보여 준다 */
function setPending(on, ymd){
  const box = document.getElementById('date');
  box.classList.toggle('loading', !!on);
  if (!on) return;
  const target = ymd || todayYmd();
  box.classList.toggle('preview', target !== todayYmd());
  box.innerHTML = esc(formatDotDate(target)) + '<span class="sub">조회<' + '/span>';
}

/**
 * @param {boolean} useCache 캐시에 있으면 먼저 그리고 뒤에서 갱신한다
 * @param {boolean} prefetch 끝난 뒤 앞뒤 하루를 미리 받아 둔다
 * @param {boolean} fresh    보관된 값을 건너뛰고 서버에서 새로 받아온다
 */
async function load(useCache, prefetch, fresh){
  const target = VIEW_DATE;
  const seq = ++loadSeq;
  const hit = dayCache[dayKey(target)];

  if (useCache && hit){
    showDay(hit.data);
    setPending(false);
    if (fresh || Date.now() - hit.at >= CACHE_TTL_MS) revalidate(target, seq, fresh);
    if (prefetch) queuePrefetch(target);
    return;
  }

  setPending(true, target);
  try{
    // 화살표를 연달아 누를 때 지나친 날짜까지 서버에 묻지 않도록 잠깐 기다린다
    await new Promise(function(done){ setTimeout(done, 180); });
    if (seq !== loadSeq) return;

    const data = await fetchDay(target, fresh);
    if (seq !== loadSeq) return;          // 그새 날짜가 또 바뀌었으면 버린다
    showDay(data);
  }catch(err){
    console.error('불러오기 실패', err);
    setStale(Date.now() - lastOkAt > REFRESH_MS * 2.5);
  }finally{
    if (seq === loadSeq) setPending(false);
  }
  if (prefetch) queuePrefetch(target);
}

/** 캐시로 먼저 그린 뒤 조용히 최신 값으로 바꿔치기 */
async function revalidate(ymd, seq, fresh){
  try{
    const data = await fetchDay(ymd, fresh);
    if (seq === loadSeq && VIEW_DATE === ymd) showDay(data);
  }catch(err){
    console.error('갱신 실패', err);
  }
}

/** 앞뒤 하루 미리 받기 — 화면을 그린 뒤 한숨 쉬고 하나씩 */
function queuePrefetch(ymd){
  clearTimeout(prefetchTimer);
  const base = ymd || todayYmd();
  prefetchTimer = setTimeout(async function(){
    for (const step of [1, -1]){
      const next = shiftYmd(base, step);
      await prefetchDay(next === todayYmd() ? null : next);
    }
  }, 1200);
}

async function prefetchDay(ymd){
  const key = dayKey(ymd);
  const hit = dayCache[key];
  if (hit && Date.now() - hit.at < CACHE_TTL_MS) return;
  if (prefetching[key]) return;
  prefetching[key] = true;
  try{
    await fetchDay(ymd);
  }catch(err){
    /* 미리 받기 실패는 조용히 넘어간다 — 실제 조회 때 다시 시도한다 */
  }finally{
    delete prefetching[key];
  }
}

function setStale(on){ document.getElementById('stale').classList.toggle('show', on); }

/* 이 교실 화면이 살아 있다는 신고 — 하루에 한 번만 보냅니다.
   '접속기록' 시트를 보면 어느 반 칠판이 며칠째 켜지지 않았는지 알 수 있습니다.
   앞단(Worker)을 거치지 않습니다. 보관해 둘 응답이 아니기 때문입니다. */
function sendBeat(){
  if (!GRADE || !CLASS) return;
  const key = 'beat:' + GRADE + '/' + CLASS;
  const today = todayYmd();
  if (lsGet(key) === today) return;

  fetch(API + '?type=beat&grade=' + encodeURIComponent(GRADE)
      + '&class=' + encodeURIComponent(CLASS)
      + '&v=' + encodeURIComponent(APP_VERSION), { cache:'no-store' })
    .then(function(){ lsSet(key, today); })
    .catch(function(){ /* 다음 갱신 때 다시 보낸다 */ });
}

/* 인터넷이 끊겨도 화면 자체(글꼴·틀)는 뜨도록 준비해 둡니다.
   자료는 예전부터 localStorage에 남겨 두고 있었지만, 페이지와 글꼴은
   받아 두지 않아 학교망이 흔들리면 빈 화면이 되곤 했습니다. */
function registerServiceWorker(){
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol !== 'https:' && location.hostname !== 'localhost') return;
  navigator.serviceWorker.register('sw.js').catch(function(err){
    console.warn('오프라인 준비 실패', err);
  });
}

function render(){
  dataStamp++;                 // 자료가 바뀌었으니 시간표 칸을 반드시 다시 그린다
  applyServerTheme();
  renderDate(); renderMeal(); renderWeek(); renderCalendar(); renderNotes(); tick();
}

function renderDate(){
  const d = DATA.date;
  document.getElementById('date').innerHTML =
    esc(formatDotDate(d, DATA.weekday)) + '<span class="sub">조회<' + '/span>';
  const on = isPreview();
  document.getElementById('date').classList.toggle('preview', on);
  const btn = document.getElementById('goToday');
  if (on) btn.removeAttribute('data-off'); else btn.setAttribute('data-off', '');
  document.querySelector('#lineTitle span').textContent = '수업 시간표';
}

function renderSlots(){
  const box = document.getElementById('slots');
  const t = DATA && DATA.timetable;
  if (t && !t.ok){
    SLOT_ROWS = {}; slotSig = ''; if (tipPeriod != null) hideTip();
    box.innerHTML = '<div class="none">시간표를 불러오지 못했습니다<' + '/div>'; return;
  }
  if (!t || !t.value || !t.value.length){
    SLOT_ROWS = {}; slotSig = ''; if (tipPeriod != null) hideTip();
    box.innerHTML = '<div class="none">' + emptyWord() + ' 시간표가 없습니다<' + '/div>'; return;
  }

  const now = new Date();
  const nowMin = isPreview() ? -1 : minutesOf(now);
  const cur = currentSlot(now);
  const curP = (cur && cur.period > 0) ? cur.period : -1;

  // 달라진 것이 없으면 남은 시간과 진행바만 갈아끼우고 끝낸다
  let doneCount = 0;
  t.value.forEach(function(row){ if (slotDone(row.period, nowMin)) doneCount++; });
  const sig = [dataStamp, curP, doneCount, t.value.length].join('|');

  if (sig === slotSig && box.querySelector('.slots')){
    updateLiveSlot(cur, nowMin);
    return;
  }
  slotSig = sig;

  SLOT_ROWS = {};
  box.innerHTML = '<div class="slots">' + t.value.map(function(row){
    const c = subjectColor(row.subject);
    const on = row.period === curP;
    const done = !on && slotDone(row.period, nowMin);
    const cls = 'slot' + (on ? ' on' : done ? ' done' : '') + (row.changed ? ' mod' : '');
    SLOT_ROWS[row.period] = row;
    let inner = '<div class="p">' + row.period + '교시<' + '/div>'
              + '<div class="s">' + esc(row.subject) + '<' + '/div>';
    if (row.changed) inner += '<div class="chg">변경<' + '/div>';
    if (on){
      // 값은 updateLiveSlot이 매초 채운다
      inner += '<div class="left"><' + '/div><div class="bar"><i><' + '/i><' + '/div>';
    }
    const teacher = String(row.teacher || '').trim();
    const prevTeacher = String(row.previousTeacher || '').trim();
    const teacherChanged = Boolean(row.changed && prevTeacher && prevTeacher !== teacher);
    if (teacher){
      inner += '<div class="tch">' + esc(teacher)
             + (teacherChanged ? '<span class="mark">교체<' + '/span>' : '') + '<' + '/div>';
    }
    return '<div class="' + cls + '" style="--c:' + c + '" data-period="' + row.period + '">'
         + inner + '<' + '/div>';
  }).join('') + '<' + '/div>';

  updateLiveSlot(cur, nowMin);
  bindSlotTip();
  syncTip();
}

/**
 * 매초 하는 일은 이것뿐입니다 — 글자 한 곳과 진행바 너비 한 곳.
 * 칸을 다시 만들지 않으므로 떠 있는 설명창도 더 이상 흔들리지 않습니다.
 */
function updateLiveSlot(cur, nowMin){
  const on = document.querySelector('#slots .slot.on');
  if (!on || !cur || cur.period <= 0 || nowMin < 0) return;

  const total = cur.endMin - cur.startMin;
  const pct = total > 0
    ? Math.min(100, Math.max(0, (nowMin - cur.startMin) / total * 100))
    : 0;
  const left = Math.max(0, Math.ceil(cur.endMin - nowMin));

  const leftEl = on.querySelector('.left');
  if (leftEl){
    const text = left > 0 ? left + '분 남음' : '곧 종료';
    if (leftEl.textContent !== text) leftEl.textContent = text;
  }
  const barEl = on.querySelector('.bar > i');
  if (barEl) barEl.style.width = pct.toFixed(1) + '%';
}

/* ── 상세 레이어창 : 교사·변경 내역 ───────────────────────── */
function bindSlotTip(){
  const box = document.getElementById('slots');
  if (!box || box.dataset.tipBound === '1') return;
  box.dataset.tipBound = '1';
  box.addEventListener('mouseover', function(e){
    const slot = e.target.closest ? e.target.closest('.slot') : null;
    if (!slot) return;
    showTip(Number(slot.dataset.period), false);
  });
  box.addEventListener('mouseleave', function(){ if (!tipSticky) hideTip(); });
  box.addEventListener('click', function(e){
    const slot = e.target.closest ? e.target.closest('.slot') : null;
    if (!slot) return;
    const p = Number(slot.dataset.period);
    if (tipPeriod === p && tipSticky){ hideTip(); return; }
    showTip(p, true);
  });
  document.addEventListener('click', function(e){
    if (!tipSticky) return;
    if (e.target.closest && e.target.closest('#slots')) return;
    hideTip();
  });
}

function showTip(period, sticky){
  const row = SLOT_ROWS[period];
  if (!row) return;
  tipPeriod = period;
  tipSticky = !!sticky;
  clearTimeout(tipTimer);

  const teacher = String(row.teacher || '').trim();
  const prevSubject = String(row.previousSubject || '').trim();
  const prevTeacher = String(row.previousTeacher || '').trim();
  const note = String(row.note || '').trim();
  const by = String(row.by || '').trim();

  let html = '<div class="hd"><span>' + esc(row.subject) + '<' + '/span>'
           + '<span class="pd">' + period + '교시<' + '/span><' + '/div>';
  html += '<div class="rw">담당 <b>' + (teacher ? esc(teacher) : '정보 없음') + '<' + '/b><' + '/div>';
  if (row.changed){
    const before = [prevSubject, prevTeacher].filter(Boolean).join(' · ');
    html += before
      ? '<div class="rw warn">변경 전 <span class="old">' + esc(before) + '<' + '/span><' + '/div>'
      : '<div class="rw warn">시간표가 변경되었습니다<' + '/div>';
  }
  if (note) html += '<div class="rw">비고 ' + esc(note) + '<' + '/div>';
  if (by)   html += '<div class="rw">알림 ' + esc(by) + '<' + '/div>';

  document.getElementById('tipBox').innerHTML = html;
  const tip = document.getElementById('tip');
  tip.classList.add('show');
  tip.setAttribute('aria-hidden', 'false');
  placeTip();
  if (sticky) tipTimer = setTimeout(hideTip, 8000);
}

function placeTip(){
  const tip = document.getElementById('tip');
  const slot = document.querySelector('#slots .slot[data-period="' + tipPeriod + '"]');
  if (!slot){ hideTip(); return; }
  const a = slot.getBoundingClientRect();
  const t = tip.getBoundingClientRect();
  const pad = 8, gap = 10;
  let left = a.left + a.width / 2 - t.width / 2;
  left = Math.max(pad, Math.min(left, window.innerWidth - t.width - pad));
  let top = a.bottom + gap;
  if (top + t.height > window.innerHeight - pad) top = a.top - t.height - gap;
  if (top < pad) top = pad;
  tip.style.left = Math.round(left) + 'px';
  tip.style.top  = Math.round(top) + 'px';
}

function syncTip(){
  if (tipPeriod == null) return;
  if (!SLOT_ROWS[tipPeriod]){ hideTip(); return; }
  placeTip();
}

function hideTip(){
  tipPeriod = null; tipSticky = false;
  clearTimeout(tipTimer);
  const tip = document.getElementById('tip');
  tip.classList.remove('show');
  tip.setAttribute('aria-hidden', 'true');
}

/* ── 화면 테마 ─────────────────────────────────────────────── */
function applyTheme(id, save){
  const found = THEMES.some(function(t){ return t.id === id; });
  THEME = found ? id : 'light';

  const root = document.documentElement;
  if (THEME === 'light') root.removeAttribute('data-theme');
  else root.dataset.theme = THEME;

  if (save !== false){
    THEME_CHOSEN = true;         // 교실에서 고른 테마는 학교 기본값보다 우선한다
    try{ localStorage.setItem('theme', THEME); }catch(err){}
  }
  markTheme();
}

/**
 * 학교가 정한 기본 테마(Code.gs의 CONFIG.DEFAULT_THEME)를 받아 둔다.
 * 교실에서 T 키로 직접 고른 적이 있으면 그 교실에서는 바꾸지 않는다.
 */
function rememberDefaultTheme(id){
  if (!id || !THEMES.some(function(t){ return t.id === id; })) return;
  try{ localStorage.setItem('theme:default', id); }catch(err){}
  if (!THEME_CHOSEN && id !== THEME) applyTheme(id, false);
}

function applyServerTheme(){
  rememberDefaultTheme(DATA && DATA.config && DATA.config.defaultTheme);
}

/** 목록에서 지금 쓰는 테마에 표시를 남긴다 */
function markTheme(){
  const list = document.getElementById('themeList');
  if (!list) return;
  Array.prototype.forEach.call(list.querySelectorAll('.tbtn'), function(btn){
    const on = btn.dataset.theme === THEME;
    btn.classList.toggle('on', on);
    btn.setAttribute('aria-checked', on ? 'true' : 'false');
    const ck = btn.querySelector('.ck');
    if (ck) ck.textContent = on ? '✓' : '';
  });
}

function buildThemeList(){
  const list = document.getElementById('themeList');
  if (!list) return;
  list.innerHTML = THEMES.map(function(t){
    return '<button type="button" class="tbtn" role="menuitemradio" data-theme="' + t.id + '"'
         + ' style="--a:' + t.a + ';--b:' + t.b + '">'
         + '<span class="sw"><' + '/span>'
         + '<span class="nm">' + esc(t.name) + '<' + '/span>'
         + '<span class="ck"><' + '/span>'
         + '<' + '/button>';
  }).join('');

  list.addEventListener('click', function(e){
    const btn = e.target.closest('.tbtn');
    if (!btn) return;
    applyTheme(btn.dataset.theme);
    showThemePanel(false);
  });
  markTheme();
}

function showThemePanel(on){
  const panel = document.getElementById('themePanel');
  const fab = document.getElementById('themeFab');
  panel.classList.toggle('show', !!on);
  panel.setAttribute('aria-hidden', on ? 'false' : 'true');
  fab.setAttribute('aria-expanded', on ? 'true' : 'false');
}
function themePanelOpen(){
  return document.getElementById('themePanel').classList.contains('show');
}

/** 목록을 열지 않고 다음 테마로 바로 넘기기 (T 키) */
function cycleTheme(){
  const at = THEMES.findIndex(function(t){ return t.id === THEME; });
  applyTheme(THEMES[(at + 1) % THEMES.length].id);
  showThemePanel(false);
}

function bindTheme(){
  const fab = document.getElementById('themeFab');
  fab.innerHTML = ICON.theme;
  buildThemeList();
  applyTheme(THEME, false);      // 머리말에서 미리 입힌 값을 정리해 둔다

  fab.addEventListener('click', function(e){
    e.stopPropagation();
    showThemePanel(!themePanelOpen());
  });

  // 다른 곳을 누르면 닫는다
  document.addEventListener('click', function(e){
    if (!themePanelOpen()) return;
    if (e.target.closest('#themeWrap')) return;
    showThemePanel(false);
  });

  document.addEventListener('keydown', function(e){
    if (e.key !== 't' && e.key !== 'T') return;
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    if (document.getElementById('setup').classList.contains('show')) return;
    cycleTheme();
  });
}

/* ── 확대 / 축소 ───────────────────────────────────────────── */
function clampZoom(v){
  if (!isFinite(v) || !v) return 1;
  return Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, Math.round(v * 100) / 100));
}
function applyZoom(toast){
  document.documentElement.style.setProperty('--zoom', String(ZOOM));
  try{ localStorage.setItem('zoom', String(ZOOM)); }catch(err){}
  if (toast) showZoomToast();
  syncTip();
}
function nudgeZoom(step){
  const next = clampZoom(ZOOM + step);
  if (next === ZOOM) return;
  ZOOM = next; applyZoom(true);
}
function resetZoom(){ ZOOM = 1; applyZoom(true); }
function showZoomToast(){
  const el = document.getElementById('zoomToast');
  el.textContent = Math.round(ZOOM * 100) + '%';
  el.classList.add('show');
  clearTimeout(zoomToastTimer);
  zoomToastTimer = setTimeout(function(){ el.classList.remove('show'); }, 1200);
}
function bindZoom(){
  window.addEventListener('wheel', function(e){
    if (!e.ctrlKey) return;
    e.preventDefault();
    nudgeZoom(e.deltaY < 0 ? ZOOM_STEP : -ZOOM_STEP);
  }, { passive:false });

  document.addEventListener('keydown', function(e){
    if (e.key === '+' || e.key === '=' || (e.key === 'Add')){ e.preventDefault(); nudgeZoom(ZOOM_STEP); return; }
    if (e.key === '-' || e.key === '_' || (e.key === 'Subtract')){ e.preventDefault(); nudgeZoom(-ZOOM_STEP); return; }
    if (e.key === '0' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); resetZoom(); }
  });

  let pinchBase = 0, pinchZoom = 1;
  const spread = function(touches){
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.hypot(dx, dy);
  };
  document.addEventListener('touchstart', function(e){
    if (e.touches.length !== 2) return;
    pinchBase = spread(e.touches); pinchZoom = ZOOM;
  }, { passive:true });
  document.addEventListener('touchmove', function(e){
    if (e.touches.length !== 2 || !pinchBase) return;
    e.preventDefault();
    const next = clampZoom(pinchZoom * (spread(e.touches) / pinchBase));
    if (next !== ZOOM){ ZOOM = next; applyZoom(true); }
  }, { passive:false });
  document.addEventListener('touchend', function(e){
    if (e.touches.length < 2) pinchBase = 0;
  }, { passive:true });

  window.addEventListener('resize', syncTip);
  applyZoom(false);
}

function renderMeal(){
  const box = document.getElementById('mealBody');
  const title = document.getElementById('mealTitle');
  const mealLabel = '점심 식단';
  const m = DATA.meal;
  if (m && !m.ok){
    title.innerHTML = ICON.meal + '<span>' + mealLabel + '<' + '/span>';
    box.innerHTML = '<div class="none">급식을 불러오지 못했습니다<' + '/div>';
    return;
  }
  if (!m || !m.value || !m.value.length){
    title.innerHTML = ICON.meal + '<span>' + mealLabel + '<' + '/span>';
    box.innerHTML = '<div class="none">' + emptyWord() + ' 급식 정보가 없습니다<' + '/div>';
    return;
  }
  const lunch = m.value.find(function(x){ return /중식/.test(x.type); }) || m.value[0];
  const kcal = String(lunch.kcal || '').trim();
  title.innerHTML = ICON.meal + '<span>' + mealLabel + '<' + '/span>'
    + (kcal ? '<span class="kcal">' + esc(kcal) + '<' + '/span>' : '');

  // 메뉴가 MAX_MEAL보다 많으면 예전에는 조용히 사라졌습니다. 이제 몇 개가
  // 더 있는지 알려 줍니다.
  const all = lunch.dishes || [];
  const dishes = all.slice(0, MAX_MEAL);
  const hidden = all.length - dishes.length;

  let items = dishes.map(function(x){
    const codes = (x.allergy || []).filter(function(c){ return ALLERGY_NAMES[Number(c)]; });
    return '<li>' + esc(dishName(x))
         + (codes.length ? '<span class="alg">' + esc(codes.join('.')) + '<' + '/span>' : '')
         + '<' + '/li>';
  }).join('');
  if (hidden > 0) items += '<li class="more">외 ' + hidden + '개<' + '/li>';

  const allergyNote   = allergyLegend(dishes);
  const nutritionNote = formatNutritionNote(lunch.nutrition);
  const originNote    = String(lunch.origin || '').trim();

  const photoUrl = (DATA.photo && DATA.photo.ok && DATA.photo.value) ? DATA.photo.value : '';
  const photo = photoUrl
    ? '<div class="shotbox zoomable" title="누르면 크게 보입니다">'
        + '<img src="' + esc(photoUrl) + '" alt="급식 사진" onerror="mealPhotoFallback(this)">'
        + '<span class="zoomhint">' + ICON.zoom + '<' + '/span>'
      + '<' + '/div>'
    : '<div class="shotbox"><div class="empty">이미지가 없습니다<' + '/div><' + '/div>';

  box.innerHTML = '<div class="row"><div class="menu"><ul>' + items + '<' + '/ul>'
    + (allergyNote   ? '<div class="allergy">'   + esc(allergyNote)   + '<' + '/div>' : '')
    + (nutritionNote ? '<div class="nutrition">' + esc(nutritionNote) + '<' + '/div>' : '')
    + (originNote    ? '<div class="origin">원산지 ' + esc(originNote) + '<' + '/div>' : '')
    + '<' + '/div>' + photo + '<' + '/div>';
}

/** 나이스는 메뉴 이름 끝에 별표를 붙여 오는 일이 있습니다 */
function dishName(x){
  return String((x && x.name) || '').replace(/[*]+$/, '').trim();
}

/**
 * 오늘 나온 메뉴에 실제로 들어 있는 번호만 풀어 적습니다.
 * 18종을 모두 늘어놓으면 교실 화면에서 읽히지 않기 때문입니다.
 */
function allergyLegend(dishes){
  const seen = {};
  (dishes || []).forEach(function(d){
    ((d && d.allergy) || []).forEach(function(c){
      const k = Number(c);
      if (ALLERGY_NAMES[k]) seen[k] = true;
    });
  });
  const keys = Object.keys(seen).map(Number).sort(function(a, b){ return a - b; });
  if (!keys.length) return '';
  return '알레르기 ' + keys.map(function(k){ return k + ' ' + ALLERGY_NAMES[k]; }).join(' · ');
}
function formatNutritionNote(list){
  if (!list || !list.length) return '';
  return list.map(function(item){
    const unit = item.unit ? item.unit : '';
    return item.name + ' ' + item.value + unit;
  }).join(' · ');
}
function mealPhotoFallback(img){
  if (!img || !img.parentNode) return;
  const box = img.parentNode;
  box.classList.remove('zoomable');            // 없는 사진을 크게 볼 수는 없다
  box.removeAttribute('title');
  box.innerHTML = '<div class="empty">이미지가 없습니다<' + '/div>';
}

/* ── 급식 사진 크게 보기 ────────────────────────────────────
   급식 카드는 자료를 받을 때마다 다시 그려지므로, 사진 하나하나에
   손잡이를 다는 대신 바깥 칸에 한 번만 달아 둡니다. */
function bindPhotoZoom(){
  const body = document.getElementById('mealBody');
  if (!body || body.dataset.zoomBound === '1') return;
  body.dataset.zoomBound = '1';

  body.addEventListener('click', function(e){
    const box = e.target.closest ? e.target.closest('.shotbox.zoomable') : null;
    if (!box) return;
    const img = box.querySelector('img');
    if (img && img.getAttribute('src')) openPhoto(img.getAttribute('src'));
  });

  // 큰 사진은 어디를 눌러도 닫힙니다
  document.getElementById('photoModal').addEventListener('click', closePhoto);
}

function openPhoto(src){
  hideTip();
  const modal = document.getElementById('photoModal');
  document.getElementById('photoBig').src = src;
  modal.classList.add('show');
  modal.setAttribute('aria-hidden', 'false');
  document.body.classList.remove('idle');      // 커서가 숨은 채로 두면 곤란하다
  document.body.style.cursor = 'auto';
}

/** @return {boolean} 실제로 닫았는가 (Esc 처리 순서에 씁니다) */
function closePhoto(){
  const modal = document.getElementById('photoModal');
  if (!modal.classList.contains('show')) return false;
  modal.classList.remove('show');
  modal.setAttribute('aria-hidden', 'true');
  document.getElementById('photoBig').removeAttribute('src');
  return true;
}

function photoOpen(){
  return document.getElementById('photoModal').classList.contains('show');
}

function renderWeek(){
  const box = document.getElementById('weekBody');
  const w = DATA.week;
  if (!w || !w.ok || !w.value || !w.value.length){
    box.innerHTML = '';
    document.querySelector('#weekTitle span').textContent = '주간 시간표';
    return;
  }
  const days = w.value, shown = DATA.date;
  const mon = days[0], fri = days[Math.min(4, days.length - 1)];
  document.querySelector('#weekTitle span').textContent =
    '주간 시간표(' + formatDotDate(mon.date, mon.weekday) + '~'
                 + formatDotDate(fri.date, fri.weekday) + ')';

  let maxP = 7;
  days.forEach(function(d){
    d.periods.forEach(function(p){ if (p.period > maxP) maxP = p.period; });
  });

  let cols = '<col class="period">', head = '<th class="period"><' + '/th>';
  days.forEach(function(d){
    const on = d.date === shown ? ' class="today"' : '';
    cols += '<col' + on + '>'; head += '<th' + on + '>' + d.weekday + '<' + '/th>';
  });

  let rows = '';
  for (let p = 1; p <= maxP; p++){
    rows += '<tr><td class="period">' + p + '<' + '/td>';
    days.forEach(function(d){
      const hit = d.periods.find(function(x){ return x.period === p; });
      const on = d.date === shown ? ' class="today"' : '';
      const st = hit ? ' style="color:' + subjectColor(hit.subject) + '"' : '';
      rows += '<td' + on + st + '>' + (hit ? esc(hit.subject) : '') + '<' + '/td>';
    });
    rows += '<' + '/tr>';
  }
  box.innerHTML = '<table><colgroup>' + cols + '<' + '/colgroup>'
                + '<thead><tr>' + head + '<' + '/tr><' + '/thead><tbody>' + rows + '<' + '/tbody><' + '/table>';
}

function renderCalendar(){
  const box = document.getElementById('calBody');
  const s = DATA.schedule;
  if (!s || !s.ok || !s.value){ box.innerHTML = '<div class="none">—<' + '/div>'; return; }
  const list = s.value
    .filter(function(e){ return !HIDE_EVENTS.some(function(k){ return e.name.indexOf(k) >= 0; }); })
    .filter(function(e){ return isPreview() ? true : e.dday >= 0; })
    .slice(0, MAX_CAL);
  if (!list.length){ box.innerHTML = '<div class="none">예정된 일정이 없습니다<' + '/div>'; return; }
  box.innerHTML = '<ul>' + list.map(function(e){
    const label = formatDotDate(e.date, weekdayOf(e.date));
    const far = e.dday > 3 ? ' far' : '';
    return '<li><span class="dday' + far + '">' + label + '<' + '/span>'
         + '<span>' + esc(e.name) + '<' + '/span><' + '/li>';
  }).join('') + '<' + '/ul>';
}

function bindCalendarModal(){
  const openBtn = document.getElementById('calOpen');
  if (!openBtn || openBtn.dataset.bound === '1') return;
  openBtn.dataset.bound = '1';
  openBtn.addEventListener('click', function(e){
    e.preventDefault();
    e.stopPropagation();
    openCalModal();
  });
  document.getElementById('calClose').addEventListener('click', closeCalModal);
  document.getElementById('calBackdrop').addEventListener('click', closeCalModal);
  document.getElementById('calPrevMonth').addEventListener('click', function(){ shiftCalMonth(-1); });
  document.getElementById('calNextMonth').addEventListener('click', function(){ shiftCalMonth(1); });
}

function openCalModal(){
  hideTip();
  const base = (DATA && DATA.date) ? DATA.date : todayYmd();
  calMonth = new Date(+base.slice(0,4), +base.slice(4,6)-1, 1);
  document.getElementById('calModal').classList.add('show');
  document.getElementById('calModal').setAttribute('aria-hidden', 'false');
  document.body.style.cursor = 'auto';
  document.body.classList.remove('idle');
  loadMonthSchedule();
}

function closeCalModal(){
  const modal = document.getElementById('calModal');
  if (!modal.classList.contains('show')) return false;
  modal.classList.remove('show');
  modal.setAttribute('aria-hidden', 'true');
  return true;
}

function shiftCalMonth(step){
  if (!calMonth) return;
  calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + step, 1);
  loadMonthSchedule();
}

async function loadMonthSchedule(){
  const body = document.getElementById('calMonthBody');
  const label = document.getElementById('calMonthLabel');
  if (!calMonth) return;
  const y = calMonth.getFullYear();
  const m = calMonth.getMonth() + 1;
  label.textContent = y + '년 ' + m + '월';
  body.innerHTML = '<div class="empty">불러오는 중<' + '/div>';
  const first = y + pad(m) + '01';
  const daysInMonth = new Date(y, m, 0).getDate();
  try{
    const query = 'type=schedule&days=' + daysInMonth + '&date=' + encodeURIComponent(first);
    const url = (EDGE && edgeOk) ? EDGE + '/api/gas?' + query : API + '?' + query;
    const res = await fetch(url, { cache:'no-store' });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || '일정 오류');
    calEvents = Array.isArray(json.data) ? json.data : [];
    renderMonthCalendar();
  }catch(err){
    console.error(err);
    body.innerHTML = '<div class="empty">학사일정을 불러오지 못했습니다<' + '/div>';
  }
}

function renderMonthCalendar(){
  const body = document.getElementById('calMonthBody');
  if (!calMonth) return;
  const y = calMonth.getFullYear();
  const m = calMonth.getMonth();
  const firstDow = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const today = todayYmd();
  const byDate = {};
  calEvents.forEach(function(e){
    if (!e || !e.date || !e.name) return;
    if (HIDE_EVENTS.some(function(k){ return e.name.indexOf(k) >= 0; })) return;
    if (!byDate[e.date]) byDate[e.date] = [];
    byDate[e.date].push(e.name);
  });

  const heads = ['일','월','화','수','목','금','토'].map(function(d, i){
    const cls = i === 0 ? ' class="sun"' : (i === 6 ? ' class="sat"' : '');
    return '<th' + cls + '>' + d + '<' + '/th>';
  }).join('');

  let cells = '';
  const total = Math.ceil((firstDow + daysInMonth) / 7) * 7;
  for (let i = 0; i < total; i++){
    const dayNum = i - firstDow + 1;
    if (dayNum < 1 || dayNum > daysInMonth){
      cells += '<td class="mute"><' + '/td>';
    } else {
      const ymd = y + pad(m + 1) + pad(dayNum);
      const dow = i % 7;
      const cls = [
        dow === 0 ? 'sun' : '',
        dow === 6 ? 'sat' : '',
        ymd === today ? 'today' : ''
      ].filter(Boolean).join(' ');
      const events = (byDate[ymd] || []).slice(0, 3)
        .map(function(name){ return '<span class="ev">' + esc(name) + '<' + '/span>'; }).join('');
      cells += '<td' + (cls ? ' class="' + cls + '"' : '') + '>'
            + '<div class="num">' + dayNum + '<' + '/div>' + events + '<' + '/td>';
    }
    if ((i + 1) % 7 === 0) cells += '<' + '/tr><tr>';
  }

  body.innerHTML = '<table><thead><tr>' + heads + '<' + '/tr><' + '/thead><tbody><tr>'
                 + cells.replace(new RegExp('<' + '/tr><tr>$'), '') + '<' + '/tr><' + '/tbody><' + '/table>';
}

function renderNotes(){

function tick(){
  const now = new Date();
  document.getElementById('clock').textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());
  updateNowLabel(now);
  if (DATA) renderSlots();
}

function updateNowLabel(now){
  const d = now || new Date();
  const weekdays = ['일','월','화','수','목','금','토'];
  document.getElementById('nowLabel').textContent =
    (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + weekdays[d.getDay()] + '요일';
}

function currentSlot(now){
  if (isPreview()) return null;
  const m = minutesOf(now || new Date());
  for (let i = 0; i < PERIODS.length; i++){
    const p = PERIODS[i], s = toMin(p.start), e = toMin(p.end);
    if (m >= s && m < e) return { name:p.name, period:p.period, startMin:s, endMin:e };
  }
  return null;
}

/** 그 교시가 끝나는 시각(분). 시정표에 없는 교시면 null */
function periodEndMin(period){
  for (let i = 0; i < PERIODS.length; i++){
    if (Number(PERIODS[i].period) === Number(period)) return toMin(PERIODS[i].end);
  }
  return null;
}

/**
 * 이 교시가 끝났는가.
 *
 * 예전에는 '현재 교시 번호보다 작으면 끝난 것'으로 보았습니다. 그런데
 * 쉬는시간에는 현재 교시가 없고 점심·조례는 교시 번호가 0이어서, 정작 학생들이
 * 화면을 가장 많이 보는 쉬는시간마다 지나간 교시의 회색 표시가 사라졌습니다.
 * 그래서 교시 번호 대신 '지금이 그 교시의 끝을 지났는지'로 판단합니다.
 */
function slotDone(period, nowMin){
  if (nowMin < 0) return false;                 // 다른 날짜를 들춰보는 중
  const end = periodEndMin(period);
  return end != null && nowMin >= end;
}

function showSetup(editing){
  const box = document.getElementById('setup');
  const g = document.getElementById('selGrade');
  const c = document.getElementById('selClass');
  const save = document.getElementById('btnSave');
  const cancel = document.getElementById('btnCancelSetup');
  const hint = document.getElementById('setupHint');

  closeCalModal(); hideTip();

  function fillGrades(){
    const prev = g.value || (GRADE ? String(GRADE) : '');
    g.innerHTML = '';
    Object.keys(classStructure())
      .map(Number)
      .sort(function(a, b){ return a - b; })
      .forEach(function(nm){ g.add(new Option(nm + '학년', String(nm))); });
    if (prev && g.querySelector('option[value="' + prev + '"]')) g.value = prev;
  }

  function fillClasses(){
    const prev = c.value || (CLASS ? String(CLASS) : '');
    c.innerHTML = '';
    const max = classStructure()[Number(g.value)] || 10;
    for (let i = 1; i <= max; i++) c.add(new Option(i + '반', String(i)));
    if (prev && Number(prev) <= max) c.value = String(prev);
  }

  box.classList.add('show');
  document.body.style.cursor = 'auto';
  document.body.classList.remove('idle');

  if (!setupReady){
    g.addEventListener('change', fillClasses);
    save.addEventListener('click', function(){
      const nextGrade = g.value;
      const nextClass = c.value;
      if (!nextGrade || !nextClass) return;
      lsSet('grade', nextGrade);
      lsSet('class', nextClass);
      location.replace(
        location.pathname
        + '?grade=' + encodeURIComponent(nextGrade)
        + '&class=' + encodeURIComponent(nextClass)
      );
    });
    cancel.addEventListener('click', function(){
      if (!GRADE || !CLASS) return;
      box.classList.remove('show');
    });
    setupReady = true;
  }

  fillGrades();
  if (GRADE) g.value = String(GRADE);
  else if (!g.value) g.value = String(Object.keys(classStructure())[0] || 1);
  fillClasses();
  if (CLASS) c.value = String(CLASS);

  // 서버에서 학급 구성을 아직 못 받았으면 받아 와서 목록을 다시 채운다
  if (!STRUCTURE){
    loadStructure().then(function(){
      fillGrades();
      if (GRADE) g.value = String(GRADE);
      fillClasses();
      if (CLASS) c.value = String(CLASS);
    });
  }

  if (editing && GRADE && CLASS){
    hint.textContent = '학년·반을 바꾼 뒤 저장하세요';
    save.textContent = '저장하기';
    cancel.hidden = false;
  } else {
    hint.textContent = '한 번만 설정하면 다음부터는 바로 시작합니다';
    save.textContent = '시작하기';
    cancel.hidden = true;
  }
}

function toMin(hhmm){ const p = String(hhmm).split(':'); return +p[0] * 60 + +p[1]; }
function todayYmd(){ const d = new Date();
  return d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()); }
function shortDate(ymd){
  return Number(ymd.slice(4,6)) + '.' + Number(ymd.slice(6,8));
}
function weekdayOf(ymd){
  const weekdays = ['일','월','화','수','목','금','토'];
  const d = new Date(+ymd.slice(0,4), +ymd.slice(4,6)-1, +ymd.slice(6,8));
  return weekdays[d.getDay()];
}
function formatDotDate(ymd, weekday){
  return shortDate(ymd) + '.(' + (weekday || weekdayOf(ymd)) + ')';
}
function shiftYmd(ymd, step){
  const d = new Date(+ymd.slice(0,4), +ymd.slice(4,6)-1, +ymd.slice(6,8));
  d.setDate(d.getDate() + step);
  return d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate());
}
function minutesOf(d){ return d.getHours()*60 + d.getMinutes() + d.getSeconds()/60; }
function pad(n){ return String(n).padStart(2,'0'); }

/* 저장 공간을 쓸 수 없는 환경(사생활 보호 모드, 저장 차단 설정, 미리보기 틀
   안에서 열린 경우)에서는 localStorage에 손대기만 해도 오류가 납니다.
   예전에는 그 오류 하나에 화면 전체가 뜨지 않았습니다. */
function lsGet(key){
  try{ return localStorage.getItem(key); }catch(err){ return null; }
}
function lsSet(key, value){
  try{ localStorage.setItem(key, value); return true; }catch(err){ return false; }
}
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
