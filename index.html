<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 교실</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">

<style>
/* ============================================================
   오늘의 교실 — 교실 전자칠판 대시보드
   16:9 가로 / 1920×1080 기준, 4K까지 비례 확대
   ============================================================ */

:root{
  --board:      #16261F;   /* 칠판 바탕 */
  --board-up:   #1E332A;   /* 한 단 올라온 면 */
  --line:       #2C4438;   /* 구획선 */
  --chalk:      #EFEDE4;   /* 분필 흰색 */
  --chalk-dim:  #93A79B;   /* 가라앉은 글자 */
  --now:        #F2C14E;   /* 지금 — 유일한 강조색 */
  --mark:       #E8734A;   /* 변경·공지 표시 */
}

/* 1rem = 화면폭/96  →  1920px에서 20px, 3840px에서 40px */
html{ font-size: calc(100vw / 96); }

*{ box-sizing: border-box; margin:0; padding:0; }

body{
  width:100vw; height:100vh; overflow:hidden;
  background: var(--board);
  color: var(--chalk);
  font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  font-weight: 500;
  -webkit-font-smoothing: antialiased;
  cursor: default;
  user-select: none;
}
body.idle{ cursor: none; }          /* 5초간 조작 없으면 커서 감춤 */

/* ── 전체 골격 ─────────────────────────────────────────── */
#app{
  display: grid;
  grid-template-columns: 1.35fr 1fr;
  grid-template-rows: auto 1fr auto;
  grid-template-areas:
    "head  head"
    "main  side"
    "note  note";
  width:100%; height:100%;
  padding: 1.6rem 2rem 1.4rem;
  gap: 1.4rem 2rem;
}

/* ── 머리말 ────────────────────────────────────────────── */
.head{
  grid-area: head;
  display:flex; align-items:baseline; justify-content:space-between;
  padding-bottom: .9rem;
  border-bottom: 1px solid var(--line);
}
.head .room{ font-size:1.9rem; font-weight:700; letter-spacing:-.01em; }
.head .app{ font-size:1.1rem; color:var(--chalk-dim); font-weight:500; }
.head .date{ font-size:1.5rem; color:var(--chalk-dim); font-weight:600; min-width:9.5rem; text-align:right; }

/* 날짜 이동 */
.head .nav{ display:flex; align-items:center; gap:.5rem; }
.navbtn{
  font:inherit; font-size:1.5rem; font-weight:700; line-height:1;
  width:2.6rem; height:2.6rem;
  border-radius:.4rem; border:1px solid var(--line);
  background:transparent; color:var(--chalk-dim); cursor:pointer;
}
.navbtn:hover, .navbtn:focus-visible{ color:var(--chalk); border-color:var(--chalk-dim); outline:none; }
.navbtn.today{ width:auto; padding:0 1rem; font-size:1.1rem; }
.head .preview{
  font-size:1rem; font-weight:800; letter-spacing:.02em;
  color:var(--board); background:var(--now);
  padding:.2rem .65rem; border-radius:.25rem;
}
[hidden]{ display:none !important; }

/* ── 왼쪽: 지금 + 급식 ─────────────────────────────────── */
.main{ grid-area:main; display:flex; flex-direction:column; gap:1.4rem; min-height:0; }

.now{
  flex: 0 0 auto;
  padding-bottom: 1.4rem;
  border-bottom: 1px solid var(--line);
}
.now .tag{ font-size:1.15rem; color:var(--chalk-dim); margin-bottom:.5rem; }
.now .line{ display:flex; align-items:baseline; gap:1.4rem; flex-wrap:wrap; }
.now .period{ font-size:2.6rem; font-weight:700; color:var(--now); }
.now .subject{
  font-size:5.4rem; font-weight:800; line-height:1;
  letter-spacing:-.03em; color:var(--chalk);
}
.now .subject.quiet{ font-size:3.4rem; font-weight:700; color:var(--chalk-dim); }

/* 진행 막대 */
.bar{ margin-top:1.3rem; height:.3rem; background:var(--line); border-radius:.15rem; overflow:hidden; }
.bar > i{ display:block; height:100%; width:0; background:var(--now); transition: width .9s linear; }

.now .foot{
  margin-top:.8rem;
  display:flex; align-items:baseline; justify-content:space-between; gap:1rem;
}
.now .left-min{ font-size:1.4rem; color:var(--now); font-weight:700; }
.now .next{ font-size:1.4rem; color:var(--chalk-dim); }
.now .next b{ color:var(--chalk); font-weight:700; }
.now .clock{ font-size:2.6rem; font-weight:700; letter-spacing:-.02em; font-variant-numeric: tabular-nums; }

/* 급식 */
.meal{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
.meal h2, .side h2{ font-size:1.15rem; color:var(--chalk-dim); font-weight:600; margin-bottom:.9rem; }
.meal ul{ list-style:none; display:flex; flex-wrap:wrap; gap:.55rem 1.1rem; align-content:flex-start; }
.meal li{ font-size:1.85rem; font-weight:600; line-height:1.35; }
.meal .kcal{ margin-top:.9rem; font-size:1.1rem; color:var(--chalk-dim); }
.meal .none{ font-size:1.6rem; color:var(--chalk-dim); font-weight:500; }

/* ── 오른쪽: 시간표 + 일정 ─────────────────────────────── */
.side{ grid-area:side; display:flex; flex-direction:column; gap:1.4rem; min-height:0; }
.side > section{ min-height:0; }
.tt{ flex:1 1 auto; display:flex; flex-direction:column; }
.tt ol{ list-style:none; display:flex; flex-direction:column; gap:.35rem; }
.tt li{
  display:flex; align-items:center; gap:1rem;
  padding:.42rem .8rem; border-radius:.35rem;
  font-size:1.6rem; font-weight:600;
}
.tt li .no{
  flex:0 0 1.9rem; text-align:center;
  font-size:1.15rem; color:var(--chalk-dim); font-weight:700;
  font-variant-numeric: tabular-nums;
}
.tt li.on{ background:var(--board-up); }
.tt li.on .no{ color:var(--now); }
.tt li.on .name{ color:var(--now); font-weight:800; }
.tt li.done{ opacity:.42; }
.tt li .chg{
  margin-left:auto; font-size:1rem; font-weight:700;
  color:var(--mark); border:1px solid var(--mark);
  padding:.1rem .45rem; border-radius:.25rem;
}
.tt .none{ font-size:1.4rem; color:var(--chalk-dim); }

/* 일정 */
.cal{ flex:0 0 auto; padding-top:1.4rem; border-top:1px solid var(--line); }
.cal ul{ list-style:none; display:flex; flex-direction:column; gap:.6rem; }
.cal li{ display:flex; align-items:baseline; gap:1rem; font-size:1.45rem; font-weight:600; }
.cal .dday{
  flex:0 0 4.6rem;
  font-size:1.2rem; font-weight:800; color:var(--now);
  font-variant-numeric: tabular-nums;
}
.cal .dday.far{ color:var(--chalk-dim); }
.cal .none{ font-size:1.35rem; color:var(--chalk-dim); font-weight:500; }

/* ── 공지 띠 (있을 때만) ───────────────────────────────── */
.note{ grid-area:note; display:none; }
.note.show{ display:block; }
.note .item{
  display:flex; align-items:baseline; gap:1.2rem;
  padding:1rem 1.4rem;
  background:var(--board-up);
  border-left:.35rem solid var(--mark);
  border-radius:.4rem;
}
.note .item + .item{ margin-top:.6rem; }
.note .who{ flex:0 0 auto; font-size:1.15rem; color:var(--chalk-dim); font-weight:700; }
.note .text{ font-size:1.9rem; font-weight:700; line-height:1.3; }

/* ── 상태 표시 ─────────────────────────────────────────── */
#stale{
  position:fixed; right:1.2rem; bottom:.7rem;
  font-size:.95rem; color:var(--mark);
  opacity:0; transition:opacity .4s;
}
#stale.show{ opacity:1; }

/* ── 최초 설정 화면 ────────────────────────────────────── */
#setup{
  position:fixed; inset:0; background:var(--board);
  display:none; flex-direction:column; align-items:center; justify-content:center;
  gap:2rem; cursor:auto; z-index:10;
}
#setup.show{ display:flex; }
#setup h1{ font-size:2.6rem; font-weight:800; }
#setup p{ font-size:1.3rem; color:var(--chalk-dim); }
#setup .rows{ display:flex; gap:1.2rem; }
#setup select{
  font: inherit; font-size:2rem; font-weight:700;
  padding:.7rem 1.4rem; border-radius:.5rem;
  background:var(--board-up); color:var(--chalk);
  border:1px solid var(--line);
}
#setup button{
  font: inherit; font-size:1.6rem; font-weight:700;
  padding:.8rem 3rem; border-radius:.5rem; border:0;
  background:var(--now); color:var(--board); cursor:pointer;
}

@media (prefers-reduced-motion: reduce){
  .bar > i{ transition:none; }
}
</style>
</head>

<body>

<div id="app">

  <header class="head">
    <div class="room" id="room">—</div>
    <div class="app">오늘의 교실</div>
    <div class="nav">
      <span class="preview" id="preview" hidden>미리보기</span>
      <button class="navbtn" id="prevDay" aria-label="이전 날짜">‹</button>
      <div class="date" id="date">—</div>
      <button class="navbtn" id="nextDay" aria-label="다음 날짜">›</button>
      <button class="navbtn today" id="goToday" hidden>오늘</button>
    </div>
  </header>

  <div class="main">
    <section class="now">
      <div class="tag">지금</div>
      <div class="line">
        <span class="period" id="nowPeriod"></span>
        <span class="subject" id="nowSubject">—</span>
      </div>
      <div class="bar"><i id="bar"></i></div>
      <div class="foot">
        <div>
          <span class="left-min" id="leftMin"></span>
          <span class="next" id="next"></span>
        </div>
        <div class="clock" id="clock">--:--</div>
      </div>
    </section>

    <section class="meal">
      <h2>오늘 급식</h2>
      <div id="mealBody"><div class="none">불러오는 중</div></div>
    </section>
  </div>

  <div class="side">
    <section class="tt">
      <h2>오늘 시간표</h2>
      <div id="ttBody"><div class="none">불러오는 중</div></div>
    </section>

    <section class="cal">
      <h2>다가오는 일정</h2>
      <div id="calBody"><ul><li class="none">불러오는 중</li></ul></div>
    </section>
  </div>

  <div class="note" id="note"></div>
</div>

<div id="stale">연결 끊김 — 마지막 정보 표시 중</div>

<div id="setup">
  <h1>이 교실은 몇 학년 몇 반인가요?</h1>
  <p>한 번만 설정하면 다음부터는 바로 시작합니다</p>
  <div class="rows">
    <select id="selGrade"></select>
    <select id="selClass"></select>
  </div>
  <button id="btnSave">시작하기</button>
</div>

<script>
/* ============================================================
   설정 — 배포 후 이 값만 채우면 됩니다
   ============================================================ */
const API = 'PASTE_YOUR_GAS_EXEC_URL_HERE';   // GAS 웹 앱 /exec URL

const REFRESH_MS = 3 * 60 * 1000;   // 데이터 갱신 주기 (3분)
const RETURN_MS  = 2 * 60 * 1000;   // 다른 날짜를 보다가 오늘로 자동 복귀
const HIDE_EVENTS = ['토요휴업일', '재량휴업일', '일요일'];   // 화면에서 뺄 일정

/* ── 학급 설정 (localStorage 또는 ?grade=3&class=5) ──────── */
const qs = new URLSearchParams(location.search);
let GRADE = qs.get('grade') || localStorage.getItem('grade');
let CLASS = qs.get('class') || localStorage.getItem('class');

let VIEW_DATE = qs.get('date') || null;   // null이면 오늘
let returnTimer = null;

let DATA = null;        // 마지막으로 성공한 응답
let PERIODS = [];       // 교시 시간표
let lastOkAt = 0;

/* ============================================================
   시작
   ============================================================ */
init();

function init(){
  if (!GRADE || !CLASS) { showSetup(); return; }
  document.getElementById('room').textContent = GRADE + '학년 ' + CLASS + '반';

  bindDateNav();
  bindIdleCursor();

  load();
  setInterval(load, REFRESH_MS);
  tick();
  setInterval(tick, 1000);
}

/* ── 날짜 이동 ─────────────────────────────────────────── */
function bindDateNav(){
  document.getElementById('prevDay').addEventListener('click', () => moveDay(-1));
  document.getElementById('nextDay').addEventListener('click', () => moveDay(+1));
  document.getElementById('goToday').addEventListener('click', () => goToday());

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft')  moveDay(-1);
    if (e.key === 'ArrowRight') moveDay(+1);
    if (e.key === 'Escape' || e.key === 'Home') goToday();
  });
}

function moveDay(step){
  const base = VIEW_DATE || (DATA && DATA.date) || todayYmd();
  VIEW_DATE = shiftYmd(base, step);
  if (VIEW_DATE === todayYmd()) VIEW_DATE = null;
  armReturn();
  load();
}

function goToday(){
  VIEW_DATE = null;
  clearTimeout(returnTimer);
  load();
}

/** 다른 날짜를 열어둔 채 자리를 뜨면 저절로 오늘로 돌아온다 */
function armReturn(){
  clearTimeout(returnTimer);
  if (VIEW_DATE) returnTimer = setTimeout(goToday, RETURN_MS);
}

function isPreview(){ return !!VIEW_DATE && VIEW_DATE !== todayYmd(); }

/* ── 조작이 없으면 커서를 감춘다 ───────────────────────── */
function bindIdleCursor(){
  let t = null;
  const hide = () => document.body.classList.add('idle');
  const show = () => {
    document.body.classList.remove('idle');
    clearTimeout(t); t = setTimeout(hide, 5000);
  };
  ['mousemove','touchstart','keydown'].forEach(ev =>
    document.addEventListener(ev, show, { passive:true }));
  t = setTimeout(hide, 5000);
}

/* ============================================================
   데이터
   ============================================================ */
async function load(){
  try{
    let url = API + '?type=all&grade=' + encodeURIComponent(GRADE)
                  + '&class=' + encodeURIComponent(CLASS);
    if (VIEW_DATE) url += '&date=' + encodeURIComponent(VIEW_DATE);

    const res = await fetch(url, { cache: 'no-store' });
    const body = await res.json();
    if (!body.ok) throw new Error(body.error || '응답 오류');

    DATA = body.data;
    PERIODS = (DATA.config && DATA.config.periods) || [];
    lastOkAt = Date.now();

    render();
    setStale(false);
  }catch(err){
    console.error('불러오기 실패', err);
    // 이전 화면을 지우지 않는다 — 빈 화면보다 오래된 정보가 낫다
    setStale(Date.now() - lastOkAt > REFRESH_MS * 2.5);
  }
}

function setStale(on){
  document.getElementById('stale').classList.toggle('show', on);
}

function render(){
  renderDate();
  renderMeal();
  renderTimetable();
  renderCalendar();
  renderNotes();
  tick();
}

/* ── 날짜 ──────────────────────────────────────────────── */
function renderDate(){
  const d = DATA.date, w = DATA.weekday;
  document.getElementById('date').textContent =
    Number(d.slice(4,6)) + '월 ' + Number(d.slice(6,8)) + '일 ' + w + '요일';

  const on = isPreview();
  document.getElementById('preview').hidden = !on;
  document.getElementById('goToday').hidden = !on;
}

/* ── 급식 ──────────────────────────────────────────────── */
function renderMeal(){
  const box = document.getElementById('mealBody');
  const m = DATA.meal;

  if (!m || !m.ok || !m.value || !m.value.length){
    box.innerHTML = '<div class="none">오늘은 급식이 없습니다</div>';
    return;
  }

  // 중식 우선, 없으면 첫 번째
  const lunch = m.value.find(x => /중식/.test(x.type)) || m.value[0];
  const items = (lunch.dishes || []).map(x => '<li>' + esc(x.name) + '</li>').join('');
  const kcal  = lunch.kcal ? '<div class="kcal">' + esc(lunch.kcal) + '</div>' : '';

  box.innerHTML = items ? ('<ul>' + items + '</ul>' + kcal)
                        : '<div class="none">오늘은 급식이 없습니다</div>';
}

/* ── 시간표 ────────────────────────────────────────────── */
function renderTimetable(){
  const box = document.getElementById('ttBody');
  const t = DATA.timetable;

  if (!t || !t.ok || !t.value || !t.value.length){
    box.innerHTML = '<div class="none">오늘은 수업이 없습니다</div>';
    return;
  }

  const cur = currentSlot();
  const curP = cur ? cur.period : -1;

  box.innerHTML = '<ol>' + t.value.map(row => {
    const on   = row.period === curP;
    const done = curP > 0 && row.period < curP;
    const chg  = row.changed ? '<span class="chg">변경</span>' : '';
    return '<li class="' + (on ? 'on' : done ? 'done' : '') + '">'
         +   '<span class="no">' + row.period + '</span>'
         +   '<span class="name">' + esc(row.subject) + '</span>'
         +   chg
         + '</li>';
  }).join('') + '</ol>';
}

/* ── 학사일정 ──────────────────────────────────────────── */
function renderCalendar(){
  const box = document.getElementById('calBody');
  const s = DATA.schedule;

  if (!s || !s.ok || !s.value){
    box.innerHTML = '<ul><li class="none">일정을 불러오지 못했습니다</li></ul>';
    return;
  }

  const list = s.value
    .filter(e => !HIDE_EVENTS.some(k => e.name.indexOf(k) >= 0))
    .filter(e => e.dday >= 0)
    .slice(0, 4);

  if (!list.length){
    box.innerHTML = '<ul><li class="none">2주 내 예정된 일정이 없습니다</li></ul>';
    return;
  }

  box.innerHTML = '<ul>' + list.map(e => {
    const label = e.dday === 0 ? '오늘' : 'D-' + e.dday;
    const far   = e.dday > 3 ? ' far' : '';
    return '<li><span class="dday' + far + '">' + label + '</span>'
         +     '<span>' + esc(e.name) + '</span></li>';
  }).join('') + '</ul>';
}

/* ── 공지 ──────────────────────────────────────────────── */
function renderNotes(){
  const box = document.getElementById('note');
  const n = DATA.notices;
  const list = (n && n.ok && n.value) ? n.value.slice(0, 2) : [];

  if (!list.length){ box.classList.remove('show'); box.innerHTML = ''; return; }

  box.innerHTML = list.map(x => {
    const who = x.scope === 'school' ? '전교' : '담임';
    return '<div class="item">'
         +   '<span class="who">' + who + '</span>'
         +   '<span class="text">' + esc(x.text) + '</span>'
         + '</div>';
  }).join('');
  box.classList.add('show');
}

/* ============================================================
   시계 · 현재 교시 (1초마다)
   ============================================================ */
function tick(){
  const now = new Date();
  document.getElementById('clock').textContent =
    pad(now.getHours()) + ':' + pad(now.getMinutes());

  const elP = document.getElementById('nowPeriod');
  const elS = document.getElementById('nowSubject');
  const elL = document.getElementById('leftMin');
  const elN = document.getElementById('next');
  const bar = document.getElementById('bar');

  // 다른 날짜를 보는 중 — 지금 시각과 무관하므로 강조하지 않는다
  if (isPreview()){
    const d = (DATA && DATA.date) || VIEW_DATE;
    elP.textContent = '';
    elS.className = 'subject quiet';
    elS.textContent = Number(d.slice(4,6)) + '월 ' + Number(d.slice(6,8)) + '일 시간표';
    elL.textContent = '';
    elN.textContent = '';
    bar.style.width = '0%';
    return;
  }

  const slot = currentSlot(now);

  if (!slot){
    elP.textContent = '';
    elS.textContent = restLabel(now);
    elS.className = 'subject quiet';
    elL.textContent = '';
    elN.textContent = '';
    bar.style.width = '0%';
    return;
  }

  elP.textContent = slot.name;
  elS.className = 'subject';
  elS.textContent = subjectOf(slot.period) || (slot.period ? '수업' : '');

  const left = Math.max(0, Math.ceil((slot.endMin - minutesOf(now)) ));
  elL.textContent = left > 0 ? (left + '분 남음') : '';

  const total = slot.endMin - slot.startMin;
  const gone  = minutesOf(now) - slot.startMin;
  bar.style.width = Math.min(100, Math.max(0, gone / total * 100)) + '%';

  const nx = nextSlot(now);
  elN.innerHTML = nx ? ('다음 ' + nx.name + ' <b>' + esc(subjectOf(nx.period) || '') + '</b>') : '';

  // 교시가 바뀌면 시간표 강조도 갱신
  if (tick._last !== slot.name){ tick._last = slot.name; if (DATA) renderTimetable(); }
}

function subjectOf(period){
  if (!period || !DATA || !DATA.timetable || !DATA.timetable.value) return '';
  const hit = DATA.timetable.value.find(r => r.period === period);
  return hit ? hit.subject : '';
}

function currentSlot(now){
  if (isPreview()) return null;
  const m = minutesOf(now || new Date());
  for (const p of PERIODS){
    const s = toMin(p.start), e = toMin(p.end);
    if (m >= s && m < e) return { name:p.name, period:p.period, startMin:s, endMin:e };
  }
  return null;
}

function nextSlot(now){
  const m = minutesOf(now || new Date());
  for (const p of PERIODS){
    if (toMin(p.start) > m) return { name:p.name, period:p.period };
  }
  return null;
}

function restLabel(now){
  if (!PERIODS.length) return '—';
  const m = minutesOf(now);
  if (m < toMin(PERIODS[0].start)) return '수업 전';
  if (m >= toMin(PERIODS[PERIODS.length-1].end)) return '오늘 수업 끝';
  return '쉬는 시간';
}

/* ============================================================
   최초 설정
   ============================================================ */
function showSetup(){
  const box = document.getElementById('setup');
  box.classList.add('show');
  document.body.style.cursor = 'auto';

  const g = document.getElementById('selGrade');
  const c = document.getElementById('selClass');
  const structure = { 1:7, 2:7, 3:6 };   // 서버 config로도 오지만 첫 화면에서는 기본값 사용

  [1,2,3].forEach(n => g.add(new Option(n + '학년', n)));
  fillClasses();
  g.addEventListener('change', fillClasses);

  function fillClasses(){
    c.innerHTML = '';
    const max = structure[g.value] || 10;
    for (let i = 1; i <= max; i++) c.add(new Option(i + '반', i));
  }

  document.getElementById('btnSave').addEventListener('click', () => {
    localStorage.setItem('grade', g.value);
    localStorage.setItem('class', c.value);
    location.reload();
  });
}

/* ============================================================
   보조
   ============================================================ */
function toMin(hhmm){
  const [h, m] = String(hhmm).split(':').map(Number);
  return h * 60 + m;
}
function todayYmd(){
  const d = new Date();
  return d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate());
}
function shiftYmd(ymd, step){
  const d = new Date(+ymd.slice(0,4), +ymd.slice(4,6) - 1, +ymd.slice(6,8));
  d.setDate(d.getDate() + step);
  return d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate());
}
function minutesOf(d){ return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60; }
function pad(n){ return String(n).padStart(2, '0'); }
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
