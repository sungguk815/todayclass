<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">

/* ── 색 손잡이 ────────────────────────────────────────────
   화면에 쓰는 색은 모두 여기 이름으로만 씁니다. 아래 테마들은
   이 이름들의 값만 갈아끼우므로 구조는 전혀 건드리지 않습니다.
   테마 고르기 : 오른쪽 아래 동그란 버튼 (또는 T 키) */
:root{
  /* 바탕과 글자 */
  --bg:#EEF3F9; --card:#FFFFFF; --ink:#111C33; --soft:#6E7E99; --line:#DFE7F1;
  --bw:.09rem;                                  /* 테두리 두께 */

  /* 강조색 */
  --note:#E11D48; --cal:#F0821E; --meal:#12A150; --accent:#0B5CAB;

  /* 시간표 칸 */
  --slot:#F6F9FD; --slot-done:#F2F5F9;
  --done-line:#D5DEEA; --done-ink:#A9B6C9; --done-soft:#BCC7D6;
  --chip:rgba(255,255,255,.94); --chip-ink:#6E7E99;

  /* 표·보조면 */
  --grid:#EFF3F9; --week-ink:#7C8AA3; --today-col:#F3F7FD;
  --tone:#EDF2F8; --scroll:#CFDAE8;

  /* 겹쳐 뜨는 것 */
  --tip:rgba(17,28,51,.96); --tip-ink:#FFFFFF; --shadow:17,28,51;
  --preview-bg:#FFE9B8; --preview-ink:#7A4B00; --ev-ink:#9A5A12;
  --sun:#E11D48; --sat:#2563EB;
  --btn:#111C33; --btn-ink:#FFFFFF;

  /* 앱 이름(오늘의 교실)과 기능 제목(수업 시간표·점심 식단·주간 시간표) */
  --brand-a:#1D4ED8; --brand-b:#7C3AED;       /* 앱 이름 : 파랑 → 보라 */
  --title:#1D4ED8;                             /* 기능 제목 : 앱 이름 첫 색과 같게 */

  --r-hero:1.1rem; --r-card:.75rem;
}

/* ── 테마 ② 초록 칠판 : 교실 칠판에 분필로 쓴 느낌 ─────── */

/* 전체 크기 손잡이
   · 가로(72)와 세로(40.5) 중 더 빡빡한 쪽을 따르므로 어떤 해상도에서도 넘치지 않습니다
   · --zoom : 사용자 확대/축소 배율 (Ctrl+휠, +/- 키, 두 손가락 확대) */
html{
  --zoom:1;
  font-size:calc(min(100vw / 72, 100vh / 40.5) * var(--zoom));
}

*{ box-sizing:border-box; margin:0; padding:0; }
body{
  width:100vw; height:100vh; overflow:hidden; background:var(--bg); background-image:var(--backdrop, none); color:var(--ink);
  font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  font-weight:600; -webkit-font-smoothing:antialiased; cursor:default; user-select:none;
}
body.idle{ cursor:none; }
[hidden]{ display:none !important; }
svg{ display:block; }

#app{
  display:grid; width:100%; height:100%; gap:.65rem;
  padding:.8rem 1.1rem 3.9rem;          /* 아래 여백 = 고정 일정 띠 자리 */
  grid-template-columns:55fr 45fr;      /* 급식 : 주간 시간표 = 55 : 45 */
  grid-template-rows:auto auto minmax(0,1fr);
  grid-template-areas:"head head" "line line" "meal week";
}
#app > *{ min-width:0; min-height:0; }

/* ── 머리말 ────────────────────────────────────────────── */
.head{ grid-area:head; display:flex; align-items:center; justify-content:space-between; gap:1rem;
  padding:0 .3rem; }
/* 머리말 왼쪽 묶음 : [오늘의 교실 / 동대부중 전자칠판] │ [3학년 5반] */
.head .left{ display:flex; align-items:center; gap:.9rem; min-width:0; }
.head .sep{ flex:0 0 auto; width:var(--bw); align-self:stretch; margin:.25rem 0; background:var(--line); }

/* 앱 이름 : 두 줄을 가운데로 맞춘다 */
.brand{ display:flex; flex-direction:column; align-items:center; text-align:center; line-height:1.02; }
.brand .name{ font-weight:900; letter-spacing:-.035em; white-space:nowrap; color:var(--brand-a); }
.brand .school{ font-weight:800; letter-spacing:.02em; white-space:nowrap; color:var(--soft); }
/* 글자를 두 색으로 칠할 수 있는 브라우저에서만 그라데이션을 입힌다.
   못 칠하는 곳에서 글자가 투명해져 사라지는 일이 없도록 조건을 건다. */
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .brand .name{
    background:linear-gradient(90deg, var(--brand-a), var(--brand-b));
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
  }
}
.head .brand{ flex:0 0 auto; }
.head .brand .name{ font-size:1.75rem; }
.head .brand .school{ margin-top:.14rem; font-size:.74rem; }

.head .room{ display:flex; align-items:center; gap:.5rem;
  font-size:2rem; font-weight:900; letter-spacing:-.02em; cursor:pointer; }
.head .room svg{ width:1.7rem; height:1.7rem; color:var(--soft); }
.head .room:hover,.head .room:focus-visible{ color:var(--accent); outline:none; }
.head .now{ display:flex; align-items:baseline; gap:.5rem; }
.head .nowlabel{ font-size:1.05rem; font-weight:800; color:var(--soft); }
.head .clock{ font-size:3rem; font-weight:900; letter-spacing:-.035em;
  font-variant-numeric:tabular-nums; line-height:1; }
.head .nav{ display:flex; align-items:center; gap:.4rem; }
.head .navlabel{ font-size:1.05rem; font-weight:800; color:var(--soft); margin-right:.15rem;
  white-space:nowrap; }
.head .date{ font-size:1.45rem; font-weight:800; color:var(--soft);
  min-width:9.5rem; text-align:center; padding:.14rem .5rem; border-radius:.35rem; }
.head .date.preview{ color:var(--preview-ink); background:var(--preview-bg); }
.head .date .sub{ font-size:.68em; font-weight:800; margin-left:.3em; opacity:.8; }
.head .date.loading{ animation:datePulse 1.1s ease-in-out infinite; }
@keyframes datePulse{ 0%,100%{ opacity:1; } 50%{ opacity:.45; } }
.navbtn{ display:grid; place-items:center; width:2.1rem; height:2.1rem;
  border-radius:.5rem; border:var(--bw) solid var(--line); background:var(--card);
  color:var(--soft); cursor:pointer; }
.navbtn svg{ width:1.1rem; height:1.1rem; }
.navbtn:hover,.navbtn:focus-visible{ color:var(--ink); border-color:var(--soft); outline:none; }
.navbtn.today{ width:auto; padding:0 .8rem; font:inherit; font-size:1.05rem; font-weight:900; }
.navbtn.today[data-off]{ visibility:hidden; }   /* 자리는 지키고 모습만 감춤 */
.navbtn.view{ width:2.1rem; flex:0 0 2.1rem; }
.comci-link{ flex:0 0 auto; margin-left:auto; padding:.16rem .5rem; border:var(--bw) solid var(--line);
  border-radius:.35rem; background:var(--chip); color:var(--chip-ink); font:inherit;
  font-size:.78rem; font-weight:800; text-decoration:none; white-space:nowrap; cursor:pointer; }
.comci-link:hover,.comci-link:focus-visible{ border-color:var(--accent); color:var(--accent); }
#comciFallback{ font-size:.75rem; white-space:nowrap; color:var(--accent); }

/* ── 카드 공통 ─────────────────────────────────────────── */
.card{ background:var(--card); border:var(--bw) solid var(--line);
  border-radius:var(--r-card); padding:.75rem .9rem; display:flex; flex-direction:column; }
.ct{ display:flex; align-items:center; gap:.42rem; margin-bottom:.55rem;
  font-size:1.22rem; font-weight:900; color:var(--soft); }
.ct svg{ width:1.25rem; height:1.25rem; }
.ct.g{ color:var(--meal); } .ct.o{ color:var(--cal); } .ct.r{ color:var(--note); }
/* 기능 제목 : 수업 시간표 · 점심 식단 · 주간 시간표를 한 색으로 맞춰 도드라지게 */
.ct.fn{ color:var(--title); }
.ct .cal-icon{
  display:grid; place-items:center; width:1.8rem; height:1.8rem; padding:0;
  border:0; border-radius:.4rem; background:transparent; color:inherit; cursor:pointer;
}
.ct .cal-icon:hover,.ct .cal-icon:focus-visible{
  background:color-mix(in srgb, var(--cal) 16%, var(--card)); outline:none; }
.ct .cal-icon svg{ width:1.25rem; height:1.25rem; }
.none{ font-size:1.5rem; font-weight:700; color:var(--soft); }
.none .why{ margin-left:.6rem; font-size:.8em; font-weight:800; color:var(--cal); }

/* ── 주인공 : 오늘 시간표 타임라인 ─────────────────────── */
.line{
  grid-area:line; background:var(--card); border-radius:var(--r-hero);
  box-shadow:0 .5rem 1.6rem rgba(var(--shadow),.10);
  padding:.8rem .9rem .9rem;
}
.line .ct{ margin-bottom:.6rem; }
.line-heading{ display:flex; align-items:baseline; gap:1ch; min-width:0; margin-bottom:.6rem; }
.line-heading .ct{ flex:0 0 auto; margin-bottom:0; white-space:nowrap; }
#screenSync{ min-width:0; font-size:.75rem; font-weight:600; color:var(--soft);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.slots{ display:flex; gap:.42rem; align-items:stretch; }
.slot{
  position:relative;
  /* --subject : 어두운 테마에서는 과목 색을 밝게 올려 읽히게 한다 */
  --subject:var(--c);
  flex:1 1 0; min-width:0; height:6.75rem; border-radius:.6rem; padding:.3rem .45rem .4rem;
  background:var(--slot); border-top:.32rem solid var(--c);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.08rem;
  transition:flex-grow .3s ease;
}
html[data-theme="chalk"] .slot,
html[data-theme="night"] .slot,
html[data-theme="cosmos"] .slot{ --subject:color-mix(in srgb, var(--c) 45%, #FFFFFF); }
.slot .p{ font-size:1.05rem; line-height:1.1; font-weight:900; color:var(--soft); }
.slot .s{ font-size:2.1rem; line-height:1.1; font-weight:900; letter-spacing:-.03em; color:var(--subject);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
.slot.done{ background:var(--slot-done); border-top-color:var(--done-line); }
.slot.done .s{ color:var(--done-ink); } .slot.done .p{ color:var(--done-soft); }

.slot.on{
  flex:1.9 1 0; background:var(--c); border-top-color:var(--c);
  box-shadow:0 .3rem .9rem color-mix(in srgb, var(--c) 40%, transparent);
}
.slot.on .p{ color:rgba(255,255,255,.82); font-size:1rem; }
.slot.on .s{ color:#fff; font-size:2.6rem; }
.slot.on .left{ font-size:1rem; line-height:1.1; font-weight:800; color:rgba(255,255,255,.9); }
/* 쉬는시간·점심 : 다음 교시 칸이 깨어나 남은 시간을 알려 준다.
   수업 중 강조(.on)는 칸을 색으로 가득 채우지만, 여기서는 테두리로만 둘러
   '아직 시작 전'이라는 것이 한눈에 구분되게 한다. */
.slot.next{
  flex:1.6 1 0; background:var(--card); border-top-color:var(--c);
  box-shadow:0 .25rem .8rem color-mix(in srgb, var(--c) 26%, transparent);
  outline:.16rem solid color-mix(in srgb, var(--c) 50%, transparent);
  outline-offset:-.16rem;
}
.slot.next .p{ color:var(--subject); font-size:1rem; }
.slot.next .s{ font-size:2.4rem; }
.slot.next .left{ font-size:.95rem; line-height:1.1; font-weight:900; color:var(--subject); }
.slot.next .bar{ background:color-mix(in srgb, var(--c) 20%, transparent); }
.slot.next .bar > i{ background:var(--c); }
/* 1분 남으면 천천히 숨 쉬듯 — 자리로 돌아올 시간이라는 신호 */
.slot.next.soon{ animation:soon 2.2s ease-in-out infinite; }
@keyframes soon{
  50%{ box-shadow:0 .25rem 1.5rem color-mix(in srgb, var(--c) 60%, transparent); }
}

.slot .chg{ position:absolute; top:.35rem; right:.35rem;
  font-size:.75rem; line-height:1.2; font-weight:900; color:#fff; background:var(--note);
  padding:.1rem .35rem; border-radius:.3rem; letter-spacing:-.01em; }
/* 바뀐 교시는 테두리까지 빨갛게 — 쉬는시간에 화면이 돌아왔을 때 바로 보이도록 */
.slot.mod{
  border-top-color:var(--note);
  outline:.14rem solid color-mix(in srgb, var(--note) 45%, transparent);
  outline-offset:-.14rem;
}
.slot.mod.done{ outline-color:color-mix(in srgb, var(--note) 20%, transparent); }
.slot .bar{ width:82%; height:.18rem; flex-shrink:0; border-radius:.11rem;
  background:rgba(255,255,255,.32); overflow:hidden; margin-top:.12rem; }
.slot .bar > i{ display:block; height:100%; background:#fff; width:0; transition:width .9s linear; }

/* 교사명 : 칸 아래 빈 공간에 떠 있는 작은 레이어 — 기존 내용을 가리지 않습니다 */
.slot .tch{
  position:absolute; top:100%; left:50%; transform:translateX(-50%); margin-top:.04rem;
  max-width:100%; z-index:2; pointer-events:none;
  padding:0 .3rem; border-radius:.28rem;
  background:var(--chip); border:.06rem solid var(--line);
  box-shadow:0 .12rem .3rem rgba(var(--shadow),.10);
  font-size:.8rem; font-weight:800; line-height:1.34; color:var(--chip-ink);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.slot.on .tch{ color:var(--subject); border-color:color-mix(in srgb, var(--c) 35%, var(--line)); }
.slot.done .tch{ color:var(--done-ink); }
.slot.mod .tch{ color:var(--note); border-color:color-mix(in srgb, var(--note) 40%, var(--line)); }
.slot .tch .mark{ margin-left:.2rem; color:var(--note); }

/* 상세 레이어창 : 교시를 누르거나 올려두면 변경 내역까지 보여줍니다 */
#tip{
  position:fixed; top:0; left:0; z-index:26; max-width:20rem;
  opacity:0; visibility:hidden; transform:translateY(.3rem);
  transition:opacity .15s ease, transform .15s ease, visibility .15s;
  pointer-events:none;
}
#tip.show{ opacity:1; visibility:visible; transform:none; }
#tip .box{
  background:var(--tip); color:var(--tip-ink); border-radius:.5rem; padding:.5rem .7rem;
  box-shadow:0 .5rem 1.3rem rgba(var(--shadow),.3);
}
#tip .hd{ display:flex; align-items:baseline; gap:.35rem; font-size:1.15rem; font-weight:900;
  letter-spacing:-.02em; }
#tip .hd .pd{ font-size:.9rem; font-weight:800; color:rgba(255,255,255,.7); }
#tip .rw{ margin-top:.2rem; font-size:.95rem; font-weight:700; color:rgba(255,255,255,.9);
  line-height:1.4; }
#tip .rw b{ font-weight:900; }
#tip .rw.warn{ color:#FFC7D2; }
#tip .rw .old{ text-decoration:line-through; opacity:.75; }

/* 확대/축소 안내 */
#zoomToast{
  position:fixed; right:1rem; bottom:7.6rem; z-index:27;   /* 테마 버튼 위에 뜹니다 */
  padding:.3rem .7rem; border-radius:.4rem;
  background:var(--tip); color:var(--tip-ink); font-size:1rem; font-weight:900;
  opacity:0; transition:opacity .25s ease; pointer-events:none;
}
#zoomToast.show{ opacity:1; }

/* ── 테마 고르기 : 오른쪽 아래 떠 있는 버튼 ─────────────── */
#themeWrap{
  position:fixed; right:1rem; bottom:4.2rem; z-index:28;
  display:flex; flex-direction:column; align-items:flex-end; gap:.45rem;
  transition:opacity .4s ease;
}
body.idle #themeWrap{ opacity:0; pointer-events:none; }   /* 수업 중에는 조용히 사라집니다 */

#themeFab{
  display:grid; place-items:center; width:2.9rem; height:2.9rem; border-radius:50%;
  background:var(--card); color:var(--soft); border:var(--bw) solid var(--line);
  box-shadow:0 .3rem .9rem rgba(var(--shadow),.18);
  cursor:pointer; transition:color .15s, transform .15s;
}
#themeFab svg{ width:1.5rem; height:1.5rem; }
#themeFab:hover,#themeFab:focus-visible{ color:var(--accent); transform:translateY(-.1rem); outline:none; }

#themePanel{
  display:none; width:min(34rem, calc(100vw - 2rem)); padding:.65rem; max-height:calc(100vh - 9rem); overflow-y:auto; overscroll-behavior:contain;
  background:var(--card); border:var(--bw) solid var(--line); border-radius:.6rem;
  box-shadow:0 .6rem 1.6rem rgba(var(--shadow),.22);
}
#themePanel.show{ display:block; }
#themePanel .ttl{
  font-size:.92rem; font-weight:900; color:var(--soft);
  padding:.1rem .45rem .35rem;
}
#themeList{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.25rem; }
.tbtn .nm{ min-width:0; }
.tbtn small{ display:block; margin-top:.15rem; color:var(--soft); font-size:.72rem; font-weight:600; line-height:1.4; }
@media(max-aspect-ratio:1/1){ #themePanel{ width:min(24rem, calc(100vw - 2rem)); } #themeList{ grid-template-columns:1fr; } }
.tbtn{
  display:flex; align-items:center; gap:.55rem; width:100%;
  padding:.55rem .5rem; border:0; border-radius:.42rem;
  background:transparent; color:var(--ink); cursor:pointer; text-align:left;
  font:inherit; font-size:1.05rem; font-weight:800;
}
.tbtn:hover,.tbtn:focus-visible{ background:var(--tone); outline:none; }
.tbtn.on{ background:var(--tone); }
.tbtn .sw{
  flex:0 0 auto; width:1.35rem; height:1.35rem; border-radius:50%;
  border:.08rem solid rgba(var(--shadow),.2);
  background:linear-gradient(135deg, var(--a) 0 50%, var(--b) 50% 100%);
}
.tbtn .ck{ margin-left:auto; font-size:.95rem; font-weight:900; color:var(--accent); }

/* ── 급식 ──────────────────────────────────────────────── */
.mealcard{ grid-area:meal; }
/* 급식 칸 배열
     1열 : 왼쪽 메뉴(들어가는 만큼 여러 개씩 흐름) | 오른쪽 사진
     2열 : 알레르기      3열 : 영양성분      4열 : 원산지   ← 모두 전체 폭

   글이 긴 세 줄을 전체 폭으로 돌리면 줄 수가 훨씬 덜 흔들려서,
   날마다 정보량이 달라도 칸 높이가 크게 변하지 않습니다. */
.mealcard .body{ display:flex; flex-direction:column; gap:.26rem; flex:1 1 auto; min-height:0; }
.mealcard .top{ display:flex; gap:.8rem; align-items:flex-start; }

.mealcard ul{ list-style:none; display:flex; flex-wrap:wrap; gap:.06rem 1.1rem;
  align-content:flex-start; flex:1 1 0; min-width:0; }
.mealcard li{ display:flex; align-items:baseline; gap:.36rem;
  font-size:1.35rem; font-weight:800; line-height:1.3; }
.mealcard li::before{ content:''; width:.3rem; height:.3rem; border-radius:50%;
  background:var(--meal); flex:0 0 auto; transform:translateY(-.28em); }
/* 급식 사진은 4:3이므로 칸도 4:3으로 두고, 잘라내지 않고 전체를 담습니다.
   4:3을 절반 폭에 그대로 넣으면 세로가 먼저 넘치므로 높이로 묶어 둡니다. */
.mealcard .shotbox{
  position:relative;
  flex:0 0 auto; width:auto; min-width:0; align-self:center;
  aspect-ratio:4 / 3; height:12.2rem; min-height:0; max-width:45%;
  border-radius:.55rem;
  background:var(--tone); border:var(--bw) solid var(--line); overflow:hidden;
  display:flex; align-items:center; justify-content:center;
}
.mealcard .shotbox img{ width:100%; height:100%; object-fit:contain; display:block; }
.mealcard .shotbox .empty{ font-size:1.05rem; font-weight:800; color:var(--soft);
  text-align:center; padding:.6rem; line-height:1.35; }
.mealcard .kcal{ margin-left:.35rem; font-size:1.05rem; font-weight:800;
  color:var(--soft); letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
/* 영양 · 원산지 : 작은 글씨 두 줄 대신 눌러서 크게 보는 창 */
.mealcard .meal-more{ margin-left:auto; padding:.18rem .6rem; border:var(--bw) solid var(--line);
  border-radius:.35rem; background:var(--chip); color:var(--chip-ink); font:inherit;
  font-size:.85rem; font-weight:800; cursor:pointer; white-space:nowrap; }
.mealcard .meal-more:hover,.mealcard .meal-more:focus-visible{ border-color:var(--meal); color:var(--meal); outline:none; }
/* 메뉴 이름이 알레르기 번호 때문에 두 줄로 쪼개지지 않게 */
.mealcard li{ white-space:nowrap; }
/* 사진이 없는 날은 메뉴가 칸을 넓게 쓰고 글자도 키운다 */
.mealcard .top.nophoto ul{ gap:.2rem 1.6rem; }
.mealcard .top.nophoto li{ font-size:1.8rem; }
/* 알레르기 줄을 칸 맨 아래에 붙이기 위해 본문이 남은 높이를 다 쓰게 한다 */
#mealBody{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }

/* 사진을 누르면 크게 볼 수 있다는 표시 */
.mealcard .shotbox.zoomable{ cursor:zoom-in; }
.mealcard .shotbox.zoomable:hover{ border-color:var(--meal); }
.mealcard .zoomhint{
  position:absolute; right:.3rem; bottom:.3rem; pointer-events:none;
  display:grid; place-items:center; width:1.5rem; height:1.5rem;
  border-radius:.3rem; color:var(--soft);
  background:var(--chip); border:.06rem solid var(--line);
}
.mealcard .zoomhint svg{ width:.95rem; height:.95rem; }
.mealcard .shotbox.zoomable:hover .zoomhint{ color:var(--meal); }

/* 급식 사진 크게 보기 — 아무 데나 다시 누르면 닫힙니다 */
#photoModal{
  position:fixed; inset:0; z-index:29;      /* 테마 버튼(28)보다 위, 설정 화면(30)보다 아래 */
  display:none; align-items:center; justify-content:center;
  padding:1.5rem; cursor:zoom-out;
}
#photoModal.show{ display:flex; }
.photo-backdrop{ position:absolute; inset:0; background:rgba(var(--shadow),.72); }
#photoBig{
  position:relative; z-index:1;
  max-width:100%; max-height:100%; object-fit:contain;
  border-radius:.6rem; box-shadow:0 1rem 2.4rem rgba(var(--shadow),.45);
}
.photo-close{
  position:absolute; right:1.1rem; top:1.1rem; z-index:2; pointer-events:none;
  font-size:1.05rem; font-weight:900; color:#fff;
  background:rgba(var(--shadow),.55); padding:.3rem .75rem; border-radius:.4rem;
}

/* 알레르기 유발 식품 번호 : 메뉴 이름 오른쪽 위에 작게 */
.mealcard li .alg{
  font-size:.62em; font-weight:900; color:var(--note);
  vertical-align:super; letter-spacing:.02em;
}
.mealcard li.more{ color:var(--soft); font-weight:700; }
.mealcard li.more::before{ background:var(--soft); }

/* ── 알레르기 · 영양 · 원산지 ──────────────────────────────
   글 길이가 날마다 크게 달라 줄 수가 들쭉날쭉하던 자리입니다.
   이제 셋 다 무조건 한 줄이고, 제목은 왼쪽에 붙박이로 두고
   내용만 이동자막처럼 왼쪽으로 흐릅니다. 칸에 다 들어가는 짧은 날은
   흐르지 않고 그냥 서 있습니다. */
.mealcard{ --marquee-gap:3rem; }

.mealcard .info{
  display:flex; align-items:baseline; gap:.45rem; min-width:0;
  padding-top:.16rem; border-top:var(--bw) solid var(--line);
  line-height:1.3; letter-spacing:-.01em;
}
.mealcard .info .label{ flex:0 0 auto; font-weight:900; white-space:nowrap; }
.mealcard .info .scroll{ flex:1 1 auto; min-width:0; overflow:hidden; }
.mealcard .info .track{ display:flex; width:max-content; gap:var(--marquee-gap); }
.mealcard .info .track > span{ white-space:nowrap; }

/* 한 벌이 칸보다 짧으면 흐를 이유가 없으니 두 번째 벌을 감춥니다 */
.mealcard .info:not(.on) .track > span + span{ display:none; }
.mealcard .info.on .track{
  will-change:transform;
  animation:marquee var(--dur, 30s) linear infinite;
}
/* 두 벌을 나란히 두고 한 벌 길이만큼 밀면 이어 붙은 것처럼 끝없이 흐릅니다 */
@keyframes marquee{
  to{ transform:translateX(calc(-50% - var(--marquee-gap) / 2)); }
}

.mealcard .info.allergy  { font-size:1.1rem; font-weight:800; color:var(--note); margin-top:auto; padding-top:.3rem; }
/* ── 영양 비율 막대 ─────────────────────────────────────────
   색은 테마 색을 따른다 : 탄수화물 주황 · 단백질 초록 · 지방 파랑 · 기타 회색 */
:root{ --n-carb:var(--cal); --n-prot:var(--meal); --n-fat:var(--accent); --n-etc:var(--soft);
  --n-o1:var(--meal); --n-o2:var(--cal); --n-o3:var(--accent); --n-o4:var(--note); --n-o5:var(--soft); }
.n-carb{ --n:var(--n-carb); } .n-prot{ --n:var(--n-prot); } .n-fat{ --n:var(--n-fat); } .n-etc{ --n:var(--n-etc); }
.n-o1{ --n:var(--n-o1); } .n-o2{ --n:var(--n-o2); } .n-o3{ --n:var(--n-o3); } .n-o4{ --n:var(--n-o4); } .n-o5{ --n:var(--n-o5); }

.nbar{ display:flex; gap:.12rem; height:.75rem; border-radius:.4rem; overflow:hidden;
  background:var(--tone); animation:nfill 1.6s cubic-bezier(.2,.8,.2,1) both; }
.nbar > i{ display:block; flex-grow:0; flex-shrink:1; min-width:.35rem; background:var(--n); }
.nbar.lg{ height:1.3rem; border-radius:.5rem; margin:.35rem 0 .45rem; }
/* 막대가 왼쪽에서부터 차오른다 */
@keyframes nfill{ from{ clip-path:inset(0 100% 0 0 round .4rem); } to{ clip-path:inset(0 0 0 0 round .4rem); } }

/* 급식 칸 : [영양] 막대 / 범례 — 알레르기 바로 위, 칸 아래쪽에 함께 붙는다 */
.mealcard .info.nutri{ align-items:center; margin-top:auto; padding-top:.35rem; }
.mealcard .info.nutri .label{ color:var(--meal); font-size:1.05rem; }
.mealcard .info.nutri + .info.allergy{ margin-top:0; }
.mealcard .nbox{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; }
/* 이름표가 들어가는 막대 : 칸 안 글자는 칸 색 위에 바탕색 글자로 (밝은·어두운 테마 모두 읽히게) */
.nbar.tagged{ position:relative; height:1.55rem; border-radius:.45rem; }
.nbar.tagged > i{ display:flex; align-items:center; justify-content:center; overflow:hidden; font-style:normal; }
.nbar.tagged > i > span{ flex:0 0 auto; padding:0 .25rem; white-space:nowrap; font-size:.9rem; font-weight:900;
  line-height:1; color:var(--card); font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
/* 칸 안에 못 넣은 값 : 지시선으로 아래에 연결한 이름표 */
.ncall{ position:relative; height:0; }
.ncall svg{ position:absolute; left:0; top:0; overflow:visible; pointer-events:none; }
.ncall path{ fill:none; stroke:var(--n); stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
.ncall .ntag{ position:absolute; white-space:nowrap; font-size:.88rem; font-weight:900; line-height:1.2;
  color:var(--n); font-variant-numeric:tabular-nums; }

function classStructure(){
  const fromServer = DATA && DATA.config && DATA.config.classStructure;

async function loadStructure(){
  if (STRUCTURE) return STRUCTURE;
  try{
    const url = (EDGE && edgeOk) ? EDGE + '/api/gas?type=config' : API + '?type=config';
    const res = await fetch(url, { cache:'no-store' });
    const body = await res.json();

        STRUCTURE = body.data.classStructure;

}

function bindViewControls(){
  const button = document.getElementById('fullscreenBtn');
  if (button.dataset.bound) return;
  button.dataset.bound = '1';
  const active = function(){ return Boolean(document.fullscreenElement || document.webkitFullscreenElement); };
  const sync = function(){
    const on = active();
    const path = on ? 'M3 8h5V3m8 0v5h5M8 21v-5H3m18 0h-5v5' : 'M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5';
    button.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + path + '"></path></svg>';
    button.setAttribute('aria-pressed', String(on));
    button.title = on ? '브라우저 화면으로 돌아가기 (Esc)' : '전체화면 보기';
    button.setAttribute('aria-label', button.title);
  };
  button.addEventListener('click', async function(){
    try{
      if (active()) {
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (!exit) throw new Error('unsupported');
        await exit.call(document);
      } else {
        const enter = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
        if (!enter) throw new Error('unsupported');
        await enter.call(document.documentElement);
      }
      sync();
    }catch(error){ showViewNotice('이 환경에서는 전체화면 전환을 지원하지 않습니다. PC 브라우저에서는 F11을 이용하세요.'); }
  });
  document.addEventListener('fullscreenchange', sync);
  document.addEventListener('webkitfullscreenchange', sync);
  sync();
  document.getElementById('comciOpen').addEventListener('click', function(event){
    event.preventDefault();
    const width = Math.min(440, screen.availWidth);
    const height = Math.min(600, Math.max(300, screen.availHeight - 100));
    const left = Math.max(0, Math.round(window.screenX + (window.outerWidth - width) / 2));
    const top = Math.max(0, Math.round(window.screenY + (window.outerHeight - height) / 2));
    let popup = null;
    try { popup = window.open(this.href, 'comciStudentTimetable', 'popup=yes,width=' + width + ',height=' + height + ',left=' + left + ',top=' + top + ',resizable=yes,scrollbars=yes'); } catch(error) {}
    if (popup) {
      try { popup.opener = null; popup.focus(); } catch(error) {}
      document.getElementById('comciFallback').hidden = true;
    } else {
      document.getElementById('comciFallback').hidden = false;
      showViewNotice('작은 창이 차단되었습니다. 옆의 새 탭으로 열기를 눌러주세요.');
    }
  });
}

function bindDateNav(){
  document.getElementById('prevDay').addEventListener('click', function(){ moveDay(-1); });

    if (e.key === 'F5'){                       // 전자칠판 리모컨·키보드용 새로고침
      e.preventDefault();
      goToday(true);
      return;
    }
    if (e.key === 'Escape'){
      if (closePhoto()) return;
      if (closeMealDetail()) return;
      if (themePanelOpen()){ showThemePanel(false); return; }
      if (closeCalModal()) return;
      if (tipPeriod != null){ hideTip(); return; }

        document.getElementById('setup').classList.remove('show');
        return;
      }
      goToday();
      return;
    }
    if (document.getElementById('setup').classList.contains('show')) return;
    if (document.getElementById('calModal').classList.contains('show')) return;
    if (photoOpen()) return;
    if (document.getElementById('mealDetail').classList.contains('show')) return;
    if (e.key === 'ArrowLeft') moveDay(-1);
    if (e.key === 'ArrowRight') moveDay(1);
    if (e.key === 'Home') goToday(true);
  });
}

function moveDay(step){

/** @param {boolean} force 사람이 직접 누른 경우 — 보관된 값을 건너뛰고 새로 받아온다 */
function goToday(force){
  hideTip();
  VIEW_DATE = null; clearTimeout(returnTimer);
  load(true, true, force === true);
}
function armReturn(){
  clearTimeout(returnTimer);

 * 학사일정을 이미 받아오고 있으므로 "추석 연휴"처럼 이름을 붙여 줄 수 있다.
 */
function dayReason(){
  const s = DATA && DATA.schedule;
  const d = (DATA && DATA.date) || '';
  if (s && s.ok && s.value){
    const hit = s.value.filter(function(e){
      return e.date === d && !HIDE_EVENTS.some(function(k){ return e.name.indexOf(k) >= 0; });
    });
    if (hit.length) return hit[0].name;
  }
  const wd = d ? weekdayOf(d) : '';
  if (wd === '토' || wd === '일') return '주말';
  return '';
}

  const d = (DATA && DATA.date) || '';
  if (!w || !w.ok || !w.value) return '';
  for (let i = 0; i < w.value.length; i++){
    const x = w.value[i];
    if (x.date > d && x.periods && x.periods.length){
      return formatDotDate(x.date, x.weekday);
    }
  }
  return '';
}

/** 수업이 없는 날 보여 줄 안내 — "추석 연휴 · 다음 수업 9.28.(월)" */
function emptyNote(){
  const parts = [];
  const why = dayReason();
  if (why) parts.push(why);
  const next = nextSchoolDay();
  if (next) parts.push('다음 수업 ' + next);
  return parts.join(' · ');
}

function emptyWord(){
  if (!isPreview()) return '오늘은';
  const d = (DATA && DATA.date) || VIEW_DATE;
  return Number(d.slice(4,6)) + '월 ' + Number(d.slice(6,8)) + '일은';
}
function bindIdleCursor(){
  let t = null;
  const hide = function(){ document.body.classList.add('idle'); };
  const show = function(){
    document.body.classList.remove('idle'); clearTimeout(t); t = setTimeout(hide, 5000);
  };
  ['mousemove','touchstart','keydown'].forEach(function(ev){
    document.addEventListener(ev, show, { passive:true });
  });
  t = setTimeout(hide, 5000);
}

/* ── 데이터 불러오기 ───────────────────────────────────────
   서버 응답이 4초 넘게 걸리므로
   · 받아온 날짜는 화면 캐시에 담아 두고
   · 앞뒤 하루를 미리 받아 둬서 날짜 이동이 기다림 없이 넘어가게 한다 */
function dayKey(ymd){ return (ymd || todayYmd()) + '/' + GRADE + '/' + CLASS; }

function dayUrl(ymd, viaEdge, fresh){
  const q = 'grade=' + encodeURIComponent(GRADE) + '&class=' + encodeURIComponent(CLASS)
          + (ymd ? '&date=' + encodeURIComponent(ymd) : '');
  if (viaEdge) return EDGE + '/api/all?' + q + (fresh ? '&fresh=1' : '');
  return API + '?type=all&' + q;
}

/** 빠른 통로가 말썽이면 잠시 Apps Script로 되돌아간다 */
function edgeFailed(err){
  console.warn('빠른 통로 실패 — Apps Script로 직접 부릅니다', err);
  edgeOk = false;
  setTimeout(function(){ edgeOk = true; }, 5 * 60 * 1000);
}

/* 같은 날짜를 이미 받고 있으면 새로 묻지 않고 그 결과를 함께 기다립니다.
   미리 받기가 진행 중일 때 화살표를 누르면 같은 요청이 두 번 나가
   서버 응답(10초 넘게 걸릴 때가 있음)을 처음부터 다시 기다리던 문제를 막습니다.
   (inflight 는 init() 보다 먼저 선언되어야 하므로 dayCache 옆에 둡니다) */
function fetchDayShared(ymd, fresh){
  const key = dayKey(ymd);
  if (!fresh && inflight[key]) return inflight[key];
  const job = fetchDay(ymd, fresh).finally(function(){
    if (inflight[key] === job) delete inflight[key];
  });
  inflight[key] = job;
  return job;
}

/** @param {boolean} fresh 캐시를 건너뛰고 서버에서 새로 받아온다 */
async function fetchDay(ymd, fresh){
  let res = null;

  if (EDGE && edgeOk){
    try{
      res = await fetch(dayUrl(ymd, true, fresh), { cache:'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
    }catch(err){
      edgeFailed(err);
      res = null;
    }
  }
  if (!res) res = await fetch(dayUrl(ymd, false, fresh), { cache:'no-store' });

  const body = await res.json();
  if (!body.ok) throw new Error(body.error || '응답 오류');

  const previous = dayCache[dayKey(ymd)];
  if (previous && previous.data.date === body.data.date && previous.data.screenSync &&
      previous.data.screenSync.capturedAt && previous.data.timetable && previous.data.timetable.ok &&
      (!body.data.screenSync || !body.data.screenSync.ok)) {
    // 컴시간 수집/중계 장애 때 나이스로 조용히 바꾸지 않고 마지막 컴시간 표를 유지한다.
    body.data.timetable = previous.data.timetable;
    body.data.week = previous.data.week;
    body.data.screenSync = Object.assign({}, previous.data.screenSync, {
      ok: false, stale: true, fallback: false, error: (body.data.screenSync && body.data.screenSync.error) || '컴시간 연결 확인 필요'
    });
  }

  dayCache[dayKey(ymd)] = { data:body.data, at:Date.now() };
  lastOkAt = Date.now();
  saveSnapshot(ymd, body.data);

  // 보관해 둔 값을 받은 경우다. 통로가 뒤에서 새 값을 받고 있으니 잠시 뒤 한 번 더 확인한다.
  if (res.headers.get('x-cache') === 'stale') queueFollowUp(ymd);
  else delete followUps[dayKey(ymd)];
  return body.data;
}

/* 앱을 켜자마자 지난번 화면을 먼저 보여 주기 위한 저장 ─────────
   전자칠판 앱은 껐다 켜는 일이 잦은데, 그때마다 몇 초씩 빈 화면을
   보지 않도록 마지막으로 본 오늘 화면을 기기에 남겨 둔다. */
function snapKey(){ return 'snap:' + GRADE + '/' + CLASS; }

function saveSnapshot(ymd, data){
  if (ymd && ymd !== todayYmd()) return;      // 지나간 날짜를 켤 때 보여 주면 곤란하다
  try{
    localStorage.setItem(snapKey(), JSON.stringify({ at:Date.now(), date:data.date, data:data }));
  }catch(err){ /* 저장 공간이 없으면 그냥 넘어간다 */ }
}

function loadSnapshot(){
  try{
    const snap = JSON.parse(localStorage.getItem(snapKey()) || 'null');
    if (!snap || !snap.data) return null;
    if (snap.date !== todayYmd()) return null;              // 날짜가 바뀌었으면 쓰지 않는다
    if (Date.now() - snap.at > 12 * 60 * 60 * 1000) return null;
    return snap.data;
  }catch(err){ return null; }
}

/** 보관본을 받았을 때, 뒤에서 갱신이 끝날 즈음 한 번 더 받아 온다 */
const followUps = {};
function queueFollowUp(ymd){
  const key = dayKey(ymd);
  followUps[key] = (followUps[key] || 0) + 1;
  if (followUps[key] > 2) return;             // 서버가 계속 느리면 매달리지 않는다

  setTimeout(async function(){
    if (VIEW_DATE !== (ymd || null)) return;
    const seq = loadSeq;
    try{
      const data = await fetchDayShared(ymd);
      if (seq === loadSeq && VIEW_DATE === (ymd || null)) showDay(data);
    }catch(err){ /* 다음 자동 갱신 때 다시 받는다 */ }
  }, 15000);    // 앞단이 Apps Script에서 새 값을 받는 데 12~15초 걸린다
}

function showDay(data){
  DATA = data;
  PERIODS = (DATA.config && DATA.config.periods) || [];
  render(); setStale(false);
}

/** 불러오는 동안에도 바뀐 날짜를 바로 보여 준다 */
function setPending(on, ymd){
  const box = document.getElementById('date');
  box.classList.toggle('loading', !!on);
  if (!on) return;
  const target = ymd || todayYmd();
  box.classList.toggle('preview', target !== todayYmd());
  box.innerHTML = dateBoxText(target);
}

/** 날짜 이동 칸 글자 — 오늘이면 '오늘', 다른 날이면 '11.23.(월)' */
function dateBoxText(ymd, weekday){
  if (!ymd || ymd === todayYmd()) return '오늘';
  return esc(formatDotDate(ymd, weekday));
}

/** 다른 날짜를 받는 동안 본문을 흐리게 — 날짜와 내용이 어긋나 보이지 않게 */
function setSwitching(on){
  document.getElementById('app').classList.toggle('switching', !!on && !!DATA);
}

/**
 * @param {boolean} useCache 캐시에 있으면 먼저 그리고 뒤에서 갱신한다
 * @param {boolean} prefetch 끝난 뒤 앞뒤 하루를 미리 받아 둔다
 * @param {boolean} fresh    보관된 값을 건너뛰고 서버에서 새로 받아온다
 */
function loadingStage(step){
  const panel = document.getElementById('dayLoader');
  panel.style.setProperty('--progress', ['12%','55%','100%'][step]);
  panel.querySelectorAll('.loader-steps span').forEach(function(el, i){ el.classList.toggle('active', i <= step); });
  document.getElementById('loaderCaption').textContent = ['우리 반을 확인하고 있어요.','시간표와 급식, 학사일정을 가져오고 있어요.','준비됐어요. 오늘도 좋은 하루 보내세요!'][step];
}
function beginDayLoading(switching){
  clearTimeout(loaderWaitTimer); clearTimeout(loaderFinishTimer);
  const panel = document.getElementById('dayLoader');
  panel.hidden = !!DATA;
  panel.classList.remove('complete');
  // 날짜를 옮기는 중이면 본문 가운데 안내가 따로 뜨므로 아래 알림은 겹쳐 띄우지 않는다
  document.getElementById('refreshNotice').hidden = !DATA || !!switching;
  document.getElementById('loaderRetry').hidden = true;
  document.getElementById('loaderHeading').textContent = '교실의 하루를 준비해요';
  loadingStage(0);
  loaderWaitTimer = setTimeout(function(){
    if (panel.hidden) return;
    document.getElementById('loaderCaption').textContent = '학교 자료에 연결하고 있어요. 잠시만 기다려 주세요.';
    document.getElementById('loaderRetry').hidden = false;
  }, 15000);
}
function endDayLoading(ok){
  clearTimeout(loaderWaitTimer);
  document.getElementById('refreshNotice').hidden = true;
  const panel = document.getElementById('dayLoader');
  if (panel.hidden) return;
  if (!ok){
    document.getElementById('loaderHeading').textContent = '연결을 잠시 확인해 주세요';
    document.getElementById('loaderCaption').textContent = '자료를 가져오지 못했어요. 잠시 후 다시 시도해 주세요.';
    document.getElementById('loaderRetry').hidden = false;
    return;
  }
  loadingStage(2); panel.classList.add('complete');
  loaderFinishTimer = setTimeout(function(){ panel.hidden = true; }, 500);
}

async function load(useCache, prefetch, fresh){
  const target = VIEW_DATE;
  const seq = ++loadSeq;
  clearTimeout(loaderWaitTimer); clearTimeout(loaderFinishTimer);
  const hit = dayCache[dayKey(target)];

  if (useCache && hit){
    setSwitching(false);
    showDay(hit.data);
    document.getElementById('dayLoader').hidden = true;
    document.getElementById('refreshNotice').hidden = true;
    setPending(false);
    if (fresh || Date.now() - hit.at >= CACHE_TTL_MS) revalidate(target, seq, fresh);
    if (prefetch) queuePrefetch(target);
    return;
  }

  setPending(true, target);
  const switching = !!DATA && (DATA.date !== (target || todayYmd()));
  setSwitching(switching);
  beginDayLoading(switching);
  let loaded = false;
  try{
    // 화살표를 연달아 누를 때 지나친 날짜까지 서버에 묻지 않도록 잠깐 기다린다
    await new Promise(function(done){ setTimeout(done, 180); });
    if (seq !== loadSeq) return;

    loadingStage(1);
    const data = await fetchDayShared(target, fresh);
    if (seq !== loadSeq) return;          // 그새 날짜가 또 바뀌었으면 버린다
    showDay(data);
    loaded = true;
  }catch(err){
    console.error('불러오기 실패', err);
    setStale(Date.now() - lastOkAt > REFRESH_MS * 2.5);
  }finally{
    if (seq === loadSeq){ setPending(false); setSwitching(false); endDayLoading(loaded); }
  }
  if (prefetch) queuePrefetch(target);
}

/** 캐시로 먼저 그린 뒤 조용히 최신 값으로 바꿔치기 */
async function revalidate(ymd, seq, fresh){
  if (seq === loadSeq) document.getElementById('refreshNotice').hidden = false;
  try{
    const data = await fetchDayShared(ymd, fresh);
    if (seq === loadSeq && VIEW_DATE === ymd) showDay(data);
  }catch(err){
    console.error('갱신 실패', err);
  }finally{
    if (seq === loadSeq) document.getElementById('refreshNotice').hidden = true;
  }
}

/** 앞뒤 하루 미리 받기 — 화면을 그린 뒤 한숨 쉬고 하나씩 */
function queuePrefetch(ymd){
  clearTimeout(prefetchTimer);
  const base = ymd || todayYmd();
  // 앞날과 뒷날을 동시에 받는다 — 하나씩 받으면 서버가 느릴 때 30초 가까이 걸린다
  prefetchTimer = setTimeout(function(){
    [1, -1].forEach(function(step){
      const next = shiftYmd(base, step);
      prefetchDay(next === todayYmd() ? null : next);
    });
  }, 300);
}

async function prefetchDay(ymd){
  const key = dayKey(ymd);
  const hit = dayCache[key];
  if (hit && Date.now() - hit.at < CACHE_TTL_MS) return;
  if (prefetching[key]) return;
  prefetching[key] = true;
  try{
    await fetchDayShared(ymd);
  }catch(err){
    /* 미리 받기 실패는 조용히 넘어간다 — 실제 조회 때 다시 시도한다 */
  }finally{
    delete prefetching[key];
  }
}

/** 평일 등교 시간대에는 더 자주 받아온다 */
function refreshMs(){
  const d = new Date();
  const day = d.getDay();
  if (day === 0 || day === 6) return REFRESH_MS;
  const hm = d.getHours() * 100 + d.getMinutes();
  return (hm >= 730 && hm <= 1630) ? (DATA && DATA.screenSync ? 60 * 1000 : REFRESH_SCHOOL_MS) : REFRESH_MS;
}

function tickRefresh(){
  updateScreenSync();
  if (screenRefreshing) return;
  if (Date.now() - lastRefreshAt < refreshMs()) return;
  lastRefreshAt = Date.now();
  screenRefreshing = true;
  load(false, false).finally(function(){ screenRefreshing = false; });
  sendBeat();
}

function updateScreenSync(){
  const el = document.getElementById('screenSync');
  if (!el || !DATA) return;
  const sync = DATA.screenSync;
  // 늘 떠 있는 안내는 빨간 글씨로 두면 정작 중요한 경고(바뀐 교시 등)가 묻힌다.
  // 짧은 회색 한 줄로 두고, 자세한 설명은 마우스를 올리면 보이게 한다.
  const failedMessage = "실시간 수업 변경 조회가 안됩니다. 변경 수업은 '컴시간학생.kr'에서 확인하세요.";
  const failedShort = 'ⓘ 수업 변경은 컴시간학생.kr에서 확인';
  el.style.color = '';
  el.title = '';
  if (!sync) {
    const rows = DATA.timetable && DATA.timetable.value;
    const neis = rows && rows.some(function(p){ return p.source === 'neis'; });
    el.textContent = neis ? failedShort : '';
    el.title = neis ? failedMessage : '';
    return;
  }
  if (sync.fallback) {
    el.textContent = failedShort;
    el.title = failedMessage;
    return;
  }
  // 수집기는 무료 한도 안에서 십여 분 간격으로 컴시간을 확인한다. 다음 확인 예정 시각(staleAt)이 지나도록 소식이 없을 때만 경고한다.
  const checkedAt = sync.verifiedAt || sync.capturedAt;
  const stale = !sync.ok || !checkedAt || (sync.staleAt ? Date.now() > sync.staleAt : Date.now() - checkedAt > 120000);
  const time = checkedAt ? new Date(checkedAt).toLocaleTimeString('ko-KR', { timeZone:'Asia/Seoul', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false }) : '';
  el.textContent = stale ? failedShort : '컴시간 화면 확인 ' + time;
  el.title = stale ? failedMessage + (time ? ' 마지막 확인: ' + time : '') : ('컴시간 수정일: ' + sync.updatedAt);
}

/**
 * 종이 울리면(교시가 바뀌면) 다음 갱신을 기다리지 않고 곧바로 다시 받습니다.
 *
 * 보결은 쉬는시간 무렵에 확정되고, 학생들이 화면을 보는 때도 쉬는시간입니다.
 * 그래서 경계가 지나는 순간이 가장 최신이어야 합니다.
 * 보관된 값을 건너뛰고(fresh) 받아오므로 앞단 캐시에 걸리지 않습니다.
 */
function watchBell(now){
  if (isPreview() || !DATA) return;
  const cur = currentSlot(now);
  const key = cur ? cur.name : '쉼';
  if (bellKey !== null && key !== bellKey){
    lastRefreshAt = Date.now();
    load(false, false, true);
  }
  bellKey = key;
}

function setStale(on){ document.getElementById('stale').classList.toggle('show', on); }

/* 이 교실 화면이 살아 있다는 신고 — 하루에 한 번만 보냅니다.
   '접속기록' 시트를 보면 어느 반 칠판이 며칠째 켜지지 않았는지 알 수 있습니다.
   앞단(Worker)을 거치지 않습니다. 보관해 둘 응답이 아니기 때문입니다. */
function sendBeat(){
  if (!GRADE || !CLASS) return;
  const key = 'beat:' + GRADE + '/' + CLASS;
  const today = todayYmd();
  if (lsGet(key) === today) return;

  fetch(API + '?type=beat&grade=' + encodeURIComponent(GRADE)
      + '&class=' + encodeURIComponent(CLASS)
      + '&v=' + encodeURIComponent(APP_VERSION), { cache:'no-store' })
    .then(function(){ lsSet(key, today); })
    .catch(function(){ /* 다음 갱신 때 다시 보낸다 */ });
}

/* 인터넷이 끊겨도 화면 자체(글꼴·틀)는 뜨도록 준비해 둡니다.
   자료는 예전부터 localStorage에 남겨 두고 있었지만, 페이지와 글꼴은
   받아 두지 않아 학교망이 흔들리면 빈 화면이 되곤 했습니다. */
/* 새 판 스스로 받기 ─────────────────────────────────────
   교실 칠판은 하루 종일 켜 둔 채라, 브라우저가 새 판(sw.js)을 확인하러 가는
   일이 드뭅니다. 그래서 새 판을 올려도 며칠씩 옛 화면에 머물곤 했습니다.
   · 30분마다(그리고 화면이 다시 보일 때) 새 판이 있는지 직접 확인하고
   · 새 판이 자리 잡으면, 아무도 화면을 만지지 않는 때를 골라 한 번 새로 고칩니다
   (쓰는 값들은 init() 보다 먼저 선언되어야 하므로 dayCache 옆에 둡니다) */
function registerServiceWorker(){
  ['mousemove','mousedown','touchstart','keydown','wheel'].forEach(function(ev){
    document.addEventListener(ev, function(){ lastTouchAt = Date.now(); }, { passive:true });
  });
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol !== 'https:' && location.hostname !== 'localhost') return;

  // 처음 설치될 때도 controllerchange 가 오므로, 원래 관리자가 있던 경우만 '새 판'으로 본다
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if (!hadController || swReloadPending) return;
    swReloadPending = true;
    tryAppReload();
  });

  navigator.serviceWorker.register('sw.js').then(function(reg){
    const check = function(){ reg.update().catch(function(){ /* 다음 확인 때 다시 */ }); };
    setInterval(check, SW_CHECK_MS);
    document.addEventListener('visibilitychange', function(){
      if (document.visibilityState === 'visible') check();
    });
  }).catch(function(err){
    console.warn('오프라인 준비 실패', err);
  });
}

/** 지금 새로 고쳐도 되는가 — 누가 만지는 중이거나 창이 떠 있거나 다른 날을 보는 중이면 미룬다 */
function quietForReload(){
  if (Date.now() - lastTouchAt < SW_QUIET_MS) return false;
  if (VIEW_DATE) return false;
  if (photoOpen() || themePanelOpen()) return false;
  if (['mealDetail', 'calModal'].some(function(id){
    return document.getElementById(id).classList.contains('show');
  })) return false;
  if (document.getElementById('setup').classList.contains('show')) return false;
  return true;
}
function tryAppReload(){
  if (!swReloadPending) return;
  if (quietForReload()){ location.reload(); return; }
  setTimeout(tryAppReload, 15 * 1000);
}

function render(){
  dataStamp++;                 // 자료가 바뀌었으니 시간표 칸을 반드시 다시 그린다
  applyServerTheme();
  renderDate(); renderMeal(); renderWeek(); renderCalendar(); tick();
  updateScreenSync();
}

function renderDate(){
  const d = DATA.date;
  document.getElementById('date').innerHTML = dateBoxText(d, DATA.weekday);
  const on = isPreview();
  document.getElementById('date').classList.toggle('preview', on);
  const btn = document.getElementById('goToday');
  if (on) btn.removeAttribute('data-off'); else btn.setAttribute('data-off', '');

}

function renderSlots(){
  const box = document.getElementById('slots');
  const t = DATA && DATA.timetable;
  if (t && !t.ok){
    SLOT_ROWS = {}; slotSig = ''; if (tipPeriod != null) hideTip();
    box.innerHTML = '<div class="none">시간표를 불러오지 못했습니다<' + '/div>'; return;
  }
  if (!t || !t.value || !t.value.length){
    SLOT_ROWS = {}; slotSig = ''; if (tipPeriod != null) hideTip();
    const why = emptyNote();
    box.innerHTML = '<div class="none">' + emptyWord() + ' 시간표가 없습니다'
                  + (why ? '<span class="why">' + esc(why) + '<' + '/span>' : '')
                  + '<' + '/div>';
    return;
  }

  const now = new Date();
  const nowMin = isPreview() ? -1 : minutesOf(now);
  const cur = currentSlot(now);
  const curP = (cur && cur.period > 0) ? cur.period : -1;
  const gap = breakGap(now);                       // 쉬는시간이면 다음 교시
  const nextP = gap ? gap.period : -1;

  // 달라진 것이 없으면 남은 시간과 진행바만 갈아끼우고 끝낸다
  let doneCount = 0;
  t.value.forEach(function(row){ if (slotDone(row.period, nowMin)) doneCount++; });
  const sig = [dataStamp, curP, nextP, doneCount, t.value.length].join('|');

  if (sig === slotSig && box.querySelector('.slots')){
    updateLiveSlot(cur, nowMin);
    return;
  }
  slotSig = sig;

  SLOT_ROWS = {};
  box.innerHTML = '<div class="slots">' + t.value.map(function(row){
    const c = subjectColor(row.subject);
    const on = row.period === curP;
    const next = !on && row.period === nextP;
    const done = !on && !next && slotDone(row.period, nowMin);
    const cls = 'slot' + (on ? ' on' : next ? ' next' : done ? ' done' : '')
              + (row.changed ? ' mod' : '');
    SLOT_ROWS[row.period] = row;
    let inner = '<div class="p">' + row.period + '교시<' + '/div>'
              + '<div class="s">' + esc(row.subject) + '<' + '/div>';
    if (row.changed) inner += '<div class="chg">변경<' + '/div>';
    if (on || next){
      // 값은 updateLiveSlot이 매초 채운다
      inner += '<div class="left"><' + '/div><div class="bar"><i><' + '/i><' + '/div>';
    }
    const teacher = String(row.teacher || '').trim();
    const prevTeacher = String(row.previousTeacher || '').trim();
    const teacherChanged = Boolean(row.changed && prevTeacher && prevTeacher !== teacher);
    if (teacher){
      inner += '<div class="tch">' + esc(teacher)
             + (teacherChanged ? '<span class="mark">교체<' + '/span>' : '') + '<' + '/div>';
    }
    return '<div class="' + cls + '" style="--c:' + c + '" data-period="' + row.period + '"'
         + (next ? ' data-from="' + gap.fromMin + '" data-start="' + gap.startMin + '"' : '')
         + '>' + inner + '<' + '/div>';
  }).join('') + '<' + '/div>';

  updateLiveSlot(cur, nowMin);
  bindSlotTip();
  syncTip();
}

/**
 * 매초 하는 일은 이것뿐입니다 — 글자 한 곳과 진행바 너비 한 곳.
 * 칸을 다시 만들지 않으므로 떠 있는 설명창도 더 이상 흔들리지 않습니다.
 */
function updateLiveSlot(cur, nowMin){
  if (nowMin < 0) return;

  const on = document.querySelector('#slots .slot.on');
  if (on && cur && cur.period > 0){
    fillSlotBar(on, cur.startMin, cur.endMin, nowMin, '분 남음', '곧 종료');
  }

  const next = document.querySelector('#slots .slot.next');
  if (next){
    const left = fillSlotBar(next, Number(next.dataset.from), Number(next.dataset.start),
                             nowMin, '분 후 시작', '곧 시작');
    next.classList.toggle('soon', left <= 1);      // 1분 남으면 신호를 준다
  }
}

/** 칸의 '남은 시간' 글자와 진행바를 채우고, 남은 분을 돌려준다 */
function fillSlotBar(el, startMin, endMin, nowMin, suffix, soonText){
  const total = endMin - startMin;
  const pct = total > 0
    ? Math.min(100, Math.max(0, (nowMin - startMin) / total * 100))
    : 0;
  const left = Math.max(0, Math.ceil(endMin - nowMin));

  const leftEl = el.querySelector('.left');
  if (leftEl){
    const text = left > 0 ? left + suffix : soonText;
    if (leftEl.textContent !== text) leftEl.textContent = text;
  }
  const barEl = el.querySelector('.bar > i');
  if (barEl) barEl.style.width = pct.toFixed(1) + '%';
  return left;
}

/* ── 상세 레이어창 : 교사·변경 내역 ───────────────────────── */
function bindSlotTip(){
  const box = document.getElementById('slots');
  if (!box || box.dataset.tipBound === '1') return;
  box.dataset.tipBound = '1';
  box.addEventListener('mouseover', function(e){
    const slot = e.target.closest ? e.target.closest('.slot') : null;
    if (!slot) return;
    showTip(Number(slot.dataset.period), false);
  });
  box.addEventListener('mouseleave', function(){ if (!tipSticky) hideTip(); });
  box.addEventListener('click', function(e){
    const slot = e.target.closest ? e.target.closest('.slot') : null;
    if (!slot) return;
    const p = Number(slot.dataset.period);
    if (tipPeriod === p && tipSticky){ hideTip(); return; }
    showTip(p, true);
  });
  document.addEventListener('click', function(e){
    if (!tipSticky) return;
    if (e.target.closest && e.target.closest('#slots')) return;
    hideTip();
  });
}

function showTip(period, sticky){
  const row = SLOT_ROWS[period];
  if (!row) return;
  tipPeriod = period;
  tipSticky = !!sticky;
  clearTimeout(tipTimer);

  const teacher = String(row.teacher || '').trim();
  const prevSubject = String(row.previousSubject || '').trim();
  const prevTeacher = String(row.previousTeacher || '').trim();
  const note = String(row.note || '').trim();
  const by = String(row.by || '').trim();

  let html = '<div class="hd"><span>' + esc(row.subject) + '<' + '/span>'
           + '<span class="pd">' + period + '교시<' + '/span><' + '/div>';
  html += '<div class="rw">담당 <b>' + (teacher ? esc(teacher) : '정보 없음') + '<' + '/b><' + '/div>';
  if (row.changed){
    const before = [prevSubject, prevTeacher].filter(Boolean).join(' · ');
    html += before
      ? '<div class="rw warn">변경 전 <span class="old">' + esc(before) + '<' + '/span><' + '/div>'
      : '<div class="rw warn">시간표가 변경되었습니다<' + '/div>';
  }
  if (note) html += '<div class="rw">비고 ' + esc(note) + '<' + '/div>';
  if (by)   html += '<div class="rw">알림 ' + esc(by) + '<' + '/div>';

  document.getElementById('tipBox').innerHTML = html;
  const tip = document.getElementById('tip');
  tip.classList.add('show');
  tip.setAttribute('aria-hidden', 'false');
  placeTip();
  if (sticky) tipTimer = setTimeout(hideTip, 8000);
}

function placeTip(){
  const tip = document.getElementById('tip');
  const slot = document.querySelector('#slots .slot[data-period="' + tipPeriod + '"]');
  if (!slot){ hideTip(); return; }
  const a = slot.getBoundingClientRect();
  const t = tip.getBoundingClientRect();
  const pad = 8, gap = 10;
  let left = a.left + a.width / 2 - t.width / 2;
  left = Math.max(pad, Math.min(left, window.innerWidth - t.width - pad));
  let top = a.bottom + gap;
  if (top + t.height > window.innerHeight - pad) top = a.top - t.height - gap;
  if (top < pad) top = pad;
  tip.style.left = Math.round(left) + 'px';
  tip.style.top  = Math.round(top) + 'px';
}

function syncTip(){
  if (tipPeriod == null) return;
  if (!SLOT_ROWS[tipPeriod]){ hideTip(); return; }
  placeTip();
}

function hideTip(){
  tipPeriod = null; tipSticky = false;
  clearTimeout(tipTimer);
  const tip = document.getElementById('tip');
  tip.classList.remove('show');
  tip.setAttribute('aria-hidden', 'true');
}

/* ── 화면 테마 ─────────────────────────────────────────────── */
function applyTheme(id, save){
  const found = THEMES.some(function(t){ return t.id === id; });
  THEME = found ? id : 'light';

  const root = document.documentElement;
  if (THEME === 'light') root.removeAttribute('data-theme');
  else root.dataset.theme = THEME;

  if (save !== false){
    THEME_CHOSEN = true;         // 교실에서 고른 테마는 학교 기본값보다 우선한다
    try{ localStorage.setItem('theme', THEME); }catch(err){}
  }
  markTheme();
}

/**
 * 화면의 기본 테마(BOOT_THEME)를 적용하고 저장한다.
 * 교실에서 T 키로 직접 고른 적이 있으면 그 교실에서는 바꾸지 않는다.
 */
function rememberDefaultTheme(id){
  id = BOOT_THEME; // 기본값은 이 화면에서 관리하며, 교실에서 직접 고른 값은 유지한다.
  if (!id || !THEMES.some(function(t){ return t.id === id; })) return;
  try{ localStorage.setItem('theme:default', id); }catch(err){}
  if (!THEME_CHOSEN && id !== THEME) applyTheme(id, false);
}

function applyServerTheme(){
  rememberDefaultTheme(DATA && DATA.config && DATA.config.defaultTheme);
}

/** 목록에서 지금 쓰는 테마에 표시를 남긴다 */
function markTheme(){
  const list = document.getElementById('themeList');
  if (!list) return;
  Array.prototype.forEach.call(list.querySelectorAll('.tbtn'), function(btn){
    const on = btn.dataset.theme === THEME;
    btn.classList.toggle('on', on);
    btn.setAttribute('aria-checked', on ? 'true' : 'false');
    const ck = btn.querySelector('.ck');
    if (ck) ck.textContent = on ? '✓' : '';
  });
}

function buildThemeList(){
  const list = document.getElementById('themeList');
  if (!list) return;
  list.innerHTML = THEMES.map(function(t){
    return '<button type="button" class="tbtn" role="menuitemradio" data-theme="' + t.id + '"'
         + ' style="--a:' + t.a + ';--b:' + t.b + '">'
         + '<span class="sw"><' + '/span>'
         + '<span class="nm">' + esc(t.name) + '<small>' + esc(t.desc || ({light:'산뜻하고 밝은 기본 화면',chalk:'분필로 쓴 듯 편안한 초록',night:'눈이 편안한 짙은 남색',hanji:'따뜻한 종이와 단청의 색'}[t.id] || '')) + '</small><' + '/span>'
         + '<span class="ck"><' + '/span>'
         + '<' + '/button>';
  }).join('');

  list.addEventListener('click', function(e){
    const btn = e.target.closest('.tbtn');
    if (!btn) return;
    applyTheme(btn.dataset.theme);
    showThemePanel(false);
  });
  markTheme();
}

function showThemePanel(on){
  const panel = document.getElementById('themePanel');
  const fab = document.getElementById('themeFab');
  panel.classList.toggle('show', !!on);
  panel.setAttribute('aria-hidden', on ? 'false' : 'true');
  fab.setAttribute('aria-expanded', on ? 'true' : 'false');
}
function themePanelOpen(){
  return document.getElementById('themePanel').classList.contains('show');
}

/** 목록을 열지 않고 다음 테마로 바로 넘기기 (T 키) */
function cycleTheme(){
  const at = THEMES.findIndex(function(t){ return t.id === THEME; });
  applyTheme(THEMES[(at + 1) % THEMES.length].id);
  showThemePanel(false);
}

function bindTheme(){
  const fab = document.getElementById('themeFab');
  fab.innerHTML = ICON.theme;
  buildThemeList();
  applyTheme(THEME, false);      // 머리말에서 미리 입힌 값을 정리해 둔다

  fab.addEventListener('click', function(e){
    e.stopPropagation();
    showThemePanel(!themePanelOpen());
  });

  // 다른 곳을 누르면 닫는다
  document.addEventListener('click', function(e){
    if (!themePanelOpen()) return;
    if (e.target.closest('#themeWrap')) return;
    showThemePanel(false);
  });

  document.addEventListener('keydown', function(e){
    if (e.key !== 't' && e.key !== 'T') return;
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    if (document.getElementById('setup').classList.contains('show')) return;
    cycleTheme();
  });
}

/* ── 확대 / 축소 ───────────────────────────────────────────── */
function clampZoom(v){
  if (!isFinite(v) || !v) return 1;
  return Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, Math.round(v * 100) / 100));
}
function applyZoom(toast){
  document.documentElement.style.setProperty('--zoom', String(ZOOM));
  try{ localStorage.setItem('zoom', String(ZOOM)); }catch(err){}
  if (toast) showZoomToast();
  syncTip();
  setupMarquee();
}
function nudgeZoom(step){
  const next = clampZoom(ZOOM + step);
  if (next === ZOOM) return;
  ZOOM = next; applyZoom(true);
}
function resetZoom(){ ZOOM = 1; applyZoom(true); }
function showZoomToast(){
  const el = document.getElementById('zoomToast');
  el.textContent = Math.round(ZOOM * 100) + '%';
  el.classList.add('show');
  clearTimeout(zoomToastTimer);
  zoomToastTimer = setTimeout(function(){ el.classList.remove('show'); }, 1200);
}
function bindZoom(){
  window.addEventListener('wheel', function(e){
    if (!e.ctrlKey) return;
    e.preventDefault();
    nudgeZoom(e.deltaY < 0 ? ZOOM_STEP : -ZOOM_STEP);
  }, { passive:false });

  document.addEventListener('keydown', function(e){
    if (e.key === '+' || e.key === '=' || (e.key === 'Add')){ e.preventDefault(); nudgeZoom(ZOOM_STEP); return; }
    if (e.key === '-' || e.key === '_' || (e.key === 'Subtract')){ e.preventDefault(); nudgeZoom(-ZOOM_STEP); return; }
    if (e.key === '0' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); resetZoom(); }
  });

  let pinchBase = 0, pinchZoom = 1;
  const spread = function(touches){
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.hypot(dx, dy);
  };
  document.addEventListener('touchstart', function(e){
    if (e.touches.length !== 2) return;
    pinchBase = spread(e.touches); pinchZoom = ZOOM;
  }, { passive:true });
  document.addEventListener('touchmove', function(e){
    if (e.touches.length !== 2 || !pinchBase) return;
    e.preventDefault();
    const next = clampZoom(pinchZoom * (spread(e.touches) / pinchBase));
    if (next !== ZOOM){ ZOOM = next; applyZoom(true); }
  }, { passive:false });
  document.addEventListener('touchend', function(e){
    if (e.touches.length < 2) pinchBase = 0;
  }, { passive:true });

  window.addEventListener('resize', syncTip);
  window.addEventListener('resize', setupMarquee);
  applyZoom(false);
}

function renderMeal(){
  const box = document.getElementById('mealBody');
  const title = document.getElementById('mealTitle');
  const when = viewedDateLabel();
  const mealLabel = (when ? esc(when) + ' ' : '') + '점심 식단';
  const m = DATA.meal;
  if (m && !m.ok){
    title.innerHTML = ICON.meal + '<span>' + mealLabel + '<' + '/span>';
    box.innerHTML = '<div class="none">급식을 불러오지 못했습니다<' + '/div>';
    mealHtml = '';
    return;
  }
  if (!m || !m.value || !m.value.length){
    title.innerHTML = ICON.meal + '<span>' + mealLabel + '<' + '/span>';
    box.innerHTML = '<div class="none">' + emptyWord() + ' 급식 정보가 없습니다<' + '/div>';
    mealHtml = '';
    return;
  }
  const lunch = m.value.find(function(x){ return /중식/.test(x.type); }) || m.value[0];
  const kcal = formatKcal(lunch.kcal);
  const nutritionNote = formatNutritionNote(lunch.nutrition);
  const originNote    = String(lunch.origin || '').trim();
  // 영양·원산지는 교실 뒤에서 읽히지 않는 작은 글씨였으므로, 눌러서 크게 보는 창으로 옮겼다
  const detail = (nutritionNote || originNote)
    ? '<button type="button" class="meal-more" id="mealMore">영양 · 원산지<' + '/button>' : '';
  title.innerHTML = ICON.meal + '<span>' + mealLabel + '<' + '/span>'
    + (kcal ? '<span class="kcal">' + esc(kcal) + '<' + '/span>' : '') + detail;
  const nutri = nutritionModel(lunch.nutrition);
  MEAL_DETAIL = { nutri:nutri, kcal:kcal, origin:parseOrigin(originNote) };

  // 메뉴가 MAX_MEAL보다 많으면 예전에는 조용히 사라졌습니다. 이제 몇 개가
  // 더 있는지 알려 줍니다.
  const all = lunch.dishes || [];
  const dishes = all.slice(0, MAX_MEAL);
  const hidden = all.length - dishes.length;

  let items = dishes.map(function(x){
    const codes = (x.allergy || []).filter(function(c){ return ALLERGY_NAMES[Number(c)]; });
    return '<li>' + esc(dishName(x))
         + (codes.length ? '<span class="alg">' + esc(codes.join('.')) + '<' + '/span>' : '')
         + '<' + '/li>';
  }).join('');
  if (hidden > 0) items += '<li class="more">외 ' + hidden + '개<' + '/li>';

  const allergyNote   = allergyLegend(dishes);
  // 탄수화물·단백질·지방·기타 비율 막대 — 창을 열지 않아도 보이게 알레르기 바로 위에 둔다
  const nutriRow      = nutri ? nutriCardHtml(nutri) : '';

  // 사진이 없으면 빈 상자를 두지 않고 그 자리를 메뉴에 준다
  const photoUrl = (DATA.photo && DATA.photo.ok && DATA.photo.value) ? DATA.photo.value : '';
  const photo = photoUrl
    ? '<div class="shotbox zoomable" title="누르면 크게 보입니다">'
        + '<img src="' + esc(photoUrl) + '" alt="급식 사진" onerror="mealPhotoFallback(this)">'
        + '<span class="zoomhint">' + ICON.zoom + '<' + '/span>'
      + '<' + '/div>'
    : '';

  const html = '<div class="body">'
    +   '<div class="top' + (photoUrl ? '' : ' nophoto') + '"><ul>' + items + '<' + '/ul>' + photo + '<' + '/div>'
    +   nutriRow
    +   infoRow('allergy',   '알레르기', allergyNote)
    + '<' + '/div>';

  // 내용이 그대로면 손대지 않습니다. 3분마다 다시 만들면 흐르던 자막이
  // 처음으로 되돌아가고, 급식 사진도 다시 받느라 한 번 깜빡입니다.
  if (html === mealHtml) return;
  mealHtml = html;
  box.innerHTML = html;
  setupMarquee();
}

/** 제목은 붙박이, 내용은 흐르는 한 줄 */
function infoRow(cls, label, text){
  if (!text) return '';
  const one = '<span>' + esc(text) + '<' + '/span>';
  return '<div class="info ' + cls + '">'
       +   '<b class="label">' + label + '<' + '/b>'
       +   '<div class="scroll"><div class="track">'
       +     one + '<span aria-hidden="true">' + esc(text) + '<' + '/span>'
       +   '<' + '/div><' + '/div>'
       + '<' + '/div>';
}

/**
 * 내용이 칸보다 길 때만 흐르게 하고, 길이에 맞춰 시간을 정합니다.
 * 시간을 고정해 두면 짧은 글은 굼뜨고 긴 글은 쏜살같이 지나가서
 * 읽을 수가 없습니다. 그래서 '1초에 몇 rem'으로 속도를 고정합니다.
 */
function setupMarquee(){
  layoutNutriBars();                     // 영양 막대 이름표도 칸 폭이 바뀔 때마다 다시 맞춘다
  const rows = document.querySelectorAll('#mealBody .info');
  const rem = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;

  Array.prototype.forEach.call(rows, function(row){
    const scroll = row.querySelector('.scroll');
    const first  = row.querySelector('.track > span');
    if (!scroll || !first) return;

    const need = first.scrollWidth > scroll.clientWidth + 1;
    row.classList.toggle('on', need);
    if (!need){ row.style.removeProperty('--dur'); return; }

    const dist = first.scrollWidth + MARQUEE_GAP * rem;
    row.style.setProperty('--dur', (dist / (MARQUEE_SPEED * rem)).toFixed(1) + 's');
  });
}

/** 나이스는 메뉴 이름 끝에 별표를 붙여 오는 일이 있습니다 */
function dishName(x){
  return String((x && x.name) || '').replace(/[*]+$/, '').trim();
}

/**
 * 오늘 나온 메뉴에 실제로 들어 있는 번호만 풀어 적습니다.
 * 18종을 모두 늘어놓으면 교실 화면에서 읽히지 않기 때문입니다.
 */
function allergyLegend(dishes){
  const seen = {};
  (dishes || []).forEach(function(d){
    ((d && d.allergy) || []).forEach(function(c){
      const k = Number(c);
      if (ALLERGY_NAMES[k]) seen[k] = true;
    });
  });
  const keys = Object.keys(seen).map(Number).sort(function(a, b){ return a - b; });
  if (!keys.length) return '';
  return keys.map(function(k){ return k + ' ' + ALLERGY_NAMES[k]; }).join(' · ');
}
/* ── 영양 그래프 ──────────────────────────────────────────
   나이스 영양정보를 그래프로 쓰기 좋게 정리합니다.
   · 탄수화물·단백질·지방은 g 그대로
   · 나머지(비타민·무기질)는 mg·㎍ 단위라 g으로 바꿔 '기타'로 묶습니다
   · 열량 비율은 탄수화물·단백질 1g = 4kcal, 지방 1g = 9kcal 로 계산합니다 */
const MACROS = [
  { key:'carb', name:'탄수화물', kcal:4 },
  { key:'prot', name:'단백질',   kcal:4 },
  { key:'fat',  name:'지방',     kcal:9 }
];

/** 단위를 g으로 — 모르는 단위면 null */
function toGram(value, unit){
  const v = parseFloat(String(value).replace(/,/g, ''));
  if (!isFinite(v)) return null;
  const u = String(unit || '').replace(/\s/g, '').toLowerCase();
  if (u === 'g') return v;
  if (u === 'mg') return v / 1000;
  if (/^(㎍|μg|µg|ug|mcg|r\.?e\.?|re)$/.test(u)) return v / 1e6;   // 비타민A(R.E)는 ㎍ 단위
  return null;
}

/** 비율 글자 — 1% 이상은 정수, 그 아래는 소수 한 자리 */
function pctText(p){
  if (p >= 1) return Math.round(p) + '%';
  if (p > 0) return (Math.round(p * 10) / 10 || 0.1) + '%';
  return '0%';
}
function gramText(g){
  return (g >= 10 ? Math.round(g * 10) / 10 : Math.round(g * 100) / 100) + 'g';
}

function nutritionModel(list){
  if (!list || !list.length) return null;
  const macros = MACROS.map(function(m){
    const hit = list.find(function(x){ return String(x.name || '').indexOf(m.name) === 0; });
    return { key:m.key, name:m.name, kcal:m.kcal, g: hit ? (toGram(hit.value, hit.unit) || 0) : 0 };
  });
  if (!macros.some(function(m){ return m.g > 0; })) return null;

  const micros = list.filter(function(x){
    return !MACROS.some(function(m){ return String(x.name || '').indexOf(m.name) === 0; });
  }).map(function(x){
    return { name:x.name, value:x.value, unit:x.unit || '', g:toGram(x.value, x.unit) };
  });
  const etcG = micros.reduce(function(s, x){ return s + (x.g || 0); }, 0);

  const parts = macros.concat(etcG > 0 ? [{ key:'etc', name:'기타', g:etcG }] : []);
  const total = parts.reduce(function(s, p){ return s + p.g; }, 0);
  parts.forEach(function(p){ p.pct = total ? p.g / total * 100 : 0; });

  const energy = macros.map(function(m){ return { key:m.key, name:m.name, kcal:m.g * m.kcal }; });
  const eTotal = energy.reduce(function(s, e){ return s + e.kcal; }, 0);
  energy.forEach(function(e){ e.pct = eTotal ? e.kcal / eTotal * 100 : 0; });

  return { parts:parts, energy:energy, micros:micros, total:total };
}

/** 가로로 쌓은 막대 — 왼쪽부터 차오르며 나타난다 */
function stackBar(list, cls){

    + esc(list.map(function(p){ return p.name + ' ' + pctText(p.pct); }).join(', ')) + '">'
    + list.map(function(p){
        return '<i class="n-' + p.key + '" style="flex-basis:' + p.pct.toFixed(2) + '%"><' + '/i>';

}

/**
 * 급식 칸 안 : 이름표가 붙는 막대 + 그 아래 지시선 줄

 */

/**
 * 막대 칸마다 글자가 '다 들어가는' 가장 긴 형태를 고르고, 못 넣은 정보는 지시선으로 아래에 붙인다.
 *   ① 이름 g · %   ② 이름 %   ③ %   ④ 칸 안은 비움
 * ②·③·④일 때 빠진 정보(그램, 이름)는 지시선 이름표로 옮겨 적으므로 어떤 비율에서도
 * 잘리는 글자 없이 모든 값이 보인다. 이름표끼리 겹치면 옆으로 밀고, 그래도 넘치면 두 줄로 나눈다.
 */
function layoutNutriBars(){
  document.querySelectorAll('.nbar.tagged').forEach(function(bar){
    const call = bar.parentNode.querySelector('.ncall');
    if (!call) return;
    const W = bar.clientWidth;
    if (!W) return;                       // 숨겨져 있으면 다음 기회에
    const notes = [];

    bar.querySelectorAll('i').forEach(function(seg){
      const span = seg.firstChild;
      const d = seg.dataset;
      span.style.color = readableOn(getComputedStyle(seg).backgroundColor);
      const room = seg.clientWidth - 8;   // 좌우 여백
      const tries = [
        { text:d.name + ' ' + d.g + ' · ' + d.pct, rest:'' },
        { text:d.name + ' ' + d.pct,               rest:d.g },
        { text:d.pct,                              rest:d.name + ' ' + d.g },
        { text:'',                                 rest:d.name + ' ' + d.g + ' · ' + d.pct }
      ];
      let pick = tries[tries.length - 1];
      for (let k = 0; k < tries.length - 1; k++){
        span.textContent = tries[k].text;
        if (span.offsetWidth <= room){ pick = tries[k]; break; }
      }
      span.textContent = pick.text;
      if (pick.rest){
        notes.push({ cls:seg.className, text:pick.rest, cx:seg.offsetLeft + seg.offsetWidth / 2 });
      }
    });

    call.innerHTML = '';
    call.style.height = '0px';
    if (!notes.length) return;

    // 이름표를 만들어 폭을 잰다
    notes.forEach(function(nt){
      const el = document.createElement('span');
      el.className = 'ntag ' + nt.cls;
      el.textContent = nt.text;
      call.appendChild(el);
      nt.el = el; nt.w = el.offsetWidth;
    });
    const GAP = 14;                       // 이름표 사이 최소 간격(px)
    const total = notes.reduce(function(s, nt){ return s + nt.w + GAP; }, 0);
    const rows = total > W ? 2 : 1;       // 한 줄에 다 안 들어가면 번갈아 두 줄
    for (let r = 0; r < rows; r++){
      const row = notes.filter(function(_, i){ return i % rows === r; });
      // 원하는 자리(칸 가운데)에 두고, 왼쪽→오른쪽으로 겹침을 밀어낸 뒤 오른쪽 끝을 넘으면 되민다
      row.forEach(function(nt){ nt.x = Math.max(0, Math.min(W - nt.w, nt.cx - nt.w / 2)); });
      for (let i = 1; i < row.length; i++) row[i].x = Math.max(row[i].x, row[i-1].x + row[i-1].w + GAP);
      for (let i = row.length - 1; i >= 0; i--){
        const limit = i === row.length - 1 ? W - row[i].w : row[i+1].x - GAP - row[i].w;
        row[i].x = Math.max(0, Math.min(row[i].x, limit));
      }
      row.forEach(function(nt){ nt.row = r; });
    }

    // 지시선 : 칸 아래 가운데 → 이름표 위 가운데
    const rem = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
    const LINE = Math.round(rem * .55), ROWH = Math.round(rem * 1.25);
    let paths = '';
    notes.forEach(function(nt){
      const top = LINE + nt.row * ROWH;
      nt.el.style.left = nt.x + 'px';
      nt.el.style.top = top + 'px';
      const tx = Math.round(nt.x + nt.w / 2);
      const sx = Math.round(nt.cx);
      paths += '<path class="' + nt.cls + '" d="M' + sx + ' 0 V' + Math.round(LINE * .45)
             + ' L' + tx + ' ' + (top - 1) + '"/>';
    });
    call.insertAdjacentHTML('afterbegin',
      '<svg width="' + W + '" height="' + (LINE + rows * ROWH) + '">' + paths + '<' + '/svg>');
    call.style.height = (LINE + rows * ROWH) + 'px';
  });
}
/** 칸 색 위에서 더 잘 읽히는 글자색 — 흰색과 진한 남색 중 대비가 큰 쪽 */
function readableOn(rgb){
  const m = String(rgb).match(/[\d.]+/g);
  if (!m || m.length < 3) return '#FFFFFF';
  const lin = function(v){ v = v / 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); };
  const L = .2126 * lin(+m[0]) + .7152 * lin(+m[1]) + .0722 * lin(+m[2]);
  const onWhite = 1.05 / (L + .05);
  const onDark  = (L + .05) / (.0144 + .05);     // #111C33 의 밝기 ≈ 0.0144
  return onWhite >= onDark ? '#FFFFFF' : '#111C33';
}

/** '996.0 Kcal' → '996 kcal' */
function formatKcal(raw){
  const text = String(raw || '').trim();
  if (!text) return '';
  const n = parseFloat(text.replace(/,/g, ''));
  return isFinite(n) ? Math.round(n).toLocaleString('ko-KR') + ' kcal' : text;
}

/* ── 영양 · 원산지 크게 보기 ───────────────────────────────── */
/** 나이스 원산지 글 '쇠고기 : 국내산 돼지고기 : 국내산 …' → [['쇠고기','국내산'], …] */
function parseOrigin(text){
  const out = [];
  const re = /\s*([^:]+?)\s*:\s*(\S+?(?:\s또는\s\S+?)?)(?=\s|$)/g;
  let m;
  while ((m = re.exec(String(text || '')))){
    if (m[1] && m[2] && m[1] !== '비고') out.push([m[1], m[2]]);
  }
  return out;
}

/**
 * 원형(도넛) 그래프 + 오른쪽 범례.
 * 둘레가 100인 원(r=15.915)을 쓰므로 비율(%)을 그대로 호의 길이로 쓴다.
 * 처음엔 길이 0으로 그려 두고, 창이 열리면 animateDonuts()가 조각을 차례로 채운다.
 */
function donutChart(list, center, sub, valueOf){
  let at = 0;
  const arcs = list.map(function(p){
    const len = Math.max(p.pct, .8);               // 아주 작은 조각(기타 0.1%)도 보이게
    const gap = list.length > 1 ? .5 : 0;          // 조각 사이 틈
    const arc = '<circle class="arc n-' + p.key + '" cx="21" cy="21" r="15.915"'
      + ' data-len="' + Math.max(len - gap, .3).toFixed(2) + '"'
      + ' stroke-dasharray="0 100" stroke-dashoffset="' + (25 - at).toFixed(2) + '"><' + '/circle>';
    at += p.pct;
    return arc;
  }).join('');
  return '<div class="donut">'
    +   '<div class="ring"><svg viewBox="0 0 42 42" role="img" aria-label="'
    +     esc(list.map(function(p){ return p.name + ' ' + pctText(p.pct); }).join(', ')) + '">'
    +     '<circle class="track" cx="21" cy="21" r="15.915"><' + '/circle>' + arcs
    +   '<' + '/svg><div class="mid"><b>' + esc(center) + '<' + '/b><small>' + esc(sub) + '<' + '/small><' + '/div><' + '/div>'
    +   legendRows(list, valueOf)
    + '<' + '/div>';
}

/** 창이 열릴 때 도넛 조각을 하나씩 차례로 채운다 */
function animateDonuts(root){
  const arcs = root.querySelectorAll('.donut .arc');
  const still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // 길이 0인 상태를 브라우저가 한 번 계산하게 한 뒤(getBoundingClientRect) 목표 길이로 바꿔야
  // '0 → 목표'로 움직인다. 화면 그리기 신호를 기다리지 않으므로 어떤 경우에도 끝까지 채워진다.
  root.getBoundingClientRect();
  arcs.forEach(function(a){
    getComputedStyle(a).strokeDasharray;
    const idx = Array.prototype.indexOf.call(a.parentNode.querySelectorAll('.arc'), a);
    if (!still) a.style.transitionDelay = (idx * .28) + 's';
    a.style.strokeDasharray = a.dataset.len + ' ' + (100 - a.dataset.len);
  });
}

/** 범례 표 — 색 점 · 이름 · 값 · 비율 */
function legendRows(list, valueOf){
  return '<ul class="nrows">' + list.map(function(p){
    return '<li class="n-' + p.key + '"><span class="dot"><' + '/span><b>' + esc(p.name) + '<' + '/b>'
         + '<span class="v">' + esc(valueOf(p)) + '<' + '/span><em>' + pctText(p.pct) + '<' + '/em><' + '/li>';
  }).join('') + '<' + '/ul>';
}

/** 영양 쪽 : 무게 비율 · 열량 비율 · 비타민·무기질 */
function nutritionDetailHtml(n, kcal){
  if (!n) return '';
  const micros = n.micros.length
    ? '<h4>비타민 · 무기질 <small>(위 \'기타\'에 들어 있는 것)<' + '/small><' + '/h4><div class="ntiles">'
      + n.micros.map(function(x){
          return '<div><span>' + esc(x.name) + '<' + '/span><b>' + esc(x.value) + '<small>'
               + esc(x.unit) + '<' + '/small><' + '/b><' + '/div>';
        }).join('') + '<' + '/div>'
    : '';
  return '<section class="dsec">'
    + '<h3>영양 정보' + (kcal ? ' <span class="big">' + esc(kcal) + '<' + '/span>' : '') + '<' + '/h3>'
    + '<h4>무게 비율 <small>(g 기준)<' + '/small><' + '/h4>'
    + donutChart(n.parts, gramText(n.total), '전체 무게', function(p){ return gramText(p.g); })
    + '<h4>열량 비율 <small>(탄수화물·단백질 1g=4kcal, 지방 1g=9kcal)<' + '/small><' + '/h4>'
    + donutChart(n.energy, kcal ? kcal.replace(' kcal', '') : '', 'kcal', function(p){ return Math.round(p.kcal) + 'kcal'; })
    + micros
    + '<' + '/section>';
}

/** 원산지 쪽 : 나라별 비율 막대 + 나라별 묶음 */
function originDetailHtml(list){
  if (!list.length) return '';
  const groups = [];
  list.forEach(function(r){
    let item = r[0], where = r[1];
    // '콩 가공품 : 두부:미국,캐나다,호주' 처럼 품목이 값 안에 들어온 경우를 풀어 준다
    const inner = where.match(/^([^:]+):(.+)$/);
    if (inner){ item += ' (' + inner[1] + ')'; where = inner[2]; }
    const detail = where.match(/\((.*)\)/);
    if (detail){ item += ' (' + detail[1] + ')'; where = where.replace(/\s*\(.*\)/, ''); }
    let g = groups.find(function(x){ return x.name === where; });
    if (!g){ g = { name:where, items:[] }; groups.push(g); }
    g.items.push(item);
  });
  // 국내산을 맨 앞에, 나머지는 많은 순
  groups.sort(function(a, b){
    if (a.name === '국내산') return -1;
    if (b.name === '국내산') return 1;
    return b.items.length - a.items.length;
  });
  const keys = ['o1', 'o2', 'o3', 'o4', 'o5'];
  groups.forEach(function(g, i){
    g.key = keys[Math.min(i, keys.length - 1)];
    g.pct = g.items.length / list.length * 100;
  });
  return '<section class="dsec">'
    + '<h3>원산지 <span class="big">' + list.length + '개 품목<' + '/span><' + '/h3>'
    + donutChart(groups, String(list.length), '품목', function(g){ return g.items.length + '개'; })
    + groups.map(function(g){
        return '<div class="ogroup n-' + g.key + '"><h4><span class="dot"><' + '/span>' + esc(g.name) + '<' + '/h4>'
             + '<div class="chips">' + g.items.map(function(x){ return '<span>' + esc(x) + '<' + '/span>'; }).join('')
             + '<' + '/div><' + '/div>';
      }).join('')
    + '<' + '/section>';
}

/* ── 급식 사진 크게 보기 ────────────────────────────────────
   급식 카드는 자료를 받을 때마다 다시 그려지므로, 사진 하나하나에

function bindPhotoZoom(){

  // 큰 사진은 어디를 눌러도 닫힙니다

  // 영양 · 원산지 버튼은 제목과 함께 다시 그려지므로 제목 칸에 한 번만 단다

function renderWeek(){
