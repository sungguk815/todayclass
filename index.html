<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 교실</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<style>
:root{
  --bg:#EEF3F9; --card:#FFFFFF; --ink:#111C33; --soft:#6E7E99;
  --line:#DFE7F1; --note:#E11D48; --cal:#F0821E; --meal:#12A150;
  --r-hero:1.1rem; --r-card:.75rem;
}

/* 전체 크기 손잡이
   · 가로(72)와 세로(40.5) 중 더 빡빡한 쪽을 따르므로 어떤 해상도에서도 넘치지 않습니다
   · --zoom : 사용자 확대/축소 배율 (Ctrl+휠, +/- 키, 두 손가락 확대) */
html{
  --zoom:1;
  font-size:calc(min(100vw / 72, 100vh / 40.5) * var(--zoom));
}

*{ box-sizing:border-box; margin:0; padding:0; }
body{
  width:100vw; height:100vh; overflow:hidden; background:var(--bg); color:var(--ink);
  font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  font-weight:600; -webkit-font-smoothing:antialiased; cursor:default; user-select:none;
}
body.idle{ cursor:none; }
[hidden]{ display:none !important; }
svg{ display:block; }

#app{
  display:grid; width:100%; height:100%; gap:.65rem;
  padding:.8rem 1.1rem 3.9rem;          /* 아래 여백 = 고정 일정 띠 자리 */
  grid-template-columns:55fr 45fr;      /* 급식 : 주간 시간표 = 55 : 45 */
  grid-template-rows:auto auto minmax(0,1fr) auto;
  grid-template-areas:"head head" "line line" "meal week" "note note";
}
#app > *{ min-width:0; min-height:0; }

/* ── 머리말 ────────────────────────────────────────────── */
.head{ grid-area:head; display:flex; align-items:center; justify-content:space-between; gap:1rem;
  padding:0 .3rem; }
.head .room{ display:flex; align-items:center; gap:.5rem;
  font-size:2rem; font-weight:900; letter-spacing:-.02em; cursor:pointer; }
.head .room svg{ width:1.7rem; height:1.7rem; color:var(--soft); }
.head .room:hover,.head .room:focus-visible{ color:#0B5CAB; outline:none; }
.head .now{ display:flex; align-items:baseline; gap:.5rem; }
.head .nowlabel{ font-size:1.05rem; font-weight:800; color:var(--soft); }
.head .clock{ font-size:3rem; font-weight:900; letter-spacing:-.035em;
  font-variant-numeric:tabular-nums; line-height:1; }
.head .nav{ display:flex; align-items:center; gap:.4rem; }
.head .navlabel{ font-size:1.05rem; font-weight:800; color:var(--soft); margin-right:.15rem;
  white-space:nowrap; }
.head .date{ font-size:1.45rem; font-weight:800; color:var(--soft);
  min-width:9.5rem; text-align:center; padding:.14rem .5rem; border-radius:.35rem; }
.head .date.preview{ color:#7A4B00; background:#FFE9B8; }
.head .date .sub{ font-size:.68em; font-weight:800; margin-left:.3em; opacity:.8; }
.head .date.loading{ animation:datePulse 1.1s ease-in-out infinite; }
@keyframes datePulse{ 0%,100%{ opacity:1; } 50%{ opacity:.45; } }
.navbtn{ display:grid; place-items:center; width:2.1rem; height:2.1rem;
  border-radius:.5rem; border:.09rem solid var(--line); background:var(--card);
  color:var(--soft); cursor:pointer; }
.navbtn svg{ width:1.1rem; height:1.1rem; }
.navbtn:hover,.navbtn:focus-visible{ color:var(--ink); border-color:var(--soft); outline:none; }
.navbtn.today{ width:auto; padding:0 .8rem; font:inherit; font-size:1.05rem; font-weight:900; }
.navbtn.today[data-off]{ visibility:hidden; }   /* 자리는 지키고 모습만 감춤 */

/* ── 카드 공통 ─────────────────────────────────────────── */
.card{ background:var(--card); border:.09rem solid var(--line);
  border-radius:var(--r-card); padding:.75rem .9rem; display:flex; flex-direction:column; }
.ct{ display:flex; align-items:center; gap:.42rem; margin-bottom:.55rem;
  font-size:1.22rem; font-weight:900; color:var(--soft); }
.ct svg{ width:1.25rem; height:1.25rem; }
.ct.g{ color:var(--meal); } .ct.o{ color:var(--cal); } .ct.r{ color:var(--note); }
.ct .cal-icon{
  display:grid; place-items:center; width:1.8rem; height:1.8rem; padding:0;
  border:0; border-radius:.4rem; background:transparent; color:inherit; cursor:pointer;
}
.ct .cal-icon:hover,.ct .cal-icon:focus-visible{ background:#FFF1DE; outline:none; }
.ct .cal-icon svg{ width:1.25rem; height:1.25rem; }
.none{ font-size:1.5rem; font-weight:700; color:var(--soft); }

/* ── 주인공 : 오늘 시간표 타임라인 ─────────────────────── */
.line{
  grid-area:line; background:var(--card); border-radius:var(--r-hero);
  box-shadow:0 .5rem 1.6rem rgba(17,28,51,.10);
  padding:.8rem .9rem .9rem;
}
.line .ct{ margin-bottom:.6rem; }
.slots{ display:flex; gap:.42rem; align-items:stretch; }
.slot{
  position:relative;
  flex:1 1 0; min-width:0; border-radius:.6rem; padding:.5rem .45rem .6rem;
  background:#F6F9FD; border-top:.32rem solid var(--c);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.12rem;
  transition:flex-grow .3s ease;
}
.slot .p{ font-size:1.05rem; font-weight:900; color:var(--soft); }
.slot .s{ font-size:2.1rem; font-weight:900; letter-spacing:-.03em; color:var(--c);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
.slot.done{ background:#F2F5F9; border-top-color:#D5DEEA; }
.slot.done .s{ color:#A9B6C9; } .slot.done .p{ color:#BCC7D6; }

.slot.on{
  flex:1.9 1 0; background:var(--c); border-top-color:var(--c);
  box-shadow:0 .3rem .9rem color-mix(in srgb, var(--c) 40%, transparent);
}
.slot.on .p{ color:rgba(255,255,255,.82); font-size:1.15rem; }
.slot.on .s{ color:#fff; font-size:3.3rem; }
.slot.on .left{ font-size:1.2rem; font-weight:800; color:rgba(255,255,255,.9); }
.slot .chg{ font-size:.92rem; font-weight:900; color:#fff; background:var(--note);
  padding:.05rem .38rem; border-radius:.25rem; }
.slot .bar{ width:82%; height:.22rem; border-radius:.11rem;
  background:rgba(255,255,255,.32); overflow:hidden; margin-top:.18rem; }
.slot .bar > i{ display:block; height:100%; background:#fff; width:0; transition:width .9s linear; }

/* 교사명 : 칸 아래 빈 공간에 떠 있는 작은 레이어 — 기존 내용을 가리지 않습니다 */
.slot .tch{
  position:absolute; top:100%; left:50%; transform:translateX(-50%); margin-top:.04rem;
  max-width:100%; z-index:2; pointer-events:none;
  padding:0 .3rem; border-radius:.28rem;
  background:rgba(255,255,255,.94); border:.06rem solid var(--line);
  box-shadow:0 .12rem .3rem rgba(17,28,51,.10);
  font-size:.8rem; font-weight:800; line-height:1.34; color:var(--soft);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.slot.on .tch{ color:var(--c); border-color:color-mix(in srgb, var(--c) 35%, var(--line)); }
.slot.done .tch{ color:#AEBAC9; }
.slot.mod .tch{ color:var(--note); border-color:color-mix(in srgb, var(--note) 40%, var(--line)); }
.slot .tch .mark{ margin-left:.2rem; color:var(--note); }

/* 상세 레이어창 : 교시를 누르거나 올려두면 변경 내역까지 보여줍니다 */
#tip{
  position:fixed; top:0; left:0; z-index:26; max-width:20rem;
  opacity:0; visibility:hidden; transform:translateY(.3rem);
  transition:opacity .15s ease, transform .15s ease, visibility .15s;
  pointer-events:none;
}
#tip.show{ opacity:1; visibility:visible; transform:none; }
#tip .box{
  background:rgba(17,28,51,.96); color:#fff; border-radius:.5rem; padding:.5rem .7rem;
  box-shadow:0 .5rem 1.3rem rgba(17,28,51,.3);
}
#tip .hd{ display:flex; align-items:baseline; gap:.35rem; font-size:1.15rem; font-weight:900;
  letter-spacing:-.02em; }
#tip .hd .pd{ font-size:.9rem; font-weight:800; color:rgba(255,255,255,.7); }
#tip .rw{ margin-top:.2rem; font-size:.95rem; font-weight:700; color:rgba(255,255,255,.9);
  line-height:1.4; }
#tip .rw b{ font-weight:900; }
#tip .rw.warn{ color:#FFC7D2; }
#tip .rw .old{ text-decoration:line-through; opacity:.75; }

/* 확대/축소 안내 */
#zoomToast{
  position:fixed; right:1rem; bottom:4.1rem; z-index:27;
  padding:.3rem .7rem; border-radius:.4rem;
  background:rgba(17,28,51,.9); color:#fff; font-size:1rem; font-weight:900;
  opacity:0; transition:opacity .25s ease; pointer-events:none;
}
#zoomToast.show{ opacity:1; }

/* ── 급식 ──────────────────────────────────────────────── */
.mealcard{ grid-area:meal; }
.mealcard .row{ display:flex; gap:.75rem; align-items:stretch; flex:1 1 auto; min-height:0; }
.mealcard ul{ list-style:none; display:flex; flex-wrap:wrap; gap:.12rem 1rem;
  align-content:flex-start; flex:1 1 auto; min-width:0; }
.mealcard li{ display:flex; align-items:center; gap:.36rem;
  font-size:1.35rem; font-weight:800; line-height:1.25; }
.mealcard li::before{ content:''; width:.3rem; height:.3rem; border-radius:50%;
  background:var(--meal); flex:0 0 auto; }
.mealcard .menu{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:.35rem; }
.mealcard .nutrition{
  font-size:.92rem; font-weight:700; color:var(--soft); line-height:1.35;
  letter-spacing:-.01em;
}
/* 급식 사진은 4:3이므로 칸도 4:3으로 두고, 잘라내지 않고 전체를 담습니다 */
.mealcard .shotbox{
  flex:0 0 12rem; width:12rem; align-self:center;
  aspect-ratio:4 / 3; min-height:8.2rem; max-height:100%;
  border-radius:.55rem;
  background:#EDF2F8; border:.09rem solid var(--line); overflow:hidden;
  display:flex; align-items:center; justify-content:center;
}
.mealcard .shotbox img{ width:100%; height:100%; object-fit:contain; display:block; }
.mealcard .shotbox .empty{ font-size:1.05rem; font-weight:800; color:var(--soft);
  text-align:center; padding:.6rem; line-height:1.35; }
.mealcard .kcal{ margin-left:.35rem; font-size:1.15rem; font-weight:900;
  color:var(--note); letter-spacing:-.02em; }

/* ── 하단 고정 띠 : 일정 (항상 화면 맨 아래) ──── */
.calbar{
  position:fixed; left:0; right:0; bottom:0; z-index:5;
  display:flex; align-items:center; gap:1rem;
  padding:.4rem 1.3rem; height:3.4rem;
  background:var(--card); border-top:.09rem solid var(--line);
  box-shadow:0 -.35rem 1.1rem rgba(17,28,51,.07);
}
.calbar .ct{ margin:0; flex:0 0 auto; }
.calbar ul{ list-style:none; display:flex; gap:1.6rem; flex:1 1 auto; overflow:hidden; }
.calbar li{ display:flex; align-items:center; gap:.5rem;
  font-size:1.5rem; font-weight:800; white-space:nowrap; }
.dday{ flex:0 0 auto; min-width:5.4rem; text-align:center; font-size:1.05rem; font-weight:900;
  color:#fff; background:var(--cal); padding:.14rem .45rem; border-radius:.3rem;
  font-variant-numeric:tabular-nums; white-space:nowrap; }
.dday.far{ background:#EDF2F8; color:var(--soft); }

/* ── 주간 시간표 : 오른쪽 칸 전체 ──────────────────────── */
/* 확대했을 때 내용이 잘리지 않도록 두 카드는 넘칠 때만 스크롤됩니다 */
.mealcard, .weekcard{ overflow:auto; scrollbar-width:thin; }
.mealcard::-webkit-scrollbar, .weekcard::-webkit-scrollbar{ width:.35rem; height:.35rem; }
.mealcard::-webkit-scrollbar-thumb, .weekcard::-webkit-scrollbar-thumb{
  background:#CFDAE8; border-radius:.2rem; }

.weekcard{ grid-area:week; min-height:0; }
.weekcard table{ width:100%; height:100%; border-collapse:collapse; table-layout:fixed;
  font-size:1.2rem; font-weight:700; }
.weekcard th{ font-size:1.1rem; font-weight:900; color:var(--soft); padding:0 0 .25rem; }
.weekcard th.period, .weekcard td.period{
  width:2.2rem; color:var(--soft); font-size:1rem; font-weight:900; text-align:center; }
.weekcard th.today{ color:var(--ink); }
.weekcard td{ text-align:center; padding:.18rem .04rem; border-top:1px solid #EFF3F9;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#7C8AA3; }
.weekcard col.today{ background:#F3F7FD; }
.weekcard td.today{ font-weight:900; }

/* ── 공지 ──────────────────────────────────────────────── */
.note{ grid-area:note; display:none; }
.note.show{ display:block; }
.note .item{ display:flex; align-items:center; gap:.8rem; padding:.55rem 1rem;
  background:var(--card); border-radius:var(--r-card);
  border-left:.4rem solid var(--note); }
.note .item + .item{ margin-top:.3rem; }
.note .who{ display:flex; align-items:center; gap:.3rem; flex:0 0 auto;
  font-size:1.05rem; font-weight:900; color:#fff; background:var(--note);
  padding:.16rem .5rem; border-radius:.3rem; }
.note .who svg{ width:.9rem; height:.9rem; }
.note .text{ font-size:2.1rem; font-weight:900; line-height:1.25; letter-spacing:-.02em; }

/* ── 상태 · 설정 ───────────────────────────────────────── */
#stale{ position:fixed; right:1rem; bottom:.3rem; font-size:.95rem; font-weight:800;
  color:var(--note); opacity:0; transition:opacity .4s; }
#stale.show{ opacity:1; }
#setup{ position:fixed; inset:0; background:var(--bg); display:none; flex-direction:column;
  align-items:center; justify-content:center; gap:1.7rem; cursor:auto; z-index:30; }
#setup.show{ display:flex; }
#setup h1{ font-size:2.8rem; font-weight:900; letter-spacing:-.03em; }
#setup p{ font-size:1.4rem; font-weight:700; color:var(--soft); }
#setup .rows{ display:flex; gap:1rem; }
#setup select{ font:inherit; font-size:2rem; font-weight:900; padding:.55rem 1.2rem;
  border-radius:.6rem; background:var(--card); color:var(--ink); border:.1rem solid var(--line); }
#setup button{ font:inherit; font-size:1.75rem; font-weight:900; padding:.65rem 2.8rem;
  border-radius:.6rem; border:0; background:var(--ink); color:#fff; cursor:pointer; }
#setup #btnCancelSetup{ background:transparent; color:var(--soft); border:.1rem solid var(--line);
  font-size:1.2rem; padding:.45rem 1.6rem; }

/* ── 월별 학사일정 팝업 ─────────────────────────────────── */
#calModal{
  position:fixed; inset:0; z-index:20; display:none;
  align-items:center; justify-content:center; padding:1.2rem;
}
#calModal.show{ display:flex; }
.cal-backdrop{ position:absolute; inset:0; background:rgba(17,28,51,.45); }
.cal-dialog{
  position:relative; z-index:1; width:min(52rem, 100%); max-height:min(86vh, 44rem);
  background:var(--card); border-radius:1rem; border:.09rem solid var(--line);
  box-shadow:0 1rem 2.4rem rgba(17,28,51,.22);
  display:flex; flex-direction:column; overflow:hidden;
}
.cal-dialog-head{
  display:flex; align-items:center; gap:.5rem; padding:.85rem 1rem;
  border-bottom:.09rem solid var(--line);
}
.cal-dialog-head h2{
  flex:1 1 auto; text-align:center; font-size:1.55rem; font-weight:900; letter-spacing:-.02em;
}
.cal-dialog-head .navbtn{ width:2.4rem; height:2.4rem; }
.cal-dialog-head .close{
  margin-left:.3rem; width:auto; padding:0 .85rem; font:inherit; font-size:1.05rem; font-weight:900;
}
.cal-month{
  padding:.7rem .9rem 1rem; overflow:auto; flex:1 1 auto;
}
.cal-month table{ width:100%; border-collapse:collapse; table-layout:fixed; }
.cal-month th{
  font-size:1rem; font-weight:900; color:var(--soft); padding:.35rem 0 .55rem; text-align:center;
}
.cal-month th.sun,.cal-month td.sun .num{ color:#E11D48; }
.cal-month th.sat,.cal-month td.sat .num{ color:#2563EB; }
.cal-month td{
  vertical-align:top; height:5.4rem; border-top:1px solid #EFF3F9;
  padding:.28rem .25rem; font-size:.92rem; font-weight:700;
}
.cal-month td .num{
  display:inline-flex; align-items:center; justify-content:center;
  min-width:1.4rem; height:1.4rem; border-radius:.3rem;
  font-size:1rem; font-weight:900; color:var(--ink); margin-bottom:.15rem;
}
.cal-month td.today .num{ background:var(--cal); color:#fff; }
.cal-month td.mute{ opacity:.38; }
.cal-month td .ev{
  display:block; color:#9A5A12; line-height:1.25; margin-top:.08rem;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.cal-month .empty{ text-align:center; padding:2rem 1rem; }

@media (prefers-reduced-motion:reduce){
  .slot,.slot .bar > i{ transition:none; }
  .head .date.loading{ animation:none; opacity:.6; }
}
</style>
</head>

<body>
<div id="app">
  <header class="head">
    <div class="room"><span id="roomIcon"></span><span id="room">—</span></div>
    <div class="now">
      <span class="nowlabel" id="nowLabel">—</span>
      <span class="clock" id="clock">--:--</span>
    </div>
    <div class="nav">
      <button class="navbtn today" id="goToday" data-off>오늘로 가기</button>
      <button class="navbtn" id="prevDay" aria-label="이전 날짜"></button>
      <div class="date" id="date">—</div>
      <button class="navbtn" id="nextDay" aria-label="다음 날짜"></button>
    </div>
  </header>

  <section class="line">
    <div class="ct" id="lineTitle"></div>
    <div id="slots"><div class="none">불러오는 중</div></div>
  </section>

  <section class="card mealcard">
    <div class="ct g" id="mealTitle"></div>
    <div id="mealBody"><div class="none">불러오는 중</div></div>
  </section>

  <section class="card weekcard">
    <div class="ct" id="weekTitle"></div>
    <div id="weekBody"></div>
  </section>

  <div class="note" id="note"></div>
</div>

<div class="calbar">
  <div class="ct o" id="calTitle">
    <button type="button" class="cal-icon" id="calOpen" aria-label="월별 학사일정"></button>
    <span>일정</span>
  </div>
  <div id="calBody"></div>
</div>

<div id="tip" aria-hidden="true"><div class="box" id="tipBox"></div></div>
<div id="zoomToast" aria-hidden="true">100%</div>

<div id="stale">연결 끊김 — 마지막 정보 표시 중</div>

<div id="setup">
  <h1>이 교실은 몇 학년 몇 반인가요?</h1>
  <p id="setupHint">한 번만 설정하면 다음부터는 바로 시작합니다</p>
  <div class="rows"><select id="selGrade"></select><select id="selClass"></select></div>
  <button id="btnSave">시작하기</button>
  <button id="btnCancelSetup" type="button" hidden>취소</button>
</div>

<div id="calModal" aria-hidden="true">
  <div class="cal-backdrop" id="calBackdrop"></div>
  <div class="cal-dialog" role="dialog" aria-modal="true" aria-labelledby="calMonthLabel">
    <div class="cal-dialog-head">
      <button type="button" class="navbtn" id="calPrevMonth" aria-label="이전 달"></button>
      <h2 id="calMonthLabel">—</h2>
      <button type="button" class="navbtn" id="calNextMonth" aria-label="다음 달"></button>
      <button type="button" class="navbtn close" id="calClose">닫기</button>
    </div>
    <div class="cal-month" id="calMonthBody"><div class="empty">불러오는 중</div></div>
  </div>
</div>

<script>
/* ============================================================
   서버 주소 — 이미 채워져 있습니다
   ============================================================ */
const API = 'https://script.google.com/macros/s/AKfycbxfa2h5lJZQjCqRFfrQ3wcACVrJcy9yDPqZKpvEsrHkoA8vCjnAnOxJkenKFKmIfCRi/exec';

const REFRESH_MS = 3 * 60 * 1000;
const RETURN_MS  = 2 * 60 * 1000;
const HIDE_EVENTS = ['토요휴업일','재량휴업일','일요일'];
const MAX_MEAL = 8;
const MAX_CAL  = 3;

const SUBJECT_COLORS = [
  [['국어','문학','독서','작문'], '#E04A38'],
  [['수학'],                      '#2563EB'],
  [['영어'],                      '#7C4DE8'],
  [['과학','물리','화학','생명','지구'], '#0F9D58'],
  [['사회','일사','경제','지리'], '#EA8C10'],
  [['역사','한국사'],             '#A85A2B'],
  [['체육','스포','운동'],        '#0EA5B7'],
  [['음악','음B'],                '#D6337E'],
  [['미술','미B'],                '#F26B21'],
  [['기가','기술','가정'],        '#5B7085'],

    for (let j = 0; j < keys.length; j++){

}

/* ── 데이터 불러오기 ───────────────────────────────────────
   서버 응답이 4초 넘게 걸리므로
   · 받아온 날짜는 화면 캐시에 담아 두고
   · 앞뒤 하루를 미리 받아 둬서 날짜 이동이 기다림 없이 넘어가게 한다 */
function dayKey(ymd){ return (ymd || todayYmd()) + '/' + GRADE + '/' + CLASS; }

function dayUrl(ymd){
  let url = API + '?type=all&grade=' + encodeURIComponent(GRADE)
                + '&class=' + encodeURIComponent(CLASS);
  if (ymd) url += '&date=' + encodeURIComponent(ymd);
  return url;
}

async function fetchDay(ymd){
  const res = await fetch(dayUrl(ymd), { cache:'no-store' });
  const body = await res.json();
  if (!body.ok) throw new Error(body.error || '응답 오류');
  dayCache[dayKey(ymd)] = { data:body.data, at:Date.now() };
  lastOkAt = Date.now();
  return body.data;
}

function showDay(data){
  DATA = data;
  PERIODS = (DATA.config && DATA.config.periods) || [];
  render(); setStale(false);
}

/** 불러오는 동안에도 바뀐 날짜를 바로 보여 준다 */
function setPending(on, ymd){
  const box = document.getElementById('date');
  box.classList.toggle('loading', !!on);
  if (!on) return;
  const target = ymd || todayYmd();
  box.classList.toggle('preview', target !== todayYmd());
  box.innerHTML = esc(formatDotDate(target)) + '<span class="sub">조회<' + '/span>';
}

/**
 * @param {boolean} useCache 캐시에 있으면 먼저 그리고 뒤에서 갱신한다
 * @param {boolean} prefetch 끝난 뒤 앞뒤 하루를 미리 받아 둔다
 */
async function load(useCache, prefetch){
  const target = VIEW_DATE;
  const seq = ++loadSeq;
  const hit = dayCache[dayKey(target)];

  if (useCache && hit){
    showDay(hit.data);
    setPending(false);
    if (Date.now() - hit.at >= CACHE_TTL_MS) revalidate(target, seq);
    if (prefetch) queuePrefetch(target);
    return;
  }

  setPending(true, target);
  try{
    // 화살표를 연달아 누를 때 지나친 날짜까지 서버에 묻지 않도록 잠깐 기다린다
    await new Promise(function(done){ setTimeout(done, 180); });
    if (seq !== loadSeq) return;

    const data = await fetchDay(target);
    if (seq !== loadSeq) return;          // 그새 날짜가 또 바뀌었으면 버린다
    showDay(data);
  }catch(err){
    console.error('불러오기 실패', err);
    setStale(Date.now() - lastOkAt > REFRESH_MS * 2.5);
  }finally{
    if (seq === loadSeq) setPending(false);
  }
  if (prefetch) queuePrefetch(target);
}

/** 캐시로 먼저 그린 뒤 조용히 최신 값으로 바꿔치기 */
async function revalidate(ymd, seq){
  try{
    const data = await fetchDay(ymd);
    if (seq === loadSeq && VIEW_DATE === ymd) showDay(data);
  }catch(err){
    console.error('갱신 실패', err);
  }
}

/** 앞뒤 하루 미리 받기 — 화면을 그린 뒤 한숨 쉬고 하나씩 */
function queuePrefetch(ymd){
  clearTimeout(prefetchTimer);
  const base = ymd || todayYmd();
  prefetchTimer = setTimeout(async function(){
    for (const step of [1, -1]){
      const next = shiftYmd(base, step);
      await prefetchDay(next === todayYmd() ? null : next);
    }
  }, 1200);
}

async function prefetchDay(ymd){
  const key = dayKey(ymd);
  const hit = dayCache[key];
  if (hit && Date.now() - hit.at < CACHE_TTL_MS) return;
  if (prefetching[key]) return;
  prefetching[key] = true;
  try{
    await fetchDay(ymd);
  }catch(err){
    /* 미리 받기 실패는 조용히 넘어간다 — 실제 조회 때 다시 시도한다 */
  }finally{
    delete prefetching[key];
  }
}

/* ── 상세 레이어창 : 교사·변경 내역 ───────────────────────── */
function bindSlotTip(){
  const box = document.getElementById('slots');
  if (!box || box.dataset.tipBound === '1') return;
  box.dataset.tipBound = '1';
  box.addEventListener('mouseover', function(e){
    const slot = e.target.closest ? e.target.closest('.slot') : null;
    if (!slot) return;

  });
  box.addEventListener('mouseleave', function(){ if (!tipSticky) hideTip(); });
  box.addEventListener('click', function(e){
    const slot = e.target.closest ? e.target.closest('.slot') : null;

    const p = Number(slot.dataset.period);

    showTip(p, true);

    if (!tipSticky) return;
    if (e.target.closest && e.target.closest('#slots')) return;
    hideTip();
  });
}

function showTip(period, sticky){
  const row = SLOT_ROWS[period];
  if (!row) return;
  tipPeriod = period;
  tipSticky = !!sticky;
  clearTimeout(tipTimer);

  const teacher = String(row.teacher || '').trim();
  const prevSubject = String(row.previousSubject || '').trim();
  const prevTeacher = String(row.previousTeacher || '').trim();
  const note = String(row.note || '').trim();
  const by = String(row.by || '').trim();

  let html = '<div class="hd"><span>' + esc(row.subject) + '<' + '/span>'
           + '<span class="pd">' + period + '교시<' + '/span><' + '/div>';
  html += '<div class="rw">담당 <b>' + (teacher ? esc(teacher) : '정보 없음') + '<' + '/b><' + '/div>';
  if (row.changed){
    const before = [prevSubject, prevTeacher].filter(Boolean).join(' · ');
    html += before
      ? '<div class="rw warn">변경 전 <span class="old">' + esc(before) + '<' + '/span><' + '/div>'
      : '<div class="rw warn">시간표가 변경되었습니다<' + '/div>';
  }
  if (note) html += '<div class="rw">비고 ' + esc(note) + '<' + '/div>';
  if (by)   html += '<div class="rw">알림 ' + esc(by) + '<' + '/div>';

  document.getElementById('tipBox').innerHTML = html;
  const tip = document.getElementById('tip');
  tip.classList.add('show');
  tip.setAttribute('aria-hidden', 'false');
  placeTip();
  if (sticky) tipTimer = setTimeout(hideTip, 8000);
}

function placeTip(){
  const tip = document.getElementById('tip');
  const slot = document.querySelector('#slots .slot[data-period="' + tipPeriod + '"]');
  if (!slot){ hideTip(); return; }
  const a = slot.getBoundingClientRect();
  const t = tip.getBoundingClientRect();
  const pad = 8, gap = 10;
  let left = a.left + a.width / 2 - t.width / 2;
  left = Math.max(pad, Math.min(left, window.innerWidth - t.width - pad));
  let top = a.bottom + gap;
  if (top + t.height > window.innerHeight - pad) top = a.top - t.height - gap;
  if (top < pad) top = pad;
  tip.style.left = Math.round(left) + 'px';
  tip.style.top  = Math.round(top) + 'px';
}

function syncTip(){
  if (tipPeriod == null) return;
  if (!SLOT_ROWS[tipPeriod]){ hideTip(); return; }
  placeTip();
}

function hideTip(){
  tipPeriod = null; tipSticky = false;
  clearTimeout(tipTimer);
  const tip = document.getElementById('tip');
  tip.classList.remove('show');
  tip.setAttribute('aria-hidden', 'true');
}

/* ── 확대 / 축소 ───────────────────────────────────────────── */
function clampZoom(v){
  if (!isFinite(v) || !v) return 1;
  return Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, Math.round(v * 100) / 100));
}
function applyZoom(toast){
  document.documentElement.style.setProperty('--zoom', String(ZOOM));
  try{ localStorage.setItem('zoom', String(ZOOM)); }catch(err){}
  if (toast) showZoomToast();
  syncTip();
}
function nudgeZoom(step){
  const next = clampZoom(ZOOM + step);
  if (next === ZOOM) return;
  ZOOM = next; applyZoom(true);
}
function resetZoom(){ ZOOM = 1; applyZoom(true); }
function showZoomToast(){
  const el = document.getElementById('zoomToast');
  el.textContent = Math.round(ZOOM * 100) + '%';
  el.classList.add('show');
  clearTimeout(zoomToastTimer);
  zoomToastTimer = setTimeout(function(){ el.classList.remove('show'); }, 1200);
}
function bindZoom(){
  window.addEventListener('wheel', function(e){
    if (!e.ctrlKey) return;
    e.preventDefault();
    nudgeZoom(e.deltaY < 0 ? ZOOM_STEP : -ZOOM_STEP);
  }, { passive:false });

  document.addEventListener('keydown', function(e){
    if (e.key === '+' || e.key === '=' || (e.key === 'Add')){ e.preventDefault(); nudgeZoom(ZOOM_STEP); return; }
    if (e.key === '-' || e.key === '_' || (e.key === 'Subtract')){ e.preventDefault(); nudgeZoom(-ZOOM_STEP); return; }
    if (e.key === '0' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); resetZoom(); }
  });

  let pinchBase = 0, pinchZoom = 1;
  const spread = function(touches){
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.hypot(dx, dy);
  };
  document.addEventListener('touchstart', function(e){
    if (e.touches.length !== 2) return;
    pinchBase = spread(e.touches); pinchZoom = ZOOM;
  }, { passive:true });
  document.addEventListener('touchmove', function(e){
    if (e.touches.length !== 2 || !pinchBase) return;
    e.preventDefault();
    const next = clampZoom(pinchZoom * (spread(e.touches) / pinchBase));
    if (next !== ZOOM){ ZOOM = next; applyZoom(true); }
  }, { passive:false });
  document.addEventListener('touchend', function(e){
    if (e.touches.length < 2) pinchBase = 0;
  }, { passive:true });

  window.addEventListener('resize', syncTip);
  applyZoom(false);
}

function formatNutritionNote(list){
  if (!list || !list.length) return '';

function renderWeek(){
  const box = document.getElementById('weekBody');
  const w = DATA.week;
  if (!w || !w.ok || !w.value || !w.value.length){
    box.innerHTML = '';
    document.querySelector('#weekTitle span').textContent = '주간 시간표';
    return;
  }
  const days = w.value, shown = DATA.date;
  const mon = days[0], fri = days[Math.min(4, days.length - 1)];
  document.querySelector('#weekTitle span').textContent =
    '주간 시간표(' + formatDotDate(mon.date, mon.weekday) + '~'
                 + formatDotDate(fri.date, fri.weekday) + ')';

  let maxP = 7;
  days.forEach(function(d){
    d.periods.forEach(function(p){ if (p.period > maxP) maxP = p.period; });
  });

  let cols = '<col class="period">', head = '<th class="period"><' + '/th>';
  days.forEach(function(d){
    const on = d.date === shown ? ' class="today"' : '';
    cols += '<col' + on + '>'; head += '<th' + on + '>' + d.weekday + '<' + '/th>';
  });

  let rows = '';
  for (let p = 1; p <= maxP; p++){
    rows += '<tr><td class="period">' + p + '<' + '/td>';
    days.forEach(function(d){
      const hit = d.periods.find(function(x){ return x.period === p; });
      const on = d.date === shown ? ' class="today"' : '';
      const st = hit ? ' style="color:' + subjectColor(hit.subject) + '"' : '';
      rows += '<td' + on + st + '>' + (hit ? esc(hit.subject) : '') + '<' + '/td>';
    });
    rows += '<' + '/tr>';
  }
  box.innerHTML = '<table><colgroup>' + cols + '<' + '/colgroup>'
                + '<thead><tr>' + head + '<' + '/tr><' + '/thead><tbody>' + rows + '<' + '/tbody><' + '/table>';
}

function renderCalendar(){
  const box = document.getElementById('calBody');
  const s = DATA.schedule;
  if (!s || !s.ok || !s.value){ box.innerHTML = '<div class="none">—<' + '/div>'; return; }
  const list = s.value
    .filter(function(e){ return !HIDE_EVENTS.some(function(k){ return e.name.indexOf(k) >= 0; }); })
    .filter(function(e){ return isPreview() ? true : e.dday >= 0; })
    .slice(0, MAX_CAL);
  if (!list.length){ box.innerHTML = '<div class="none">예정된 일정이 없습니다<' + '/div>'; return; }
  box.innerHTML = '<ul>' + list.map(function(e){
    const label = formatDotDate(e.date, weekdayOf(e.date));
    const far = e.dday > 3 ? ' far' : '';
    return '<li><span class="dday' + far + '">' + label + '<' + '/span>'
         + '<span>' + esc(e.name) + '<' + '/span><' + '/li>';
  }).join('') + '<' + '/ul>';
}

function bindCalendarModal(){
  const openBtn = document.getElementById('calOpen');
  if (!openBtn || openBtn.dataset.bound === '1') return;
  openBtn.dataset.bound = '1';
  openBtn.addEventListener('click', function(e){
    e.preventDefault();
    e.stopPropagation();
    openCalModal();
  });
  document.getElementById('calClose').addEventListener('click', closeCalModal);
  document.getElementById('calBackdrop').addEventListener('click', closeCalModal);
  document.getElementById('calPrevMonth').addEventListener('click', function(){ shiftCalMonth(-1); });
  document.getElementById('calNextMonth').addEventListener('click', function(){ shiftCalMonth(1); });
}

function openCalModal(){
  hideTip();
  const base = (DATA && DATA.date) ? DATA.date : todayYmd();
  calMonth = new Date(+base.slice(0,4), +base.slice(4,6)-1, 1);
  document.getElementById('calModal').classList.add('show');
  document.getElementById('calModal').setAttribute('aria-hidden', 'false');
  document.body.style.cursor = 'auto';
  document.body.classList.remove('idle');
  loadMonthSchedule();
}

function closeCalModal(){
  const modal = document.getElementById('calModal');
  if (!modal.classList.contains('show')) return false;
  modal.classList.remove('show');
  modal.setAttribute('aria-hidden', 'true');
  return true;
}

function shiftCalMonth(step){
  if (!calMonth) return;
  calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + step, 1);
  loadMonthSchedule();
}

async function loadMonthSchedule(){
  const body = document.getElementById('calMonthBody');
  const label = document.getElementById('calMonthLabel');
  if (!calMonth) return;
  const y = calMonth.getFullYear();
  const m = calMonth.getMonth() + 1;
  label.textContent = y + '년 ' + m + '월';
  body.innerHTML = '<div class="empty">불러오는 중<' + '/div>';
  const first = y + pad(m) + '01';
  const daysInMonth = new Date(y, m, 0).getDate();
  try{
    const url = API + '?type=schedule&days=' + daysInMonth + '&date=' + encodeURIComponent(first);
    const res = await fetch(url, { cache:'no-store' });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || '일정 오류');
    calEvents = Array.isArray(json.data) ? json.data : [];
    renderMonthCalendar();
  }catch(err){
    console.error(err);
    body.innerHTML = '<div class="empty">학사일정을 불러오지 못했습니다<' + '/div>';
  }
}

function renderMonthCalendar(){
  const body = document.getElementById('calMonthBody');
  if (!calMonth) return;
  const y = calMonth.getFullYear();
  const m = calMonth.getMonth();
  const firstDow = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const today = todayYmd();
  const byDate = {};
  calEvents.forEach(function(e){
    if (!e || !e.date || !e.name) return;
    if (HIDE_EVENTS.some(function(k){ return e.name.indexOf(k) >= 0; })) return;
    if (!byDate[e.date]) byDate[e.date] = [];
    byDate[e.date].push(e.name);
  });

  const heads = ['일','월','화','수','목','금','토'].map(function(d, i){
    const cls = i === 0 ? ' class="sun"' : (i === 6 ? ' class="sat"' : '');
    return '<th' + cls + '>' + d + '<' + '/th>';
  }).join('');

  let cells = '';
  const total = Math.ceil((firstDow + daysInMonth) / 7) * 7;
  for (let i = 0; i < total; i++){
    const dayNum = i - firstDow + 1;
    if (dayNum < 1 || dayNum > daysInMonth){
      cells += '<td class="mute"><' + '/td>';
    } else {
      const ymd = y + pad(m + 1) + pad(dayNum);
      const dow = i % 7;
      const cls = [
        dow === 0 ? 'sun' : '',
        dow === 6 ? 'sat' : '',
        ymd === today ? 'today' : ''
      ].filter(Boolean).join(' ');
      const events = (byDate[ymd] || []).slice(0, 3)
        .map(function(name){ return '<span class="ev">' + esc(name) + '<' + '/span>'; }).join('');
      cells += '<td' + (cls ? ' class="' + cls + '"' : '') + '>'
            + '<div class="num">' + dayNum + '<' + '/div>' + events + '<' + '/td>';
    }
    if ((i + 1) % 7 === 0) cells += '<' + '/tr><tr>';
  }

  body.innerHTML = '<table><thead><tr>' + heads + '<' + '/tr><' + '/thead><tbody><tr>'
                 + cells.replace(new RegExp('<' + '/tr><tr>$'), '') + '<' + '/tr><' + '/tbody><' + '/table>';
}

function renderNotes(){
  const box = document.getElementById('note');
  const n = DATA.notices;
  const list = (n && n.ok && n.value) ? n.value.slice(0, 2) : [];
  if (!list.length){ box.classList.remove('show'); box.innerHTML = ''; return; }
  box.innerHTML = list.map(function(x){
    const who = x.scope === 'school' ? '전교' : '담임';
    return '<div class="item"><span class="who">' + ICON.pin + who + '<' + '/span>'
         + '<span class="text">' + esc(x.text) + '<' + '/span><' + '/div>';
  }).join('');
  box.classList.add('show');
}

function tick(){
  const now = new Date();
  document.getElementById('clock').textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());
  updateNowLabel(now);
  if (DATA) renderSlots();
}

function updateNowLabel(now){
  const d = now || new Date();
  const weekdays = ['일','월','화','수','목','금','토'];
  document.getElementById('nowLabel').textContent =
    (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + weekdays[d.getDay()] + '요일';
}

function currentSlot(now){
  if (isPreview()) return null;
  const m = minutesOf(now || new Date());
  for (let i = 0; i < PERIODS.length; i++){
    const p = PERIODS[i], s = toMin(p.start), e = toMin(p.end);
    if (m >= s && m < e) return { name:p.name, period:p.period, startMin:s, endMin:e };
  }
  return null;
}

function showSetup(editing){
  const box = document.getElementById('setup');
  const g = document.getElementById('selGrade');
  const c = document.getElementById('selClass');
  const save = document.getElementById('btnSave');
  const cancel = document.getElementById('btnCancelSetup');
  const hint = document.getElementById('setupHint');
  const structure = { 1:7, 2:7, 3:6 };

  closeCalModal(); hideTip();

  function fillClasses(){
    const prev = c.value || CLASS || '';
    c.innerHTML = '';
    const max = structure[Number(g.value)] || 10;
    for (let i = 1; i <= max; i++) c.add(new Option(i + '반', String(i)));
    if (prev && Number(prev) <= max) c.value = String(prev);
  }

  box.classList.add('show');
  document.body.style.cursor = 'auto';
  document.body.classList.remove('idle');

  if (!setupReady){
    g.innerHTML = '';
    [1,2,3].forEach(function(n){ g.add(new Option(n + '학년', String(n))); });
    g.addEventListener('change', fillClasses);
    save.addEventListener('click', function(){
      const nextGrade = g.value;
      const nextClass = c.value;
      if (!nextGrade || !nextClass) return;
      localStorage.setItem('grade', nextGrade);
      localStorage.setItem('class', nextClass);
      location.replace(
        location.pathname
        + '?grade=' + encodeURIComponent(nextGrade)
        + '&class=' + encodeURIComponent(nextClass)
      );
    });
    cancel.addEventListener('click', function(){
      if (!GRADE || !CLASS) return;
      box.classList.remove('show');
    });
    setupReady = true;
  }

  if (GRADE) g.value = String(GRADE);
  else if (!g.value) g.value = '1';
  fillClasses();
  if (CLASS) c.value = String(CLASS);

  if (editing && GRADE && CLASS){
    hint.textContent = '학년·반을 바꾼 뒤 저장하세요';
    save.textContent = '저장하기';
    cancel.hidden = false;
  } else {
    hint.textContent = '한 번만 설정하면 다음부터는 바로 시작합니다';
    save.textContent = '시작하기';
    cancel.hidden = true;
  }
}

function toMin(hhmm){ const p = String(hhmm).split(':'); return +p[0] * 60 + +p[1]; }
function todayYmd(){ const d = new Date();
  return d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()); }
function shortDate(ymd){
  return Number(ymd.slice(4,6)) + '.' + Number(ymd.slice(6,8));
}
function weekdayOf(ymd){
  const weekdays = ['일','월','화','수','목','금','토'];
  const d = new Date(+ymd.slice(0,4), +ymd.slice(4,6)-1, +ymd.slice(6,8));
  return weekdays[d.getDay()];
}
function formatDotDate(ymd, weekday){
  return shortDate(ymd) + '.(' + (weekday || weekdayOf(ymd)) + ')';
}
function shiftYmd(ymd, step){
  const d = new Date(+ymd.slice(0,4), +ymd.slice(4,6)-1, +ymd.slice(6,8));
  d.setDate(d.getDate() + step);
  return d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate());
}
function minutesOf(d){ return d.getHours()*60 + d.getMinutes() + d.getSeconds()/60; }
function pad(n){ return String(n).padStart(2,'0'); }
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
